[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "axven-native"
version = "0.1.0"
description = "Dormant deterministic native acceleration boundary for Axven"
requires-python = ">=3.13.15,<3.14"

[tool.maturin]
bindings = "pyo3"
module-name = "axven_native"
features = ["extension-module"]
