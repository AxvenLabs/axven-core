name: SEC-145 Apply

on:
  workflow_dispatch:
  push:
    branches:
      - security-sec145-rpc-request-framing

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply SEC-145
        shell: pwsh
        run: |
          python .github/sec145_apply.py
      - name: Remove one-shot automation
        shell: pwsh
        run: |
          Remove-Item .github/sec145_apply.py
          Remove-Item .github/workflows/sec145-apply.yml
      - name: Focused validation
        shell: pwsh
        run: |
          python security_sec034_rpc_content_type_spec.py
          python security_sec091_rpc_absolute_request_deadline_spec.py
          python security_sec092_rpc_host_header_guard_spec.py
          python security_sec094_rpc_exact_body_length_spec.py
          python security_sec127_rpc_json_preparse_depth_spec.py
          python security_sec130_rpc_json_preparse_complexity_spec.py
          python security_sec145_rpc_request_framing_spec.py
          python release_packaging_test.py
      - name: Commit hardened tree
        shell: pwsh
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SEC-145: Harden RPC request framing"
          git push origin HEAD:security-sec145-rpc-request-framing
