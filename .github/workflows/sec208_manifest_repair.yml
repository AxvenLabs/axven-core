name: SEC-208 one-shot manifest repair

on:
  push:
    branches:
      - security-sec208-legacy-release-provenance

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Refresh packaging-test manifest entry
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path("release_manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          data = Path("release_packaging_test.py").read_bytes()
          manifest["files"]["release_packaging_test.py"] = {
              "bytes": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
          }
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")
          PY
      - name: Commit manifest and remove one-shot gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sec208_manifest_repair.yml
          git add release_manifest.json
          git diff --cached --check
          git commit -m "SEC-208: refresh packaging-test manifest"
          git push
