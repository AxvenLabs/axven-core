name: SEC-126 Apply

on:
  push:
    branches:
      - security-sec126-peer-config-resource-bounds
    paths:
      - .github/workflows/sec126_apply.yml
      - .github/sec126_patch.py
      - .github/sec126_fix_spec.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Apply and validate SEC-126
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          chcp 65001
          python -m pip install --upgrade pip
          python -m pip install -e .
          python .github/sec126_patch.py
          python .github/sec126_fix_spec.py
          python security_sec126_peer_config_resource_bounds_spec.py
          python checkpoint41_peer_persistence_spec.py
          python security_sec110_peer_config_atomic_file_spec.py
          python core_rpc_test.py
          python release_packaging_test.py
          python run_full_validation.py
          python security_tail_runner.py
      - name: Commit production patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name "AxvenLabs"
          git config user.email "dogacan432@gmail.com"
          git add core.py datadir.py release_manifest.json security_sec126_peer_config_resource_bounds_spec.py
          git diff --cached --check
          git commit -m "SEC-126: Bound configured peer resources"
          git push origin HEAD:security-sec126-peer-config-resource-bounds
      - name: Remove temporary apply files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git rm .github/workflows/sec126_apply.yml .github/sec126_patch.py .github/sec126_fix_spec.py
          git commit -m "SEC-126: remove temporary apply workflow"
          git push origin HEAD:security-sec126-peer-config-resource-bounds
