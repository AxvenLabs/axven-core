name: SEC-144 Apply

on:
  workflow_dispatch:
  push:
    branches:
      - security-sec144-peer-port-type-domain

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply SEC-144
        shell: pwsh
        run: |
          python .github/sec144_apply.py
      - name: Remove one-shot automation
        shell: pwsh
        run: |
          Remove-Item .github/sec144_apply.py
          Remove-Item .github/workflows/sec144-apply.yml
      - name: Focused validation
        shell: pwsh
        run: |
          python checkpoint39_peer_management_spec.py
          python checkpoint42_peer_reconnect_spec.py
          python security_sec047_rpc_peer_port_bounds_spec.py
          python security_sec048_rpc_start_p2p_port_bounds_spec.py
          python security_sec073_rpc_peer_port_numeric_types_spec.py
          python security_sec126_peer_config_resource_bounds_spec.py
          python security_sec143_peer_host_type_domain_spec.py
          python security_sec144_peer_port_type_domain_spec.py
          python release_packaging_test.py
      - name: Commit hardened tree
        shell: pwsh
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SEC-144: Enforce exact peer port types"
          git push origin HEAD:security-sec144-peer-port-type-domain
