name: SEC-197 one-shot source assertion repair

on:
  push:
    branches:
      - security-sec197-peer-diversity

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Repair format-independent source ordering assertion
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          p=Path('security_sec197_peer_diversity_spec.py')
          text=p.read_text(encoding='utf-8')
          old='''        "_validate_peer_diversity([*self.outbound_peers,addr])" in add_src\n        and add_src.index("_validate_peer_diversity([*self.outbound_peers,addr])")\n            < add_src.index("self.outbound_peers.append(addr)")\n        and "_validate_peer_diversity(normalized)" in save_src\n        and "return AxvenCore._validate_peer_diversity(peers)" in load_src,\n'''
          new='''        "_validate_peer_diversity" in add_src\n        and add_src.index("_validate_peer_diversity")\n            < add_src.index("self.outbound_peers.append(addr)")\n        and "_validate_peer_diversity" in save_src\n        and "_validate_peer_diversity" in load_src,\n'''
          if text.count(old) != 1:
              raise SystemExit('SEC-197 source assertion repair anchor mismatch')
          p.write_text(text.replace(old,new),encoding='utf-8',newline='\n')

          manifest_path=Path('release_manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          data=p.read_bytes()
          manifest['files'][p.as_posix()]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}

          Path('.github/workflows/sec197_source_fix.yml').unlink()
          manifest_path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          PY
          python3 -m py_compile security_sec197_peer_diversity_spec.py
          python3 security_sec197_peer_diversity_spec.py
          git diff --check

      - name: Commit repaired final tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SEC-197: make source ordering regression format-independent"
          git push origin HEAD:security-sec197-peer-diversity
