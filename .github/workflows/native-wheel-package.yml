name: Axven Native Wheel Package

on:
  push:
    paths:
      - "native/**"
      - "RUST_007.md"
      - "rust_007_native_wheel_package_spec.py"
      - "requirements-native-build.lock"
      - ".github/workflows/native-wheel-package.yml"
  pull_request:
    paths:
      - "native/**"
      - "RUST_007.md"
      - "rust_007_native_wheel_package_spec.py"
      - "requirements-native-build.lock"
      - ".github/workflows/native-wheel-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-wheel-package:
    name: wheel-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYO3_PYTHON: python
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install hash-locked maturin frontend
        run: python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-native-build.lock

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          python --version
          rustc --version
          cargo --version
          python -m maturin --version

      - name: Build unpublished locked native wheel
        run: python -m maturin build --release --locked --manifest-path native/axven_native/Cargo.toml --interpreter python --out wheelhouse

      - name: Inspect, clean-install, and probe wheel
        run: python rust_007_native_wheel_package_spec.py
