name: SEC-189 SEC-102 Manifest Refresh

on:
  push:
    branches:
      - security-sec189-p2p-coinbase-canonicality
    paths:
      - .github/workflows/sec189-refresh-sec102-manifest.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security-sec189-p2p-coinbase-canonicality
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Refresh SEC-102 manifest entry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          from pathlib import Path
          name = 'security_sec102_p2p_tx_input_fields_spec.py'
          p = Path(name)
          mpath = Path('release_manifest.json')
          m = json.loads(mpath.read_text(encoding='utf-8'))
          if name not in m.get('files', {}):
              raise SystemExit('SEC-102 manifest entry missing')
          data = p.read_bytes()
          m['files'][name]['bytes'] = len(data)
          m['files'][name]['sha256'] = hashlib.sha256(data).hexdigest()
          mpath.write_text(json.dumps(m, indent=2, sort_keys=False) + '\n', encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add release_manifest.json
          git diff --cached --check
          git commit -m "SEC-189: refresh SEC-102 manifest entry"
          git push origin HEAD:security-sec189-p2p-coinbase-canonicality
