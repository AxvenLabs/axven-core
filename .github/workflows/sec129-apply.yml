name: SEC-129 branch applicator

on:
  push:
    branches:
      - security-sec129-wallet-inner-material-canonicality

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply SEC-129
        run: python .github/sec129_apply.py
      - name: Focused SEC-129 validation
        run: |
          python security_sec128_wallet_backup_json_preparse_depth_spec.py
          python security_sec129_wallet_inner_material_canonicality_spec.py
          python release_packaging_test.py
      - name: Commit clean SEC-129 tree
        shell: pwsh
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SEC-129: Canonicalize wallet backup key material"
          git push origin HEAD:security-sec129-wallet-inner-material-canonicality
