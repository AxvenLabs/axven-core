name: SEC-197 one-shot apply

on:
  push:
    branches:
      - security-sec197-peer-diversity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply SEC-197 hardening
        shell: bash
        run: |
          python3 sec197_apply.py
          python3 -m py_compile core.py datadir.py security_sec197_peer_diversity_spec.py
          git diff --check

      - name: Commit final SEC-197 tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SEC-197: enforce outbound peer diversity groups"
          git push origin HEAD:security-sec197-peer-diversity
