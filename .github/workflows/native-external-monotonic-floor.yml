name: Axven Native External Monotonic Floor

on:
  push:
    paths:
      - "rust_030_stdlib_material_verify.py"
      - "rust_031_stdlib_trust_state_material_verify.py"
      - "RUST_032.md"
      - "rust_032_external_monotonic_floor_verify.py"
      - "rust_032_external_monotonic_floor_policy_spec.py"
      - ".github/workflows/native-external-monotonic-floor.yml"
  pull_request:
    paths:
      - "rust_030_stdlib_material_verify.py"
      - "rust_031_stdlib_trust_state_material_verify.py"
      - "RUST_032.md"
      - "rust_032_external_monotonic_floor_verify.py"
      - "rust_032_external_monotonic_floor_policy_spec.py"
      - ".github/workflows/native-external-monotonic-floor.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  external-monotonic-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AXVEN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: RUST-032 static external-floor policy
        run: python rust_032_external_monotonic_floor_policy_spec.py

      - name: Generate canonical RUST-031 state and independent TEST-ONLY floor
        shell: bash
        run: |
          set -euo pipefail
          fixture=/tmp/axven-rust032-fixture
          floor=/tmp/axven-rust032-external-floor.json
          rm -rf "$fixture" "$floor"
          mkdir -p "$fixture"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import rust_030_stdlib_material_verify as material_verify
          import rust_031_stdlib_trust_state_material_verify as trust_verify

          source_sha = os.environ["AXVEN_SOURCE_SHA"]
          if len(source_sha) != 40 or any(ch not in "0123456789abcdef" for ch in source_sha):
              raise AssertionError("invalid RUST-032 source SHA")

          genesis = {
              "schema": trust_verify.STATE_SCHEMA,
              "sequence": 0,
              "scope": trust_verify.MATERIAL_PAYLOAD_TYPE,
              "key_id": trust_verify.OLD_KEY_ID,
              "public_key": trust_verify.OLD_PUBLIC_KEY.hex(),
              "activation_source_commit": None,
              "predecessor_sha256": None,
              "transition_sha256": None,
              "production": False,
          }
          transition = {
              "schema": trust_verify.TRANSITION_SCHEMA,
              "sequence": 1,
              "scope": trust_verify.MATERIAL_PAYLOAD_TYPE,
              "from_key_id": trust_verify.OLD_KEY_ID,
              "from_public_key": trust_verify.OLD_PUBLIC_KEY.hex(),
              "to_key_id": trust_verify.NEW_KEY_ID,
              "to_public_key": trust_verify.NEW_PUBLIC_KEY.hex(),
              "activation_source_commit": source_sha,
              "production": False,
          }
          genesis_raw = material_verify.canonical(genesis)
          transition_raw = material_verify.canonical(transition)
          final_state = {
              "schema": trust_verify.STATE_SCHEMA,
              "sequence": 1,
              "scope": trust_verify.MATERIAL_PAYLOAD_TYPE,
              "key_id": trust_verify.NEW_KEY_ID,
              "public_key": trust_verify.NEW_PUBLIC_KEY.hex(),
              "activation_source_commit": source_sha,
              "predecessor_sha256": hashlib.sha256(genesis_raw).hexdigest(),
              "transition_sha256": hashlib.sha256(transition_raw).hexdigest(),
              "production": False,
          }
          final_raw = material_verify.canonical(final_state)
          trust_verify.validate_genesis(genesis_raw, genesis)
          trust_verify.validate_final_state(final_raw, final_state, genesis_raw, transition_raw, source_sha)

          floor_record = {
              "schema": "axven-native-external-monotonic-floor-v1",
              "provider": "test-only-monotonic-floor-simulator",
              "sequence": 1,
              "scope": trust_verify.MATERIAL_PAYLOAD_TYPE,
              "key_id": final_state["key_id"],
              "public_key": final_state["public_key"],
              "activation_source_commit": source_sha,
              "state_sha256": hashlib.sha256(final_raw).hexdigest(),
              "production": False,
          }

          Path("/tmp/axven-rust032-fixture/final-state.json").write_bytes(final_raw)
          Path("/tmp/axven-rust032-external-floor.json").write_bytes(material_verify.canonical(floor_record))
          PY
          test -f "$fixture/final-state.json"
          test -f "$floor"
          chmod 0444 "$floor"
          test "$(stat -c '%a' "$floor")" = "444"

      - name: Stage detached RUST-032 consumer without floor evidence
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust032-consumer
          rm -rf "$consumer"
          mkdir -p "$consumer"
          cp rust_030_stdlib_material_verify.py "$consumer/"
          cp rust_031_stdlib_trust_state_material_verify.py "$consumer/"
          cp rust_032_external_monotonic_floor_verify.py "$consumer/"
          cp /tmp/axven-rust032-fixture/final-state.json "$consumer/"
          test "$(find "$consumer" -maxdepth 1 -type f | wc -l)" -eq 4
          test "$(find "$consumer" -type l | wc -l)" -eq 0
          test ! -e "$consumer/.git"
          test ! -e "$consumer/external-floor.json"

      - name: Verify detached RUST-032 consumer against external floor
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust032-consumer
          floor=/tmp/axven-rust032-external-floor.json
          cd "$consumer"
          env -i \
            HOME=/tmp \
            PATH=/usr/bin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONNOUSERSITE=1 \
            /usr/bin/python3 -S rust_032_external_monotonic_floor_verify.py verify \
              final-state.json "$floor" "$AXVEN_SOURCE_SHA" 1

      - name: RUST-032 external-floor fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust032-consumer
          floor=/tmp/axven-rust032-external-floor.json
          cd "$consumer"
          env -i \
            HOME=/tmp \
            PATH=/usr/bin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONNOUSERSITE=1 \
            /usr/bin/python3 -S rust_032_external_monotonic_floor_verify.py selftest \
              final-state.json "$floor" "$AXVEN_SOURCE_SHA" 1

      - name: Reverify pristine external floor and detached consumer
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust032-consumer
          floor=/tmp/axven-rust032-external-floor.json
          test "$(stat -c '%a' "$floor")" = "444"
          test ! -e "$consumer/external-floor.json"
          cd "$consumer"
          env -i \
            HOME=/tmp \
            PATH=/usr/bin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONNOUSERSITE=1 \
            /usr/bin/python3 -S rust_032_external_monotonic_floor_verify.py verify \
              final-state.json "$floor" "$AXVEN_SOURCE_SHA" 1
