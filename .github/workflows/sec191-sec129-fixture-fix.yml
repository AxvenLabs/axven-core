name: SEC-191 SEC-129 Fixture Repair

on:
  push:
    branches:
      - security-sec191-wallet-kdf-strength
    paths:
      - .github/workflows/sec191-sec129-fixture-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
      - name: Repair SEC-129 fixture and refresh manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          path = Path("security_sec129_wallet_inner_material_canonicality_spec.py")
          text = path.read_text(encoding="utf-8")
          old = '''        p=kp["p"],\n        dklen=kp["dklen"],\n    )'''
          new = '''        p=kp["p"],\n        dklen=kp["dklen"],\n        maxmem=wallet._SCRYPT_MAXMEM,\n    )'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"SEC-129 scrypt fixture anchor count={count}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          manifest_path = Path("release_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          name = "security_sec129_wallet_inner_material_canonicality_spec.py"
          data = Path(name).read_bytes()
          manifest["files"][name] = {
              "bytes": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          git diff --check
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add security_sec129_wallet_inner_material_canonicality_spec.py release_manifest.json
          git diff --cached --quiet && { echo "SEC-129 fixture repair produced no changes"; exit 1; }
          git commit -m "SEC-191: align SEC-129 fixture with KDF memory ceiling"
          git push origin HEAD:security-sec191-wallet-kdf-strength