name: SEC-133 Apply

on:
  push:
    branches:
      - security-sec133-p2p-handshake-admission-rate

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply SEC-133
        shell: pwsh
        run: python .github/sec133_apply.py
      - name: SEC-105 concurrent quota regression
        shell: pwsh
        run: python security_sec105_p2p_inbound_per_host_bounds_spec.py
      - name: SEC-115 handshake frame regression
        shell: pwsh
        run: python security_sec115_p2p_handshake_frame_budget_spec.py
      - name: SEC-124 message-rate regression
        shell: pwsh
        run: python security_sec124_p2p_message_rate_budget_spec.py
      - name: SEC-133 regression
        shell: pwsh
        run: python security_sec133_p2p_handshake_admission_rate_spec.py
      - name: Commit clean branch
        shell: pwsh
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git add -A
          git commit -m "SEC-133: Bound inbound handshake admission rate"
          git push origin HEAD:security-sec133-p2p-handshake-admission-rate
