name: Axven Native Monitor Rotation Journal Observer Rotation Journal Monitor Rotation Journal Observer Set Rotation

on:
  push:
    paths:
      - "requirements-ci-runtime-posix.lock"
      - "rust_0*.py"
      - "RUST_0*.md"
      - ".github/workflows/native-monitor-rotation-journal-observer-rotation-journal-monitor-rotation-journal-observer-set-rotation.yml"
  pull_request:
    paths:
      - "requirements-ci-runtime-posix.lock"
      - "rust_0*.py"
      - "RUST_0*.md"
      - ".github/workflows/native-monitor-rotation-journal-observer-rotation-journal-monitor-rotation-journal-observer-set-rotation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  rust079:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AXVEN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Install hash-locked producer dependency
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock
      - name: RUST-079 static observer-set rotation policy
        run: |
          python rust_078_monitor_rotation_journal_observer_rotation_journal_monitor_rotation_journal_observer_policy_spec.py
          python rust_079_monitor_rotation_journal_observer_rotation_journal_monitor_rotation_journal_observer_set_rotation_policy_spec.py
      - name: Generate reviewed continuity and observer-set rotation evidence
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq -w 36 79); do
            files=(rust_0${n}_*_fixture.py)
            test "${#files[@]}" -eq 1
            python "${files[0]}" "$AXVEN_SOURCE_SHA"
          done
      - name: Make continuity evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq -w 36 79); do
            files=(/tmp/axven-rust0${n}-*.json)
            test -e "${files[0]}"
            chmod 0444 "${files[@]}"
          done
          for f in /tmp/axven-rust079-*.json; do test "$(stat -c '%a' "$f")" = "444"; done
      - name: Stage detached RUST-079 consumer
        shell: bash
        run: |
          set -euo pipefail
          c=/tmp/axven-rust079-consumer
          rm -rf "$c"
          mkdir -p "$c"
          for n in $(seq -w 30 79); do
            files=(rust_0${n}_*_verify.py)
            test "${#files[@]}" -eq 1
            cp "${files[0]}" "$c/"
          done
          cp rust_079_monitor_rotation_journal_observer_rotation_journal_monitor_rotation_journal_observer_set_rotation_selftest.py "$c/"
          cp /tmp/axven-rust036-final-state.json "$c/final-state.json"
          test "$(find "$c" -maxdepth 1 -type f | wc -l)" -eq 52
          test "$(find "$c" -type l | wc -l)" -eq 0
          test ! -e "$c/.git"
          test ! -e "$c/rust_079_monitor_rotation_journal_observer_rotation_journal_monitor_rotation_journal_observer_set_rotation_fixture.py"
      - name: Write detached evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/axven-rust079-paths <<'EOF'
          final-state.json
          /tmp/axven-rust036-external-floor.json
          /tmp/axven-rust036-first-rotation.json
          /tmp/axven-rust036-first-auth.json
          /tmp/axven-rust036-first-quorum.json
          /tmp/axven-rust036-second-rotation.json
          /tmp/axven-rust036-second-auth.json
          /tmp/axven-rust036-final-quorum.json
          /tmp/axven-rust037-prefix-journal.json
          /tmp/axven-rust037-prefix-checkpoint.json
          /tmp/axven-rust037-final-journal.json
          /tmp/axven-rust037-final-checkpoint.json
          /tmp/axven-rust038-observer-bundle.json
          /tmp/axven-rust039-observer-set-rotation.json
          /tmp/axven-rust039-observer-set-rotation-auth.json
          /tmp/axven-rust039-successor-observer-bundle.json
          /tmp/axven-rust040-second-observer-set-rotation.json
          /tmp/axven-rust040-second-observer-set-rotation-auth.json
          /tmp/axven-rust040-final-observer-bundle.json
          /tmp/axven-rust041-prefix-observer-journal.json
          /tmp/axven-rust041-prefix-observer-checkpoint.json
          /tmp/axven-rust041-final-observer-journal.json
          /tmp/axven-rust041-final-observer-checkpoint.json
          /tmp/axven-rust042-monitor-bundle.json
