          /tmp/axven-rust076-final-monitor-bundle.json
          /tmp/axven-rust077-prefix-monitor-rotation-journal.json
          /tmp/axven-rust077-prefix-monitor-rotation-checkpoint.json
          /tmp/axven-rust077-final-monitor-rotation-journal.json
          /tmp/axven-rust077-final-monitor-rotation-checkpoint.json
          /tmp/axven-rust078-monitor-rotation-journal-observer-bundle.json
          /tmp/axven-rust079-observer-set-rotation.json
          /tmp/axven-rust079-observer-set-rotation-auth.json
          /tmp/axven-rust079-successor-observer-bundle.json
          EOF
          test "$(wc -l < /tmp/axven-rust079-paths)" -eq 126
          chmod 0444 /tmp/axven-rust079-paths
      - name: Verify detached RUST-079 rotation and fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/axven-rust079-consumer
          mapfile -t paths < /tmp/axven-rust079-paths
          test "${#paths[@]}" -eq 126
          py=(env -i HOME=/tmp PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 /usr/bin/python3 -S)
          "${py[@]}" rust_079_monitor_rotation_journal_observer_rotation_journal_monitor_rotation_journal_observer_set_rotation_verify.py verify "${paths[@]}" "$AXVEN_SOURCE_SHA" 1
          "${py[@]}" rust_079_monitor_rotation_journal_observer_rotation_journal_monitor_rotation_journal_observer_set_rotation_selftest.py "${paths[@]}" /tmp/axven-rust079-successor-fork-observer-bundle.json "$AXVEN_SOURCE_SHA" 1
          test "$(stat -c '%a' /tmp/axven-rust079-paths)" = "444"
          for f in /tmp/axven-rust079-*.json; do test "$(stat -c '%a' "$f")" = "444"; done
          "${py[@]}" rust_079_monitor_rotation_journal_observer_rotation_journal_monitor_rotation_journal_observer_set_rotation_verify.py verify "${paths[@]}" "$AXVEN_SOURCE_SHA" 1
