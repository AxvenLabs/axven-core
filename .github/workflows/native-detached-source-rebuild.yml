name: Axven Native Detached Source Rebuild

on:
  push:
    paths:
      - "native/axven_native/**"
      - "RUST_018.md"
      - "rust_018_detached_rebuild_verify.py"
      - "rust_018_detached_rebuild_policy_spec.py"
      - "rust_014_reproducible_attestation.py"
      - "rust_014_reproducible_attestation_policy_spec.py"
      - "rust_015_offline_repro_consumer_verify.py"
      - "rust_016_offline_build_input_verify.py"
      - "rust_017_offline_git_tree_verify.py"
      - "rust_009_portable_linux_wheel_spec.py"
      - "rust_013_reproducible_wheel_spec.py"
      - "rust_013_reproducible_build_policy_spec.py"
      - "requirements-native-build.lock"
      - "requirements-ci-runtime-posix.lock"
      - ".github/workflows/native-reproducible-build.yml"
      - ".github/workflows/native-detached-source-rebuild.yml"
  pull_request:
    paths:
      - "native/axven_native/**"
      - "RUST_018.md"
      - "rust_018_detached_rebuild_verify.py"
      - "rust_018_detached_rebuild_policy_spec.py"
      - "rust_014_reproducible_attestation.py"
      - "rust_014_reproducible_attestation_policy_spec.py"
      - "rust_015_offline_repro_consumer_verify.py"
      - "rust_016_offline_build_input_verify.py"
      - "rust_017_offline_git_tree_verify.py"
      - "rust_009_portable_linux_wheel_spec.py"
      - "rust_013_reproducible_wheel_spec.py"
      - "rust_013_reproducible_build_policy_spec.py"
      - "requirements-native-build.lock"
      - "requirements-ci-runtime-posix.lock"
      - ".github/workflows/native-reproducible-build.yml"
      - ".github/workflows/native-detached-source-rebuild.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:443eabd378e140996780a772e12c1a1ef10551da933fe76d74a1bab61f68a7b7

jobs:
  detached-source-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AXVEN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install hash-locked Axven runtime dependencies
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock

      - name: Install exact host Rust toolchain for controlled mounts
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          python -c "import platform; assert platform.python_version() == '3.13.15', platform.python_version()"
          rustc --version | grep -F "rustc 1.98.0 "
          cargo --version | grep -F "cargo 1.98.0 "

      - name: RUST-013 static reproducible build policy
        run: python rust_013_reproducible_build_policy_spec.py

      - name: RUST-014 static reproducibility attestation policy
        run: python rust_014_reproducible_attestation_policy_spec.py

      - name: RUST-017 static detached Git tree policy
        run: python rust_017_offline_git_tree_policy_spec.py

      - name: RUST-018 static detached rebuild policy
        run: python rust_018_detached_rebuild_policy_spec.py

      - name: Derive source-bound reproducibility epoch
        id: epoch
        shell: bash
        run: |
          set -euo pipefail
          checkout="$(git rev-parse HEAD)"
          test "$checkout" = "$AXVEN_SOURCE_SHA"
          source_epoch="$(git show -s --format=%ct "$AXVEN_SOURCE_SHA")"
          case "$source_epoch" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          test "$source_epoch" -ge 315532800
          printf 'epoch=%s\n' "$source_epoch" >> "$GITHUB_OUTPUT"
          printf 'RUST-018 SOURCE_DATE_EPOCH=%s source=%s\n' "$source_epoch" "$AXVEN_SOURCE_SHA"

      - name: Pull and verify immutable manylinux image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$MANYLINUX_IMAGE"
          resolved="$(docker image inspect "$MANYLINUX_IMAGE" --format '{{index .RepoDigests 0}}')"
          test "$resolved" = "$MANYLINUX_IMAGE"

      - name: Build RUST-018 reference candidates
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          set -euo pipefail
          for candidate in a b; do
            target=".rust018-target-$candidate"
            tools=".rust018-tools-$candidate"
            wheelhouse="wheelhouse-repro-$candidate"
            rm -rf "$target" "$tools" "$wheelhouse"
            mkdir -p "$tools" "$wheelhouse"
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp \
              -e CARGO_HOME=/cargo \
              -e RUSTUP_HOME=/rustup \
              -e RUSTUP_TOOLCHAIN=1.98.0 \
              -e PYO3_PYTHON=/opt/python/cp313-cp313/bin/python \
              -e SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
              -e CARGO_INCREMENTAL=0 \
              -e PYTHONHASHSEED=0 \
              -e TZ=UTC \
              -e LC_ALL=C.UTF-8 \
              -e CARGO_TARGET_DIR="/work/$target" \
              -e CANDIDATE_TOOLS="/work/$tools" \
              -e CANDIDATE_WHEELHOUSE="/work/$wheelhouse" \
              -e PATH=/cargo/bin:/opt/python/cp313-cp313/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              -v "$GITHUB_WORKSPACE:/work" \
              -v "$HOME/.cargo:/cargo" \
              -v "$HOME/.rustup:/rustup:ro" \
              -w /work \
              "$MANYLINUX_IMAGE" \
              /bin/bash -lc '
                set -euo pipefail
                python -c "import platform; assert platform.python_version() == \"3.13.13\", platform.python_version()"
                rustc --version | grep -F "rustc 1.98.0 "
                cargo --version | grep -F "cargo 1.98.0 "
                python -m pip install --no-deps --only-binary=:all: --require-hashes --target "$CANDIDATE_TOOLS" -r /work/requirements-native-build.lock
                export PYTHONPATH="$CANDIDATE_TOOLS"
                export PATH="$CANDIDATE_TOOLS/bin:$PATH"
                test "$(maturin --version)" = "maturin 1.15.0"
                maturin build --release --locked --compatibility manylinux_2_28 --manifest-path /work/native/axven_native/Cargo.toml --interpreter /opt/python/cp313-cp313/bin/python --out "$CANDIDATE_WHEELHOUSE"
                auditwheel show "$CANDIDATE_WHEELHOUSE"/*.whl
              '
            if [[ "$candidate" = a ]]; then sleep 2; fi
          done

      - name: Prove RUST-018 reference reproducibility
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          set -euo pipefail
          sha256sum wheelhouse-repro-a/*.whl wheelhouse-repro-b/*.whl
          python rust_013_reproducible_wheel_spec.py wheelhouse-repro-a wheelhouse-repro-b "$SOURCE_DATE_EPOCH"
          for candidate in a b; do
            rm -rf wheelhouse-portable
            mkdir wheelhouse-portable
            cp -- "wheelhouse-repro-$candidate"/*.whl wheelhouse-portable/
            python rust_009_portable_linux_wheel_spec.py
          done

      - name: Generate and seal RUST-014 TEST-ONLY reference evidence
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          set -euo pipefail
          rm -f reproducible-provenance.json reproducible-attestation.json
          python rust_014_reproducible_attestation.py generate reproducible-provenance.json
          python rust_014_reproducible_attestation.py seal reproducible-provenance.json reproducible-attestation.json
          python rust_014_reproducible_attestation.py verify reproducible-provenance.json reproducible-attestation.json
          python rust_014_reproducible_attestation.py selftest reproducible-provenance.json reproducible-attestation.json
          python rust_014_reproducible_attestation.py verify reproducible-provenance.json reproducible-attestation.json

      - name: Prepare authenticated RUST-018 rebuild source
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust018-consumer
          rebuild_source="$consumer/rebuild-source"
          rm -rf "$consumer"
          mkdir -p \
            "$consumer/build-a" \
            "$consumer/build-b" \
            "$consumer/source-inputs" \
            "$consumer/git-objects/trees" \
            "$rebuild_source/native/axven_native/src"
          cp rust_015_offline_repro_consumer_verify.py "$consumer/"
          cp rust_016_offline_build_input_verify.py "$consumer/"
          cp rust_017_offline_git_tree_verify.py "$consumer/"
          cp rust_018_detached_rebuild_verify.py "$consumer/"
          cp wheelhouse-repro-a/*.whl "$consumer/build-a/"
          cp wheelhouse-repro-b/*.whl "$consumer/build-b/"
          cp reproducible-provenance.json "$consumer/"
          cp reproducible-attestation.json "$consumer/"
          inputs=(
            "native/axven_native/Cargo.toml"
            "native/axven_native/Cargo.lock"
            "native/axven_native/src/lib.rs"
            "requirements-native-build.lock"
            "requirements-ci-runtime-posix.lock"
            "rust_009_portable_linux_wheel_spec.py"
            "rust_013_reproducible_wheel_spec.py"
            "rust_013_reproducible_build_policy_spec.py"
            "rust_014_reproducible_attestation.py"
            "rust_014_reproducible_attestation_policy_spec.py"
            ".github/workflows/native-reproducible-build.yml"
          )
          for relative in "${inputs[@]}"; do
            mkdir -p "$consumer/source-inputs/$(dirname "$relative")"
            cp -- "$relative" "$consumer/source-inputs/$relative"
          done
          cp "$consumer/source-inputs/native/axven_native/Cargo.toml" "$rebuild_source/native/axven_native/Cargo.toml"
          cp "$consumer/source-inputs/native/axven_native/Cargo.lock" "$rebuild_source/native/axven_native/Cargo.lock"
          cp "$consumer/source-inputs/native/axven_native/src/lib.rs" "$rebuild_source/native/axven_native/src/lib.rs"
          cp native/axven_native/pyproject.toml "$rebuild_source/native/axven_native/pyproject.toml"
          cp native/axven_native/rust-toolchain.toml "$rebuild_source/native/axven_native/rust-toolchain.toml"
          git cat-file commit "$AXVEN_SOURCE_SHA" > "$consumer/git-objects/commit.object"
          test "$(git hash-object -t commit --stdin < "$consumer/git-objects/commit.object")" = "$AXVEN_SOURCE_SHA"
          root_tree="$(git rev-parse "$AXVEN_SOURCE_SHA^{tree}")"
          tree_paths=("" ".github" ".github/workflows" "native" "native/axven_native" "native/axven_native/src")
          for tree_path in "${tree_paths[@]}"; do
            if [[ -z "$tree_path" ]]; then oid="$root_tree"; else oid="$(git rev-parse "$AXVEN_SOURCE_SHA:$tree_path")"; fi
            git cat-file tree "$oid" > "$consumer/git-objects/trees/$oid.tree"
            test "$(git hash-object -t tree --stdin < "$consumer/git-objects/trees/$oid.tree")" = "$oid"
          done
          test ! -e "$consumer/.git"
          test ! -e "$rebuild_source/.git"
          test "$(find "$consumer/source-inputs" -type f | wc -l)" -eq 11
          test "$(find "$consumer/git-objects" -type f | wc -l)" -eq 7
          test "$(find "$rebuild_source" -type f | wc -l)" -eq 5
          test "$(find "$consumer" -type l | wc -l)" -eq 0

      - name: Authenticate detached RUST-018 rebuild source
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust018-consumer
          cd "$consumer"
          wheel_a="$(find build-a -maxdepth 1 -type f -name '*.whl' -print)"
          wheel_b="$(find build-b -maxdepth 1 -type f -name '*.whl' -print)"
          env -i HOME=/tmp PATH="$PATH" PYTHONUTF8=1 PYTHONIOENCODING=utf-8 PYTHONDONTWRITEBYTECODE=1 \
            python rust_018_detached_rebuild_verify.py sourcecheck \
              "$wheel_a" "$wheel_b" reproducible-provenance.json reproducible-attestation.json \
              source-inputs git-objects rebuild-source

      - name: Stage RUST-018 offline build tools and Cargo cache
        shell: bash
        run: |
          set -euo pipefail
          rebuild_tools=/tmp/axven-rust018-tools
          rebuild_cargo=/tmp/axven-rust018-cargo
          rm -rf "$rebuild_tools" "$rebuild_cargo"
          cp -a .rust018-tools-a "$rebuild_tools"
          cp -a "$HOME/.cargo" "$rebuild_cargo"
          test -x "$rebuild_tools/bin/maturin"
          test -x "$rebuild_cargo/bin/cargo"

      - name: Build RUST-018 detached source with network disabled
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust018-consumer
          rebuild_source="$consumer/rebuild-source"
          rebuild_tools=/tmp/axven-rust018-tools
          rebuild_cargo=/tmp/axven-rust018-cargo
          rebuild_output="$consumer/rebuilt-wheel"
          rm -rf "$rebuild_output"
          mkdir -p "$rebuild_output"
          test ! -e "$rebuild_source/.git"
          test "$(find "$rebuild_source" -type f | wc -l)" -eq 5
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_HOME=/cargo \
            -e RUSTUP_HOME=/rustup \
            -e RUSTUP_TOOLCHAIN=1.98.0 \
            -e PYO3_PYTHON=/opt/python/cp313-cp313/bin/python \
            -e SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_NET_OFFLINE=true \
            -e PYTHONHASHSEED=0 \
            -e TZ=UTC \
            -e LC_ALL=C.UTF-8 \
            -e CARGO_TARGET_DIR=/tmp/axven-rust018-target \
            -e PYTHONPATH=/tools \
            -e PATH=/cargo/bin:/tools/bin:/opt/python/cp313-cp313/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "$rebuild_source/native/axven_native:/src:ro" \
            -v "$rebuild_source/native/axven_native:/work/native/axven_native:ro" \
            -v "$rebuild_tools:/tools:ro" \
            -v "$rebuild_cargo:/cargo" \
            -v "$HOME/.rustup:/rustup:ro" \
            -v "$rebuild_output:/out" \
            -w /work \
            "$MANYLINUX_IMAGE" \
            /bin/bash -lc '
              set -euo pipefail
              test ! -e /work/.git
              test ! -e /work/native/axven_native/.git
              test "$(find /work/native/axven_native -type f | wc -l)" -eq 5
              python -c "import platform; assert platform.python_version() == \"3.13.13\", platform.python_version()"
              rustc --version | grep -F "rustc 1.98.0 "
              cargo --version | grep -F "cargo 1.98.0 "
              test "$(maturin --version)" = "maturin 1.15.0"
              test "$CARGO_NET_OFFLINE" = "true"
              test "$SOURCE_DATE_EPOCH" -ge 315532800
              maturin build --release --locked --compatibility manylinux_2_28 --manifest-path /work/native/axven_native/Cargo.toml --interpreter /opt/python/cp313-cp313/bin/python --out /out
              auditwheel show /out/*.whl
            '
          test "$(find "$rebuild_output" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1

      - name: Verify RUST-018 detached rebuild equivalence
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust018-consumer
          cd "$consumer"
          wheel_a="$(find build-a -maxdepth 1 -type f -name '*.whl' -print)"
          wheel_b="$(find build-b -maxdepth 1 -type f -name '*.whl' -print)"
          rebuilt="$(find rebuilt-wheel -maxdepth 1 -type f -name '*.whl' -print)"
          env -i HOME=/tmp PATH="$PATH" PYTHONUTF8=1 PYTHONIOENCODING=utf-8 PYTHONDONTWRITEBYTECODE=1 \
            python rust_018_detached_rebuild_verify.py verify \
              "$wheel_a" "$wheel_b" reproducible-provenance.json reproducible-attestation.json \
              source-inputs git-objects rebuild-source "$rebuilt"

      - name: RUST-018 detached rebuild mutation contract
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust018-consumer
          cd "$consumer"
          wheel_a="$(find build-a -maxdepth 1 -type f -name '*.whl' -print)"
          wheel_b="$(find build-b -maxdepth 1 -type f -name '*.whl' -print)"
          rebuilt="$(find rebuilt-wheel -maxdepth 1 -type f -name '*.whl' -print)"
          env -i HOME=/tmp PATH="$PATH" PYTHONUTF8=1 PYTHONIOENCODING=utf-8 PYTHONDONTWRITEBYTECODE=1 \
            python rust_018_detached_rebuild_verify.py selftest \
              "$wheel_a" "$wheel_b" reproducible-provenance.json reproducible-attestation.json \
              source-inputs git-objects rebuild-source "$rebuilt"

      - name: Reverify RUST-018 detached rebuild equivalence
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust018-consumer
          cd "$consumer"
          wheel_a="$(find build-a -maxdepth 1 -type f -name '*.whl' -print)"
          wheel_b="$(find build-b -maxdepth 1 -type f -name '*.whl' -print)"
          rebuilt="$(find rebuilt-wheel -maxdepth 1 -type f -name '*.whl' -print)"
          env -i HOME=/tmp PATH="$PATH" PYTHONUTF8=1 PYTHONIOENCODING=utf-8 PYTHONDONTWRITEBYTECODE=1 \
            python rust_018_detached_rebuild_verify.py verify \
              "$wheel_a" "$wheel_b" reproducible-provenance.json reproducible-attestation.json \
              source-inputs git-objects rebuild-source "$rebuilt"
