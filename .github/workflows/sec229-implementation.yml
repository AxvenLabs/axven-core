name: SEC-229 implementation

on:
  push:
    branches:
      - security-sec229-posix-runtime-write-permissions

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[sec229-impl]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Apply SEC-229 production fix and refresh manifest
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json

          ROOT = Path.cwd()

          def read_lf(name: str) -> str:
              return (ROOT / name).read_bytes().decode('utf-8').replace('\r\n', '\n')

          def write_lf(name: str, text: str) -> None:
              (ROOT / name).write_bytes(text.replace('\r\n', '\n').encode('utf-8'))

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          name = 'runtime_provenance.py'
          text = read_lf(name)

          if 'POSIX_UNSAFE_WRITE_BITS' not in text:
              text = replace_once(
                  text,
                  'HASH_CHUNK_BYTES = 64 * 1024\n',
                  'HASH_CHUNK_BYTES = 64 * 1024\nPOSIX_UNSAFE_WRITE_BITS = stat.S_IWGRP | stat.S_IWOTH\n',
                  'POSIX unsafe write constant',
              )

          if 'def _has_unsafe_posix_write_permissions(' not in text:
              anchor = '\n\ndef _assert_local_runtime_directory('
              helpers = '''

          def _has_unsafe_posix_write_permissions(metadata: object) -> bool:
              """Return True when POSIX group/other write permission is present."""
              return bool(getattr(metadata, "st_mode", 0) & POSIX_UNSAFE_WRITE_BITS)


          def _assert_posix_directory_write_boundary(path: Path, *, label: str) -> None:
              """Require one POSIX trust-boundary directory to exclude other writers."""
              if os.name != "posix":
                  return
              try:
                  metadata = Path(path).lstat()
              except OSError as exc:
                  raise RuntimeError(f"{label} is missing") from exc
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
                  raise RuntimeError(f"{label} is not a real directory")
              if _has_unsafe_posix_write_permissions(metadata):
                  raise RuntimeError(f"{label} is group/world-writable")


          def _assert_posix_installation_write_boundary(root: Path = ROOT) -> None:
              """Require the installation root and .venv root to exclude other writers."""
              if os.name != "posix":
                  return
              root_path = Path(os.path.abspath(root))
              _assert_posix_directory_write_boundary(root_path, label="Axven runtime root")
              _assert_posix_directory_write_boundary(
                  root_path / ".venv", label="validated runtime directory"
              )


          def _assert_posix_manifest_parent_write_boundary(
              root: Path, path: Path, *, label: str
          ) -> None:
              """Reject writable/symlink directory components beneath the runtime root."""
              if os.name != "posix":
                  return
              root_path = Path(os.path.abspath(root))
              path_path = Path(os.path.abspath(path))
              try:
                  relative = path_path.relative_to(root_path)
              except ValueError as exc:
                  raise RuntimeError(f"{label} escapes runtime root") from exc
              current = root_path
              _assert_posix_directory_write_boundary(current, label="Axven runtime root")
              for part in relative.parts[:-1]:
                  current = current / part
                  _assert_posix_directory_write_boundary(
                      current, label=f"{label} parent directory"
                  )
          '''
              text = replace_once(text, anchor, helpers + anchor, 'POSIX permission helpers')

          old = '''    if not stat.S_ISDIR(metadata.st_mode):
              raise RuntimeError("validated runtime path is not a directory")
          '''
          new = '''    if not stat.S_ISDIR(metadata.st_mode):
              raise RuntimeError("validated runtime path is not a directory")
              if os.name == "posix" and _has_unsafe_posix_write_permissions(metadata):
                  raise RuntimeError("validated runtime directory is group/world-writable")
          '''
          # Remove workflow indentation from embedded Python source.
          old = '    if not stat.S_ISDIR(metadata.st_mode):\n        raise RuntimeError("validated runtime path is not a directory")\n'
          new = '    if not stat.S_ISDIR(metadata.st_mode):\n        raise RuntimeError("validated runtime path is not a directory")\n    if os.name == "posix" and _has_unsafe_posix_write_permissions(metadata):\n        raise RuntimeError("validated runtime directory is group/world-writable")\n'
          if 'validated runtime directory is group/world-writable' not in text:
              text = replace_once(text, old, new, 'runtime directory mode check')

          old = '    if stat.S_ISLNK(before.st_mode) or not stat.S_ISREG(before.st_mode):\n        raise RuntimeError(f"{label} is not a regular non-symlink file")\n'
          new = old + '    if os.name == "posix" and _has_unsafe_posix_write_permissions(before):\n        raise RuntimeError(f"{label} changed to group/world-writable")\n'
          if 'before):\n        raise RuntimeError(f"{label} changed to group/world-writable")' not in text:
              text = replace_once(text, old, new, 'bounded read pre-open mode')

          old = '                or opened.st_size != before.st_size\n            ):\n                raise RuntimeError(f"{label} changed before reading")\n'
          new = '                or opened.st_size != before.st_size\n                or (os.name == "posix" and _has_unsafe_posix_write_permissions(opened))\n            ):\n                raise RuntimeError(f"{label} changed before reading")\n'
          if '_has_unsafe_posix_write_permissions(opened)' not in text[text.index('def _read_regular_bounded'):text.index('def _read_trust_input')]:
              text = replace_once(text, old, new, 'bounded read opened mode')

          old = '        or not _same_file(opened, after)\n        or after.st_size != opened.st_size\n    ):\n        raise RuntimeError(f"{label} changed after reading")\n'
          new = '        or not _same_file(opened, after)\n        or after.st_size != opened.st_size\n        or (os.name == "posix" and _has_unsafe_posix_write_permissions(after))\n    ):\n        raise RuntimeError(f"{label} changed after reading")\n'
          segment = text[text.index('def _read_regular_bounded'):text.index('def _read_trust_input')]
          if '_has_unsafe_posix_write_permissions(after)' not in segment:
              text = replace_once(text, old, new, 'bounded read after mode')

          old = '    manifest_path = root / "release_manifest.json"\n    manifest_bytes = _read_trust_input(manifest_path, "release_manifest.json")\n'
          new = '    manifest_path = root / "release_manifest.json"\n    _assert_posix_manifest_parent_write_boundary(\n        root, manifest_path, label="release manifest"\n    )\n    manifest_bytes = _read_trust_input(manifest_path, "release_manifest.json")\n'
          if 'root, manifest_path, label="release manifest"' not in text:
              text = replace_once(text, old, new, 'manifest parent mode')

          old = '        path = root.joinpath(*pure.parts)\n        try:\n            metadata = path.lstat()\n'
          new = '        path = root.joinpath(*pure.parts)\n        _assert_posix_manifest_parent_write_boundary(\n            root, path, label=f"release payload {name}"\n        )\n        try:\n            metadata = path.lstat()\n'
          if 'label=f"release payload {name}"' not in text:
              text = replace_once(text, old, new, 'payload parent mode')

          old = '        if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(metadata.st_mode):\n            raise RuntimeError(f"release payload is not a regular non-symlink file: {name}")\n'
          new = old + '        if os.name == "posix" and _has_unsafe_posix_write_permissions(metadata):\n            raise RuntimeError(f"release payload changed to group/world-writable: {name}")\n'
          if 'release payload changed to group/world-writable: {name}' not in text:
              text = replace_once(text, old, new, 'payload pre-open mode')

          old = '                or opened.st_size != expected_bytes\n            ):\n                raise RuntimeError(f"release payload changed before hashing: {name}")\n'
          new = '                or opened.st_size != expected_bytes\n                or (os.name == "posix" and _has_unsafe_posix_write_permissions(opened))\n            ):\n                raise RuntimeError(f"release payload changed before hashing: {name}")\n'
          payload_segment = text[text.index('def _verify_manifest_payloads'):text.index('def _trust_inputs_for_profile')]
          if '_has_unsafe_posix_write_permissions(opened)' not in payload_segment:
              text = replace_once(text, old, new, 'payload opened mode')

          old = '            or not _same_file(opened, after)\n            or after.st_size != expected_bytes\n        ):\n            raise RuntimeError(f"release payload changed after hashing: {name}")\n'
          new = '            or not _same_file(opened, after)\n            or after.st_size != expected_bytes\n            or (os.name == "posix" and _has_unsafe_posix_write_permissions(after))\n        ):\n            raise RuntimeError(f"release payload changed after hashing: {name}")\n'
          payload_segment = text[text.index('def _verify_manifest_payloads'):text.index('def _trust_inputs_for_profile')]
          if '_has_unsafe_posix_write_permissions(after)' not in payload_segment:
              text = replace_once(text, old, new, 'payload after mode')

          old = '    for name in _trust_inputs_for_profile(profile):\n        data = _read_trust_input(root / name, name)\n'
          new = '    for name in _trust_inputs_for_profile(profile):\n        _assert_posix_manifest_parent_write_boundary(\n            root, root / name, label=f"provenance input {name}"\n        )\n        data = _read_trust_input(root / name, name)\n'
          if 'label=f"provenance input {name}"' not in text:
              text = replace_once(text, old, new, 'trust input parent mode')

          for fn in ('stamp', 'check'):
              marker = f'def {fn}(root: Path = ROOT, *, profile: str | None = None) -> None:\n    if profile is None:\n        profile = _runtime_profile()\n    _assert_local_runtime_directory(root)\n'
              replacement = f'def {fn}(root: Path = ROOT, *, profile: str | None = None) -> None:\n    if profile is None:\n        profile = _runtime_profile()\n    _assert_posix_installation_write_boundary(root)\n    _assert_local_runtime_directory(root)\n'
              if replacement not in text:
                  text = replace_once(text, marker, replacement, f'{fn} installation mode boundary')

          write_lf(name, text)

          shell_helper = '''
          posix_mode() {
            if stat -c '%a' / >/dev/null 2>&1; then
              stat -L -c '%a' -- "$1"
            else
              stat -L -f '%Lp' "$1"
            fi
          }

          assert_not_group_world_writable() {
            local path="$1"
            local label="$2"
            local mode
            if [[ ! -e "$path" && ! -L "$path" ]]; then
              return 0
            fi
            mode="$(posix_mode "$path")" || {
              echo "unable to inspect POSIX permissions for $label" >&2
              exit 2
            }
            if (( (8#$mode & 8#022) != 0 )); then
              echo "$label is group/world-writable; remove group/other write permission and retry" >&2
              exit 2
            fi
          }
          '''

          name = 'validate_linux_macos.sh'
          text = read_lf(name)
          if 'umask 077' not in text:
              text = replace_once(text, 'set -euo pipefail\n', 'set -euo pipefail\numask 077\n', 'validator umask')
          if 'assert_not_group_world_writable()' not in text:
              text = replace_once(text, 'cd "$(dirname "$0")"\n', 'cd "$(dirname "$0")"\n' + shell_helper, 'validator mode helper')
          anchor = 'if [[ -e .venv && ! -d .venv ]]; then\n  echo "Axven validated runtime path is not a directory; remove .venv and rerun validation" >&2\n  exit 2\nfi\n'
          guard = anchor + '\nassert_not_group_world_writable "." "Axven runtime root"\nassert_not_group_world_writable "validate_linux_macos.sh" "POSIX validator"\nassert_not_group_world_writable "runtime_provenance.py" "runtime provenance verifier"\nif [[ -d .venv ]]; then\n  assert_not_group_world_writable ".venv" "validated runtime directory"\nfi\n'
          if '"POSIX validator"' not in text:
              text = replace_once(text, anchor, guard, 'validator root guards')
          anchor2 = 'if [[ ! -x "$venv_python" ]]; then\n  echo "existing .venv has no executable Python; remove it and rerun" >&2\n  exit 2\nfi\n'
          guard2 = anchor2 + 'assert_not_group_world_writable ".venv" "validated runtime directory"\nassert_not_group_world_writable "$venv_python" "validated runtime interpreter"\nassert_not_group_world_writable "$verifier_path" "runtime provenance verifier"\n'
          if '"validated runtime interpreter"' not in text:
              text = replace_once(text, anchor2, guard2, 'validator runtime guards')
          existing_anchor = 'if [[ "$created_venv" -eq 0 ]]; then\n'
          existing_new = existing_anchor + '  assert_not_group_world_writable "$digest_path" "runtime interpreter attestation"\n  assert_not_group_world_writable "$verifier_digest_path" "runtime provenance verifier attestation"\n'
          if '"runtime interpreter attestation"' not in text:
              text = replace_once(text, existing_anchor, existing_new, 'validator sidecar guards')
          write_lf(name, text)

          name = 'ensure_runtime.sh'
          text = read_lf(name)
          if 'assert_not_group_world_writable()' not in text:
              text = replace_once(text, 'cd "$(dirname "$0")"\n', 'cd "$(dirname "$0")"\n' + shell_helper, 'launcher mode helper')
          anchor = 'if [[ -e .venv && ! -d .venv ]]; then\n  echo "Axven validated runtime path is not a directory; remove .venv and rerun validation" >&2\n  exit 2\nfi\n'
          guard = anchor + '\nassert_not_group_world_writable "." "Axven runtime root"\nassert_not_group_world_writable "ensure_runtime.sh" "POSIX runtime guard"\nif [[ -d .venv ]]; then\n  assert_not_group_world_writable ".venv" "validated runtime directory"\nfi\n'
          if '"POSIX runtime guard"' not in text:
              text = replace_once(text, anchor, guard, 'launcher root guards')
          anchor2 = 'if [[ ! -x "$venv_python" ]]; then\n  echo "Axven validated POSIX runtime is missing; run: bash validate_linux_macos.sh" >&2\n  exit 2\nfi\n'
          guard2 = anchor2 + 'assert_not_group_world_writable "$venv_python" "validated runtime interpreter"\nassert_not_group_world_writable "$digest_path" "runtime interpreter attestation"\nassert_not_group_world_writable "$verifier_path" "runtime provenance verifier"\nassert_not_group_world_writable "$verifier_digest_path" "runtime provenance verifier attestation"\n'
          if '"validated runtime interpreter"' not in text:
              text = replace_once(text, anchor2, guard2, 'launcher file guards')
          write_lf(name, text)

          spec = 'security_sec229_posix_runtime_write_permissions_spec.py'
          write_lf(spec, read_lf(spec))

          manifest_path = ROOT / 'release_manifest.json'
          manifest = json.loads(manifest_path.read_bytes().decode('utf-8'))
          changed = (
              'runtime_provenance.py',
              'ensure_runtime.sh',
              'validate_linux_macos.sh',
              spec,
          )
          for filename in changed:
              raw = (ROOT / filename).read_bytes()
              manifest['files'][filename] = {
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
              }
          manifest_path.write_bytes((json.dumps(manifest, indent=2, sort_keys=True) + '\n').encode('utf-8'))
          print('SEC-229 deterministic implementation staged')
      - name: Commit implementation
        shell: pwsh
        run: |
          git config user.name "AxvenLabs"
          git config user.email "dogacan432@gmail.com"
          git add runtime_provenance.py ensure_runtime.sh validate_linux_macos.sh security_sec229_posix_runtime_write_permissions_spec.py release_manifest.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m "SEC-229: contain validated POSIX runtime writers [sec229-impl]"
          git push origin HEAD:security-sec229-posix-runtime-write-permissions
