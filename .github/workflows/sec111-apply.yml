name: SEC-111 Apply

on:
  push:
    branches:
      - security-sec111-chain-state-atomic-file-clean

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security-sec111-chain-state-atomic-file-clean
          fetch-depth: 1
          persist-credentials: true
      - name: Install project
        run: python -m pip install -e .
      - name: Apply SEC-111 patch
        run: python .github/sec111_apply.py
      - name: Validate and commit clean tree
        shell: bash
        run: |
          python security_sec111_chain_state_atomic_file_spec.py
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/sec111-apply.yml .github/sec111_apply.py
          git add axven.py security_sec111_chain_state_atomic_file_spec.py release_manifest.json
          git diff --cached --check
          git commit -m "SEC-111: Harden chain-state file writes"
          git push origin HEAD:security-sec111-chain-state-atomic-file-clean
