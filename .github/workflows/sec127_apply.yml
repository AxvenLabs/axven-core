name: SEC-127 Apply

on:
  push:
    branches:
      - security-sec127-wallet-inner-material-canonicality
    paths:
      - .github/workflows/sec127_apply.yml
      - .github/sec127_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Apply and validate SEC-127
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          chcp 65001
          python -m pip install --upgrade pip
          python -m pip install -e .
          python .github/sec127_patch.py
          python security_sec127_wallet_inner_material_canonicality_spec.py
          python security_sec077_wallet_kdf_resource_bounds_spec.py
          python security_sec078_wallet_backup_envelope_bounds_spec.py
          python security_sec109_wallet_backup_atomic_file_spec.py
          python wallet_persistence_cli_test.py
          python release_packaging_test.py
          python run_full_validation.py
          python security_tail_runner.py
      - name: Commit production patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name "AxvenLabs"
          git config user.email "dogacan432@gmail.com"
          git add wallet.py release_manifest.json security_sec127_wallet_inner_material_canonicality_spec.py
          git diff --cached --check
          git commit -m "SEC-127: Canonicalize wallet backup key material"
          git push origin HEAD:security-sec127-wallet-inner-material-canonicality
      - name: Remove temporary apply files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git rm .github/workflows/sec127_apply.yml .github/sec127_patch.py
          git commit -m "SEC-127: remove temporary apply workflow"
          git push origin HEAD:security-sec127-wallet-inner-material-canonicality
