name: Axven RUST-060 Canary

on:
  push:
    paths:
      - "requirements-ci-runtime-posix.lock"
      - "rust_0*.py"
      - "RUST_0*.md"
      - ".github/workflows/native-multistep-observer-rotation-journal-monitor-rotation.yml"
  pull_request:
    paths:
      - "requirements-ci-runtime-posix.lock"
      - "rust_0*.py"
      - "RUST_0*.md"
      - ".github/workflows/native-multistep-observer-rotation-journal-monitor-rotation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  rust060:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: RUST-060 static canary
        run: |
          python rust_059_observer_rotation_journal_monitor_set_rotation_policy_spec.py
          python rust_060_multistep_observer_rotation_journal_monitor_rotation_policy_spec.py
