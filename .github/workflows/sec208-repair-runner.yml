name: SEC-208 Repair Runner
on:
  push:
    branches:
      - security-sec208-release-tag-provenance
    paths:
      - .github/workflows/sec208-repair-runner.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security-sec208-release-tag-provenance
      - run: python .github/sec208_repair.py
      - run: git rm .github/sec208_repair.py .github/workflows/sec208-repair-runner.yml
      - run: git diff --check
      - run: git config user.name "Axven Security Automation"
      - run: git config user.email "actions@users.noreply.github.com"
      - run: git add security_sec208_release_tag_provenance_spec.py release_manifest.json
      - run: 'git commit -m "SEC-208: normalize final provenance regression"'
      - run: git push origin HEAD:security-sec208-release-tag-provenance
