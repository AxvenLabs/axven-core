name: SEC-120 Apply

on:
  push:
    branches:
      - security-sec120-block-signature-work

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security-sec120-block-signature-work
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Enable UTF-8
        run: chcp 65001
      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply and validate SEC-120
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/sec120_prepatch.py
          python .github/sec120_apply.py
          python security_sec064_p2p_block_tx_count_bounds_spec.py
          python security_sec090_mempool_atomicity_spec.py
          python security_sec106_sidechain_state_validation_spec.py
          python security_sec116_sidefork_path_work_spec.py
          python security_sec117_sidefork_cow_utxo_spec.py
          python security_sec118_p2p_inbound_block_work_budget_spec.py
          python security_sec119_p2p_inbound_tx_crypto_work_spec.py
          python security_sec120_block_signature_work_spec.py
          python p2p_tcp_lifecycle_test.py
          python devnet_rehearsal.py
          python consensus_rebuild_test.py
          python release_packaging_test.py
      - name: Commit clean SEC-120 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item .github/sec120_prepatch.py
          Remove-Item .github/sec120_apply.py
          Remove-Item .github/workflows/sec120-apply.yml
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SEC-120: Bound block signature verification work"
          git push origin HEAD:security-sec120-block-signature-work
