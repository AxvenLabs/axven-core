name: SEC-149 Apply

on:
  push:
    branches:
      - security-sec149-peer-config-json-preparse

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply and validate SEC-149
        shell: pwsh
        run: |
          python .github/sec149_apply.py
          python security_sec149_peer_config_json_preparse_spec.py
      - name: Commit clean SEC-149 tree
        shell: pwsh
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git rm .github/sec149_apply.py .github/workflows/sec149-apply.yml
          git add datadir.py release_manifest.json security_sec149_peer_config_json_preparse_spec.py
          git diff --cached --check
          git commit -m "SEC-149: Harden peer-config JSON preparse"
          git push origin HEAD:security-sec149-peer-config-json-preparse
