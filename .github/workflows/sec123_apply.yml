name: SEC-123 Apply

on:
  push:
    branches:
      - security-sec123-get-blocks-response-budget

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Enable UTF-8
        shell: pwsh
        run: chcp 65001
      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply SEC-123
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/sec123_patch.py
      - name: Targeted security validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python security_sec063_p2p_sync_response_budget_spec.py
          python security_sec114_p2p_get_blocks_locator_work_spec.py
          python security_sec121_outbound_sync_work_budget_spec.py
          python security_sec122_p2p_inflight_frame_budget_spec.py
          python security_sec123_get_blocks_response_budget_spec.py
          python p2p_tcp_lifecycle_test.py
          python devnet_rehearsal.py
          python consensus_rebuild_test.py
          python release_packaging_test.py
      - name: Full validation before commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python run_full_validation.py
          python security_tail_runner.py
      - name: Commit SEC-123 production patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name "AxvenLabs"
          git config user.email "dogacan432@gmail.com"
          git add p2p.py release_manifest.json security_sec123_get_blocks_response_budget_spec.py
          git diff --cached --check
          git commit -m "SEC-123: Bound get_blocks response work"
          git push origin HEAD:security-sec123-get-blocks-response-budget
      - name: Remove temporary apply files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git rm .github/sec123_patch.py .github/workflows/sec123_apply.yml
          git commit -m "SEC-123: remove temporary apply workflow"
          git push origin HEAD:security-sec123-get-blocks-response-budget
