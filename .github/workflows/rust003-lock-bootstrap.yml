name: RUST-003 lock bootstrap

on:
  push:
    branches:
      - rust-rust003-native-smt-fuzz

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[rust003-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install exact stable Rust
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Generate fuzz Cargo.lock
        run: cargo +1.98.0 generate-lockfile --manifest-path native/axven_native/fuzz/Cargo.toml

      - name: Commit fuzz lockfile
        run: |
          git config user.name "AxvenLabs"
          git config user.email "dogacan432@gmail.com"
          git add native/axven_native/fuzz/Cargo.lock
          git diff --cached --check
          git commit -m "RUST-003: freeze fuzz dependency graph [rust003-lock]"
          git push
