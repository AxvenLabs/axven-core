name: SEC-223 Manifest Refresh

on:
  push:
    branches:
      - security-sec223-bounded-propagation-fanout

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Refresh release manifest
        run: python sec223_refresh_manifest.py
      - name: Commit refreshed manifest
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- release_manifest.json; then
            echo 'release_manifest.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release_manifest.json
          git commit -m 'SEC-223: refresh release manifest pins'
          git push origin HEAD:${GITHUB_REF_NAME}
