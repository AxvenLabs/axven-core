name: SEC-223 Apply Fix

on:
  push:
    branches:
      - security-sec223-bounded-propagation-fanout

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Apply SEC-223 patch
        run: python sec223_apply.py
      - name: Validate diff and commit
        shell: bash
        run: |
          git diff --check
          git diff --stat
          if git diff --quiet; then
            echo 'SEC-223 already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core.py security_sec223_bounded_propagation_fanout_spec.py release_manifest.json
          git commit -m 'SEC-223: bound outbound propagation fanout'
          git push origin HEAD:${GITHUB_REF_NAME}
