name: SEC-114 V2 Apply

on:
  push:
    branches:
      - security-sec114-get-blocks-locator-work-bounds
    paths:
      - .github/workflows/sec114-v2-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security-sec114-get-blocks-locator-work-bounds
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply and validate SEC-114 v2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/sec114_v2_apply.py
          python security_sec016_p2p_sync_bounds_spec.py
          python security_sec063_p2p_sync_response_budget_spec.py
          python security_sec097_p2p_get_blocks_envelope_fields_spec.py
          python security_sec114_p2p_get_blocks_locator_work_spec.py
          python release_packaging_test.py
      - name: Commit clean SEC-114 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item .github/sec114_apply.py
          Remove-Item .github/workflows/sec114-apply.yml
          Remove-Item .github/sec114_v2_apply.py
          Remove-Item .github/workflows/sec114-v2-apply.yml
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SEC-114: Bound get_blocks locator work"
          git push origin HEAD:security-sec114-get-blocks-locator-work-bounds
