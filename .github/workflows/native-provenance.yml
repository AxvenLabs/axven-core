name: Axven Native Provenance Candidate

on:
  push:
    paths:
      - "native/**"
      - "RUST_007.md"
      - "RUST_008.md"
      - "rust_007_native_wheel_package_spec.py"
      - "rust_008_native_provenance.py"
      - "requirements-native-build.lock"
      - ".github/workflows/native-provenance.yml"
  pull_request:
    paths:
      - "native/**"
      - "RUST_007.md"
      - "RUST_008.md"
      - "rust_007_native_wheel_package_spec.py"
      - "rust_008_native_provenance.py"
      - "requirements-native-build.lock"
      - ".github/workflows/native-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-provenance:
    name: provenance-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYO3_PYTHON: python
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      AXVEN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install hash-locked maturin frontend
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-native-build.lock

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          python --version
          rustc --version
          cargo --version
          python -m maturin --version

      - name: Build unpublished locked native wheel
        run: python -m maturin build --release --locked --manifest-path native/axven_native/Cargo.toml --interpreter python --out wheelhouse

      - name: Recheck RUST-007 wheel integrity
        run: python rust_007_native_wheel_package_spec.py

      - name: Generate canonical provenance candidate
        run: python rust_008_native_provenance.py generate native-provenance.json

      - name: Verify artifact and provenance from scratch
        run: python rust_008_native_provenance.py verify native-provenance.json
