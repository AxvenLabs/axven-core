name: SEC-112 Manifest Fix

on:
  push:
    branches:
      - security-sec112-sidechain-retention-bounds
    paths:
      - .github/workflows/sec112-manifest-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security-sec112-sidechain-retention-bounds
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Normalize and validate manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/sec112_manifest_fix.py
          python security_sec112_sidechain_retention_bounds_spec.py
          python release_packaging_test.py
      - name: Commit clean manifest fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item .github/sec112_manifest_fix.py
          Remove-Item .github/workflows/sec112-manifest-fix.yml
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SEC-112: Refresh normalized manifest hashes"
          git push origin HEAD:security-sec112-sidechain-retention-bounds
