name: SEC-207 Final Repair

on:
  push:
    branches:
      - security-sec207-release-unlisted-payload-containment
    paths:
      - .github/workflows/sec207-final-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security-sec207-release-unlisted-payload-containment
      - name: Repair semantic assertion and refresh manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          spec = Path('security_sec207_release_unlisted_payload_containment_spec.py')
          text = spec.read_text(encoding='utf-8')
          old = 'assert "single extra file" in notes'
          new = 'assert "single extra file" in " ".join(notes.split())'
          if text.count(old) != 1:
              raise SystemExit('SEC-207 assertion anchor missing or ambiguous')
          spec.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          manifest_path = Path('release_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          data = spec.read_bytes()
          entry = manifest['files'][spec.as_posix()]
          entry['bytes'] = len(data)
          entry['sha256'] = hashlib.sha256(data).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/sec207-final-repair.yml
          git config user.name "Axven Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add security_sec207_release_unlisted_payload_containment_spec.py release_manifest.json
          git diff --cached --check
          git commit -m "SEC-207: normalize release guidance assertion"
          git push origin HEAD:security-sec207-release-unlisted-payload-containment
