name: SEC-195 fixture repair

on:
  push:
    branches:
      - security-sec195-manual-sync-work-budget

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install pinned runtime
        shell: pwsh
        run: |
          python -m pip install "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0" "packaging==26.3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[legacy-mldsa-recovery]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Repair SEC-050 and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import hashlib, json

          path=Path('security_sec050_sync_peer_host_bounds_spec.py')
          src=path.read_text(encoding='utf-8')
          old='    def fake_sync_to_peer(address, session, limit=128, max_rounds=100):\n        calls.append((address, limit))\n        return 7\n'
          new='    def fake_sync_to_peer(address, session, limit=128, max_rounds=100, **kwargs):\n        assert callable(kwargs.get("block_work_gate"))\n        assert callable(kwargs.get("block_signature_work_gate"))\n        calls.append((address, limit))\n        return 7\n'
          if src.count(old)!=1:
              raise SystemExit(f'SEC-050 fake anchor count={src.count(old)}')
          path.write_text(src.replace(old,new),encoding='utf-8',newline='\n')

          manifest_path=Path('release_manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          data=path.read_bytes()
          manifest['files'][str(path)]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8',newline='\n')
          '@ | Set-Content -Encoding utf8 repair_sec195_fixture.py
          python repair_sec195_fixture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile security_sec050_sync_peer_host_bounds_spec.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python security_sec050_sync_peer_host_bounds_spec.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item repair_sec195_fixture.py
          git config user.name 'AxvenLabs'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sec195_fixture_repair.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add security_sec050_sync_peer_host_bounds_spec.py release_manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed=git diff --cached --name-only
          if ($changed -notcontains 'security_sec050_sync_peer_host_bounds_spec.py' -or $changed -notcontains 'release_manifest.json') { throw 'SEC-050 repair diff missing' }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'SEC-195: Align SEC-050 sync fixture with work gates'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:security-sec195-manual-sync-work-budget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
