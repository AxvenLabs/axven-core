name: SEC-225 Fail-First Manifest

on:
  push:
    branches:
      - security-sec225-bounded-daemon-retry-fanout

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Bind SEC-225 fail-first contract into release manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          name = 'security_sec225_bounded_daemon_retry_fanout_spec.py'
          path = Path(name)
          manifest_path = Path('release_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          raw = path.read_bytes()
          manifest['files'][name] = {
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
          }
          manifest['files'] = dict(sorted(manifest['files'].items()))
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          git diff --check
      - name: Commit manifest update when needed
        shell: bash
        run: |
          if git diff --quiet -- release_manifest.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release_manifest.json
          git commit -m 'SEC-225: bind fail-first contract in release manifest'
          git push origin HEAD:${GITHUB_REF_NAME}
