name: SEC-132 Apply

on:
  push:
    branches:
      - security-sec132-p2p-json-preparse-complexity

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply SEC-132
        shell: pwsh
        run: python .github/sec132_apply.py
      - name: Targeted SEC-125 regression
        shell: pwsh
        run: python security_sec125_p2p_json_preparse_depth_spec.py
      - name: Targeted SEC-132 regression
        shell: pwsh
        run: python security_sec132_p2p_json_preparse_complexity_spec.py
      - name: Commit clean branch
        shell: pwsh
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git add -A
          git commit -m "SEC-132: Bound P2P JSON fan-out before parsing"
          git push origin HEAD:security-sec132-p2p-json-preparse-complexity
