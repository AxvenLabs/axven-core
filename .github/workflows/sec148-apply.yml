name: SEC-148 Apply

on:
  push:
    branches:
      - security-sec148-explorer-query-domain

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply and validate SEC-148
        shell: pwsh
        run: |
          python .github/sec148_apply.py
          python security_sec148_explorer_query_domain_spec.py
      - name: Commit clean SEC-148 tree
        shell: pwsh
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git rm .github/sec148_apply.py .github/workflows/sec148-apply.yml
          git add explorer.py release_manifest.json security_sec148_explorer_query_domain_spec.py
          git diff --cached --check
          git commit -m "SEC-148: Harden Explorer query domain"
          git push origin HEAD:security-sec148-explorer-query-domain
