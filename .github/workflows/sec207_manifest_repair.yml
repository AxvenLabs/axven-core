name: SEC-207 Manifest Repair

on:
  push:
    branches:
      - security-sec207-release-unlisted-payload-containment

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Refresh canonical Git-byte manifest pins
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          targets = [
              "verify_release.py",
              "build_release_package.py",
              "GITHUB_RELEASE.md",
              "RELEASE_CHECKLIST.md",
              "security_sec205_release_manifest_trust_anchor_spec.py",
              "security_sec207_release_unlisted_payload_containment_spec.py",
          ]
          path = Path("release_manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          for name in targets:
              data = Path(name).read_bytes()
              manifest["files"][name] = {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release_manifest.json
          git diff --cached --check
          git commit -m "SEC-207: refresh exact release staging manifest pins"
          git push
