name: SEC-134 Apply

on:
  push:
    branches:
      - security-sec134-explorer-http-resource-bounds

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Correct SEC-134 static regression anchor
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path=Path(".github/sec134_apply.py")
          text=path.read_text(encoding="utf-8")
          old='''        "BoundedThreadingHTTPServer" in server_src
          and "ThreadingHTTPServer((host" not in server_src,'''
          new='''        "self.httpd=BoundedThreadingHTTPServer(" in server_src
          and "self.httpd=ThreadingHTTPServer(" not in server_src,'''
          if text.count(old) != 1:
              raise SystemExit("SEC-134 static anchor correction mismatch")
          path.write_text(text.replace(old,new,1),encoding="utf-8",newline="\n")
          '@ | python -
      - name: Apply SEC-134
        shell: pwsh
        run: python .github/sec134_apply.py
      - name: Explorer functional regression
        shell: pwsh
        run: python explorer_spec_test.py
      - name: SEC-134 regression
        shell: pwsh
        run: python security_sec134_explorer_http_resource_bounds_spec.py
      - name: Commit clean branch
        shell: pwsh
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git add -A
          git commit -m "SEC-134: Bound Explorer HTTP resources"
          git push origin HEAD:security-sec134-explorer-http-resource-bounds
