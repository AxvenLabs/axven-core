name: RUST-002 lock bootstrap

on:
  push:
    branches:
      - rust-rust002-state-root-mirror

permissions:
  contents: write

jobs:
  lock-bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[rust002-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup override set 1.98.0
      - name: Format mirror and freeze dependency graph
        run: |
          cargo fmt --manifest-path native/axven_native/Cargo.toml
          cargo generate-lockfile --manifest-path native/axven_native/Cargo.toml
      - name: Commit generated lock state
        run: |
          git config user.name "AxvenLabs"
          git config user.email "dogacan432@gmail.com"
          git add native/axven_native/src/lib.rs native/axven_native/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m "RUST-002: format mirror and lock sha2 graph [rust002-lock]"
          git push
