name: SEC-080 Builder

on:
  push:
    branches:
      - security-sec080-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build detached SEC-080 commit
        shell: bash
        env:
          MAIN_SHA: 763e218ce60624fe58ac58f8aac7ffbccfd96422
          HOLD_BRANCH: security-sec080-final-hold
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import textwrap

          p2p_path = Path("p2p.py")
          text = p2p_path.read_text(encoding="utf-8")

          old = '''class ProtocolError(ValueError): pass

          def local_identity() -> Dict[str, Any]:
          '''
          new = '''class ProtocolError(ValueError): pass

          def _reject_duplicate_json_keys(pairs):
              obj={}
              for key,value in pairs:
                  if key in obj:
                      raise ProtocolError(f"duplicate JSON key: {key}")
                  obj[key]=value
              return obj

          def local_identity() -> Dict[str, Any]:
          '''
          if text.count(old) != 1:
              raise SystemExit("SEC-080 helper: ProtocolError anchor mismatch")
          text = text.replace(old, new, 1)

          old = '''    try: msg=json.loads(_recv_exact(sock,n))
              except Exception as e: raise ProtocolError("invalid json") from e
          '''
          new = '''    try:
                  msg=json.loads(_recv_exact(sock,n),object_pairs_hook=_reject_duplicate_json_keys)
              except ProtocolError:
                  raise
              except Exception as e:
                  raise ProtocolError("invalid json") from e
          '''
          if text.count(old) != 1:
              raise SystemExit("SEC-080 helper: recv_message anchor mismatch")
          text = text.replace(old, new, 1)
          p2p_path.write_text(text, encoding="utf-8", newline="\n")

          spec = textwrap.dedent('''\
          #!/usr/bin/env python3
          """SEC-080: P2P JSON objects must reject duplicate keys at every depth."""

          import socket
          import struct

          import p2p


          def recv_raw(raw: bytes):
              sender, receiver = socket.socketpair()
              try:
                  sender.sendall(struct.pack(">I", len(raw)) + raw)
                  return p2p.recv_message(receiver)
              finally:
                  sender.close()
                  receiver.close()


          def expect_duplicate(raw: bytes, key: str):
              try:
                  recv_raw(raw)
              except p2p.ProtocolError as exc:
                  assert f"duplicate JSON key: {key}" in str(exc), str(exc)
                  return
              raise AssertionError(f"duplicate JSON key accepted: {key}")


          def main():
              canonical = recv_raw(
                  b'{"type":"probe","nested":{"value":1},"items":[{"x":2}]}'
              )
              assert canonical == {
                  "type": "probe",
                  "nested": {"value": 1},
                  "items": [{"x": 2}],
              }
              print("[GREEN] canonical unique-key P2P JSON preserved")

              expect_duplicate(
                  b'{"type":"status","type":"get_status"}',
                  "type",
              )
              print("[GREEN] duplicate top-level message type rejected")

              expect_duplicate(
                  b'{"type":"hello","protocol_version":1,"protocol_version":2}',
                  "protocol_version",
              )
              print("[GREEN] duplicate handshake identity field rejected")

              expect_duplicate(
                  b'{"type":"tx","tx":{"inputs":[],"outputs":[{"recipient":"A","amount":1,"amount":2}]}}',
                  "amount",
              )
              print("[GREEN] duplicate nested transaction field rejected")

              expect_duplicate(
                  b'{"type":"blocks","blocks":[{"height":1,"height":2}]}',
                  "height",
              )
              print("[GREEN] duplicate nested block field rejected")

              try:
                  recv_raw(b'{"type":')
              except p2p.ProtocolError as exc:
                  assert str(exc) == "invalid json", str(exc)
              else:
                  raise AssertionError("malformed JSON accepted")
              print("[GREEN] malformed JSON still fails closed")

              try:
                  recv_raw(b'["get_status"]')
              except p2p.ProtocolError as exc:
                  assert str(exc) == "message must be object", str(exc)
              else:
                  raise AssertionError("non-object P2P JSON accepted")
              print("[GREEN] non-object P2P JSON still rejected")

              print("SEC-080 P2P duplicate JSON keys: 7/7 GREEN")


          if __name__ == "__main__":
              main()
          ''')
          spec_path = Path("security_sec080_p2p_duplicate_json_keys_spec.py")
          spec_path.write_text(spec, encoding="utf-8", newline="\n")

          manifest_path = Path("release_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          def pin(path: Path):
              data = path.read_bytes()
              manifest["files"][path.name] = {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }

          pin(p2p_path)
          pin(spec_path)
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

          git config user.name "AxvenLabs"
          git config user.email "actions@users.noreply.github.com"

          git read-tree "$MAIN_SHA"
          git add p2p.py release_manifest.json security_sec080_p2p_duplicate_json_keys_spec.py
          TREE_SHA="$(git write-tree)"
          FINAL_SHA="$(printf '%s\n' 'SEC-080: Reject duplicate P2P JSON keys' | git commit-tree "$TREE_SHA" -p "$MAIN_SHA")"
          git push origin "$FINAL_SHA:refs/heads/$HOLD_BRANCH" --force
          echo "FINAL_SHA=$FINAL_SHA"
