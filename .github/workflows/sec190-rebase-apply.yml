name: SEC-190 Rebase Apply

on:
  push:
    branches:
      - security-sec190-disable-legacy-mldsa-signing
    paths:
      - .github/workflows/sec190-rebase-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Apply SEC-190 and refresh manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          replace_once(
              "axven.py",
              '''    def sign(self,sh):
                  if self._private is not None:
                      return self._private.sign(sh)
                  return _mldsa().sign(self._secret,sh)
          ''',
              '''    def sign(self,sh):
                  if self._private is not None:
                      return self._private.sign(sh)
                  raise RuntimeError(
                      "legacy ML-DSA expanded keys are recovery-only; "
                      "migrate to a seed key before signing"
                  )
          ''',
          )

          replace_once(
              "wallet.py",
              '''def _validate_mldsa_keypair(ml_pub, ml_sec):
              message = hashlib.sha256(
                  b"axven-wallet-backup-mldsa-keypair-v1|" + ml_pub
              ).digest()
              try:
                  signer = axven.MLDSAWallet((ml_pub, ml_sec))
                  signature = signer.sign(message)
                  valid = axven._verify_mldsa44_signature(ml_pub, message, signature)
              except Exception as exc:
                  raise BackupError("invalid ML-DSA keypair") from exc
              if not valid:
                  raise BackupError("invalid ML-DSA keypair")
          ''',
              '''def _validate_mldsa_keypair(ml_pub, ml_sec):
              if len(ml_sec) == ML_DSA_SEED_KEY_BYTES:
                  message = hashlib.sha256(
                      b"axven-wallet-backup-mldsa-keypair-v1|" + ml_pub
                  ).digest()
                  try:
                      signer = axven.MLDSAWallet((ml_pub, ml_sec))
                      signature = signer.sign(message)
                      valid = axven._verify_mldsa44_signature(ml_pub, message, signature)
                  except Exception as exc:
                      raise BackupError("invalid ML-DSA keypair") from exc
                  if not valid:
                      raise BackupError("invalid ML-DSA keypair")
                  return

              if len(ml_sec) == ML_DSA_LEGACY_SECRET_KEY_BYTES:
                  try:
                      recovered = axven._mldsa().pk_from_sk(ml_sec)
                  except Exception as exc:
                      raise BackupError("invalid ML-DSA keypair") from exc
                  if recovered != ml_pub:
                      raise BackupError("invalid ML-DSA keypair")
                  return

              raise BackupError("invalid ML-DSA keypair")
          ''',
          )

          manifest_path = Path("release_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          names = [
              "axven.py",
              "wallet.py",
              "security_sec187_mldsa_wallet_signer_migration_spec.py",
              "security_sec190_legacy_mldsa_recovery_only_spec.py",
              "security_sec190_legacy_mldsa_signing_disabled_spec.py",
          ]
          for name in names:
              data = Path(name).read_bytes()
              manifest["files"][name] = {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          git diff --check
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add axven.py wallet.py release_manifest.json
          git diff --cached --quiet && { echo "SEC-190 patch produced no changes"; exit 1; }
          git commit -m "SEC-190: reapply recovery-only legacy ML-DSA on current main"
          git push origin HEAD:security-sec190-disable-legacy-mldsa-signing
