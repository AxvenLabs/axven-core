name: Axven Native External Floor Witness Quorum

on:
  push:
    paths:
      - "requirements-ci-runtime-posix.lock"
      - "rust_030_stdlib_material_verify.py"
      - "rust_031_stdlib_trust_state_material_verify.py"
      - "rust_032_external_monotonic_floor_verify.py"
      - "rust_033_external_floor_witness_verify.py"
      - "RUST_034.md"
      - "rust_034_external_floor_witness_quorum_verify.py"
      - "rust_034_external_floor_witness_quorum_policy_spec.py"
      - ".github/workflows/native-external-floor-witness-quorum.yml"
  pull_request:
    paths:
      - "requirements-ci-runtime-posix.lock"
      - "rust_030_stdlib_material_verify.py"
      - "rust_031_stdlib_trust_state_material_verify.py"
      - "rust_032_external_monotonic_floor_verify.py"
      - "rust_033_external_floor_witness_verify.py"
      - "RUST_034.md"
      - "rust_034_external_floor_witness_quorum_verify.py"
      - "rust_034_external_floor_witness_quorum_policy_spec.py"
      - ".github/workflows/native-external-floor-witness-quorum.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  witness-quorum:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AXVEN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install hash-locked producer dependency
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock

      - name: RUST-034 static witness-quorum policy
        run: |
          python rust_032_external_monotonic_floor_policy_spec.py
          python rust_033_external_floor_witness_policy_spec.py
          python rust_034_external_floor_witness_quorum_policy_spec.py

      - name: Generate canonical floor and TEST-ONLY 2-of-3 witness quorum
        shell: bash
        run: |
          set -euo pipefail
          fixture=/tmp/axven-rust034-fixture
          floor=/tmp/axven-rust034-external-floor.json
          quorum=/tmp/axven-rust034-floor-quorum.json
          rm -rf "$fixture" "$floor" "$quorum"
          mkdir -p "$fixture"
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path

          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          import rust_030_stdlib_material_verify as material_verify
          import rust_031_stdlib_trust_state_material_verify as trust_verify
          import rust_034_external_floor_witness_quorum_verify as quorum_verify

          source_sha = os.environ["AXVEN_SOURCE_SHA"]
          if len(source_sha) != 40 or any(ch not in "0123456789abcdef" for ch in source_sha):
              raise AssertionError("invalid RUST-034 source SHA")

          genesis = {
              "schema": trust_verify.STATE_SCHEMA,
              "sequence": 0,
              "scope": trust_verify.MATERIAL_PAYLOAD_TYPE,
              "key_id": trust_verify.OLD_KEY_ID,
              "public_key": trust_verify.OLD_PUBLIC_KEY.hex(),
              "activation_source_commit": None,
              "predecessor_sha256": None,
              "transition_sha256": None,
              "production": False,
          }
          transition = {
              "schema": trust_verify.TRANSITION_SCHEMA,
              "sequence": 1,
              "scope": trust_verify.MATERIAL_PAYLOAD_TYPE,
              "from_key_id": trust_verify.OLD_KEY_ID,
              "from_public_key": trust_verify.OLD_PUBLIC_KEY.hex(),
              "to_key_id": trust_verify.NEW_KEY_ID,
              "to_public_key": trust_verify.NEW_PUBLIC_KEY.hex(),
              "activation_source_commit": source_sha,
              "production": False,
          }
          genesis_raw = material_verify.canonical(genesis)
          transition_raw = material_verify.canonical(transition)
          final_state = {
              "schema": trust_verify.STATE_SCHEMA,
              "sequence": 1,
              "scope": trust_verify.MATERIAL_PAYLOAD_TYPE,
              "key_id": trust_verify.NEW_KEY_ID,
              "public_key": trust_verify.NEW_PUBLIC_KEY.hex(),
              "activation_source_commit": source_sha,
              "predecessor_sha256": hashlib.sha256(genesis_raw).hexdigest(),
              "transition_sha256": hashlib.sha256(transition_raw).hexdigest(),
              "production": False,
          }
          final_raw = material_verify.canonical(final_state)
          trust_verify.validate_genesis(genesis_raw, genesis)
          trust_verify.validate_final_state(final_raw, final_state, genesis_raw, transition_raw, source_sha)

          floor_record = {
              "schema": "axven-native-external-monotonic-floor-v1",
              "provider": "test-only-monotonic-floor-simulator",
              "sequence": 1,
              "scope": trust_verify.MATERIAL_PAYLOAD_TYPE,
              "key_id": final_state["key_id"],
              "public_key": final_state["public_key"],
              "activation_source_commit": source_sha,
              "state_sha256": hashlib.sha256(final_raw).hexdigest(),
              "production": False,
          }
          floor_raw = material_verify.canonical(floor_record)

          TEST_ONLY_SEEDS = {
              "rust-033-test-only-floor-witness-v1": bytes.fromhex(
                  "0bcea6c25bf2e920391237f68a9ff4d36f3e8800521f93016ed2b4a10c81a09f"
              ),
              "rust-034-test-only-floor-witness-b-v1": bytes.fromhex(
                  "1111111111111111111111111111111111111111111111111111111111111111"
              ),
              "rust-034-test-only-floor-witness-c-v1": bytes.fromhex(
                  "2222222222222222222222222222222222222222222222222222222222222222"
              ),
          }
          witnesses = []
          for key_id in sorted(TEST_ONLY_SEEDS):
              private = Ed25519PrivateKey.from_private_bytes(TEST_ONLY_SEEDS[key_id])
              derived_public = private.public_key().public_bytes(
                  encoding=serialization.Encoding.Raw,
                  format=serialization.PublicFormat.Raw,
              )
              if derived_public != quorum_verify.PINNED_WITNESSES[key_id]:
                  raise AssertionError("RUST-034 TEST-ONLY witness public-key pin mismatch")
              witnesses.append({
                  "key_id": key_id,
                  "signature": base64.b64encode(
                      private.sign(quorum_verify.signed_message(floor_raw))
                  ).decode("ascii"),
              })

          quorum = {
              "schema": quorum_verify.QUORUM_SCHEMA,
              "algorithm": quorum_verify.ALGORITHM,
              "threshold": quorum_verify.THRESHOLD,
              "payload_type": quorum_verify.QUORUM_PAYLOAD_TYPE,
              "payload_sha256": hashlib.sha256(floor_raw).hexdigest(),
              "witnesses": witnesses,
              "production": False,
          }
          Path("/tmp/axven-rust034-fixture/final-state.json").write_bytes(final_raw)
          Path("/tmp/axven-rust034-external-floor.json").write_bytes(floor_raw)
          Path("/tmp/axven-rust034-floor-quorum.json").write_bytes(material_verify.canonical(quorum))
          PY
          test -f "$fixture/final-state.json"
          test -f "$floor"
          test -f "$quorum"
          chmod 0444 "$floor" "$quorum"
          test "$(stat -c '%a' "$floor")" = "444"
          test "$(stat -c '%a' "$quorum")" = "444"

      - name: Stage detached RUST-034 consumer without external evidence
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust034-consumer
          rm -rf "$consumer"
          mkdir -p "$consumer"
          cp rust_030_stdlib_material_verify.py "$consumer/"
          cp rust_031_stdlib_trust_state_material_verify.py "$consumer/"
          cp rust_032_external_monotonic_floor_verify.py "$consumer/"
          cp rust_033_external_floor_witness_verify.py "$consumer/"
          cp rust_034_external_floor_witness_quorum_verify.py "$consumer/"
          cp /tmp/axven-rust034-fixture/final-state.json "$consumer/"
          test "$(find "$consumer" -maxdepth 1 -type f | wc -l)" -eq 6
          test "$(find "$consumer" -type l | wc -l)" -eq 0
          test ! -e "$consumer/.git"
          test ! -e "$consumer/external-floor.json"
          test ! -e "$consumer/floor-quorum.json"

      - name: Verify detached RUST-034 2-of-3 witness quorum
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust034-consumer
          floor=/tmp/axven-rust034-external-floor.json
          quorum=/tmp/axven-rust034-floor-quorum.json
          cd "$consumer"
          env -i \
            HOME=/tmp \
            PATH=/usr/bin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONNOUSERSITE=1 \
            /usr/bin/python3 -S rust_034_external_floor_witness_quorum_verify.py verify \
              final-state.json "$floor" "$quorum" "$AXVEN_SOURCE_SHA" 1

      - name: RUST-034 quorum availability and fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust034-consumer
          floor=/tmp/axven-rust034-external-floor.json
          quorum=/tmp/axven-rust034-floor-quorum.json
          cd "$consumer"
          env -i \
            HOME=/tmp \
            PATH=/usr/bin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONNOUSERSITE=1 \
            /usr/bin/python3 -S rust_034_external_floor_witness_quorum_verify.py selftest \
              final-state.json "$floor" "$quorum" "$AXVEN_SOURCE_SHA" 1

      - name: Reverify pristine TEST-ONLY witness quorum
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust034-consumer
          floor=/tmp/axven-rust034-external-floor.json
          quorum=/tmp/axven-rust034-floor-quorum.json
          test "$(stat -c '%a' "$floor")" = "444"
          test "$(stat -c '%a' "$quorum")" = "444"
          test ! -e "$consumer/external-floor.json"
          test ! -e "$consumer/floor-quorum.json"
          cd "$consumer"
          env -i \
            HOME=/tmp \
            PATH=/usr/bin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONNOUSERSITE=1 \
            /usr/bin/python3 -S rust_034_external_floor_witness_quorum_verify.py verify \
              final-state.json "$floor" "$quorum" "$AXVEN_SOURCE_SHA" 1
