name: Axven Native Offline Dependency Closure

on:
  push:
    paths:
      - "native/axven_native/Cargo.toml"
      - "native/axven_native/Cargo.lock"
      - "requirements-native-build.lock"
      - "RUST_019.md"
      - "rust_019_offline_dependency_closure.py"
      - "rust_019_offline_dependency_policy_spec.py"
      - ".github/workflows/native-offline-dependency-closure.yml"
  pull_request:
    paths:
      - "native/axven_native/Cargo.toml"
      - "native/axven_native/Cargo.lock"
      - "requirements-native-build.lock"
      - "RUST_019.md"
      - "rust_019_offline_dependency_closure.py"
      - "rust_019_offline_dependency_policy_spec.py"
      - ".github/workflows/native-offline-dependency-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-dependency-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install hash-locked Axven runtime dependencies
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock

      - name: Install exact Rust toolchain for dependency collection
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          python -c "import platform; assert platform.python_version() == '3.13.15', platform.python_version()"
          rustc --version | grep -F "rustc 1.98.0 "
          cargo --version | grep -F "cargo 1.98.0 "

      - name: RUST-019 static offline dependency closure policy
        run: python rust_019_offline_dependency_policy_spec.py

      - name: Populate locked Cargo archive cache
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path native/axven_native/Cargo.toml

      - name: Collect exact Cargo dependency archives
        shell: bash
        run: |
          set -euo pipefail
          bundle=/tmp/axven-rust019-dependencies
          rm -rf "$bundle"
          mkdir -p "$bundle/cargo-crates" "$bundle/python-wheels"
          python rust_019_offline_dependency_closure.py collect-crates \
            native/axven_native/Cargo.lock "$HOME/.cargo" "$bundle/cargo-crates"

      - name: Download hash-locked Maturin wheel
        shell: bash
        run: |
          set -euo pipefail
          bundle=/tmp/axven-rust019-dependencies
          python -m pip download \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r requirements-native-build.lock \
            --dest "$bundle/python-wheels"
          test "$(find "$bundle/python-wheels" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find "$bundle" -type l | wc -l)" -eq 0

      - name: Verify detached RUST-019 dependency closure
        shell: bash
        run: |
          set -euo pipefail
          bundle=/tmp/axven-rust019-dependencies
          env -i \
            HOME=/tmp \
            PATH="$PATH" \
            PYTHONUTF8=1 \
            PYTHONIOENCODING=utf-8 \
            PYTHONDONTWRITEBYTECODE=1 \
            python rust_019_offline_dependency_closure.py verify \
              native/axven_native/Cargo.lock requirements-native-build.lock \
              "$bundle/cargo-crates" "$bundle/python-wheels"

      - name: RUST-019 dependency closure mutation contract
        shell: bash
        run: |
          set -euo pipefail
          bundle=/tmp/axven-rust019-dependencies
          env -i \
            HOME=/tmp \
            PATH="$PATH" \
            PYTHONUTF8=1 \
            PYTHONIOENCODING=utf-8 \
            PYTHONDONTWRITEBYTECODE=1 \
            python rust_019_offline_dependency_closure.py selftest \
              native/axven_native/Cargo.lock requirements-native-build.lock \
              "$bundle/cargo-crates" "$bundle/python-wheels"

      - name: Reverify detached RUST-019 dependency closure
        shell: bash
        run: |
          set -euo pipefail
          bundle=/tmp/axven-rust019-dependencies
          env -i \
            HOME=/tmp \
            PATH="$PATH" \
            PYTHONUTF8=1 \
            PYTHONIOENCODING=utf-8 \
            PYTHONDONTWRITEBYTECODE=1 \
            python rust_019_offline_dependency_closure.py verify \
              native/axven_native/Cargo.lock requirements-native-build.lock \
              "$bundle/cargo-crates" "$bundle/python-wheels"
