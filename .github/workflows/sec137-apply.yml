name: SEC137 Apply

on:
  push:
    branches:
      - security-sec137-canonical-txid-prelock
    paths:
      - .github/workflows/sec137-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply and verify SEC-137
        shell: pwsh
        run: |
          python .github/sec137_apply.py
          python security_sec137_canonical_txid_prelock_spec.py
      - name: Commit clean SEC-137 tree
        shell: pwsh
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git add core.py release_manifest.json security_sec137_canonical_txid_prelock_spec.py
          git rm .github/sec137_apply.py .github/workflows/sec137-apply.yml
          git commit -m "SEC-137: Enforce canonical transaction ids pre-lock"
          git push origin HEAD:security-sec137-canonical-txid-prelock
