name: SEC-135 Refresh Manifest

on:
  push:
    branches:
      - security-sec135-explorer-host-header-guard

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install and verify SEC-135
        shell: pwsh
        run: |
          chcp 65001
          python -m pip install -e .
          python security_sec135_explorer_host_header_guard_spec.py

      - name: Refresh manifest and self-delete
        shell: pwsh
        run: |
          python .github/sec135_refresh_manifest.py
          Remove-Item .github/sec135_refresh_manifest.py
          Remove-Item .github/workflows/sec135-refresh-manifest.yml
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "SEC-135: Refresh canonical manifest pins"
          git push
