name: SEC-131 apply wallet envelope canonicality

on:
  push:
    branches:
      - security-sec131-wallet-backup-envelope-canonicality
    paths:
      - .github/workflows/sec131-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply and verify SEC-131
        shell: pwsh
        run: |
          python .github/sec131_apply.py
          git config user.name "AxvenLabs Security Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wallet.py release_manifest.json security_sec131_wallet_backup_envelope_canonicality_spec.py
          git rm .github/sec131_apply.py .github/workflows/sec131-apply.yml
          git commit -m "SEC-131: Canonicalize wallet backup envelope"
          git push origin HEAD:security-sec131-wallet-backup-envelope-canonicality
