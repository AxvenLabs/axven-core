name: RUST-002 lock refresh

on:
  push:
    branches:
      - rust-rust002-smt-state-root-mirror

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[rust002-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          rustc --version
          cargo --version

      - name: Resolve exact RUST-002 lock additions
        run: |
          cargo check --manifest-path native/axven_native/Cargo.toml
          cargo check --locked --manifest-path native/axven_native/Cargo.toml
          git diff --check -- native/axven_native/Cargo.lock
          git diff -- native/axven_native/Cargo.lock

      - name: Commit Cargo.lock
        run: |
          git config user.name "AxvenLabs"
          git config user.email "dogacan432@gmail.com"
          git add native/axven_native/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git commit -m "RUST-002: lock SHA-256 dependency graph [rust002-lock]"
          git push
