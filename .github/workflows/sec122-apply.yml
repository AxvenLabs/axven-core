name: SEC-122 apply

on:
  push:
    branches:
      - security-sec122-p2p-inflight-frame-budget
    paths:
      - .github/sec122_patch.py
      - .github/workflows/sec122-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Enable UTF-8
        shell: pwsh
        run: chcp 65001
      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply SEC-122 and targeted validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/sec122_patch.py
          git rm .github/sec122_patch.py .github/workflows/sec122-apply.yml
          python security_sec122_p2p_inflight_frame_budget_spec.py
          python security_sec115_p2p_handshake_frame_budget_spec.py
          python security_sec118_p2p_inbound_block_work_budget_spec.py
          python security_sec119_p2p_inbound_tx_crypto_work_spec.py
          python security_sec120_block_signature_work_spec.py
          python security_sec121_outbound_sync_work_budget_spec.py
          python p2p_tcp_lifecycle_test.py
          python consensus_rebuild_test.py
          python release_packaging_test.py
          git diff --check
      - name: Commit clean production diff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'Axven Security Bot'
          git config user.email 'security-bot@axven.org'
          git add -A
          git status --short
          git commit -m 'SEC-122: Bound inbound in-flight frame bytes'
          git push origin HEAD:security-sec122-p2p-inflight-frame-budget
