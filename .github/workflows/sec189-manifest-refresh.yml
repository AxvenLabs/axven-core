name: SEC-189 Manifest Refresh

on:
  push:
    branches:
      - security-sec189-p2p-coinbase-canonicality
    paths:
      - .github/workflows/sec189-manifest-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Refresh p2p_tx_bounds manifest entry
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          target = Path("p2p_tx_bounds.py")
          manifest_path = Path("release_manifest.json")
          data = target.read_bytes()
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          entry = manifest["files"][target.name]
          entry["bytes"] = len(data)
          entry["sha256"] = hashlib.sha256(data).hexdigest()
          manifest_path.write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print(target.name, entry)
          PY

      - name: Commit refreshed manifest
        shell: bash
        run: |
          if git diff --quiet -- release_manifest.json; then
            echo "Manifest already current"
            exit 0
          fi
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add release_manifest.json
          git commit -m "SEC-189: refresh release manifest hash"
          git push origin HEAD:security-sec189-p2p-coinbase-canonicality
