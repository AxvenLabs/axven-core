name: SEC-177 Repair Builder

on:
  push:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
      - name: Repair SEC-126 compatibility and self-clean
        run: python sec177_repair_builder.py
      - name: Commit repaired branch
        shell: bash
        run: |
          git config user.name "AxvenLabs"
          git config user.email "dogacan432@gmail.com"
          git add -A
          git commit -m "SEC-177: Repair peer resource regression compatibility"
          git push origin HEAD:${GITHUB_REF_NAME}
