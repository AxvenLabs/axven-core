name: Axven Validation

on:
  push:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.15"

      - name: Install pinned packaging toolchain
        run: |
          python -m pip install "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0" "packaging==26.3"
          python -m pip install -e .
          python -m pip check

      - name: Build and probe SEC-186
        run: |
          python sec186_build.py
          python security_sec186_mldsa_production_verifier_spec.py
          python release_packaging_test.py

      - name: Commit generated SEC-186 files
        run: |
          git config user.name "Axven Security Builder"
          git config user.email "security-builder@axven.org"
          git add axven.py security_sec186_mldsa_production_verifier_spec.py release_manifest.json
          if git diff --cached --quiet; then
            echo "SEC-186 generated files already current"
          else
            git commit -m "SEC-186: Migrate ML-DSA consensus verification to pyca"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
