name: SEC-178 Dependency Closure Builder

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
      - name: Build SEC-178 without workflow self-write
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path("sec178_build.py").read_text(encoding="utf-8")
          old='WORKFLOW.write_text(workflow, encoding="utf-8", newline="\\n")'
          code=code.replace(old, 'workflow_raw=workflow.encode("utf-8")', 1)
          code=code.replace('    WORKFLOW,\n    REQ,', '    REQ,', 1)
          marker='MANIFEST.write_text(\n'
          injected='manifest["files"][WORKFLOW.as_posix()]={"bytes":len(workflow_raw),"sha256":hashlib.sha256(workflow_raw).hexdigest()}\n'
          if old in code or marker not in code:
              raise SystemExit("SEC-178 builder patch failed")
          code=code.replace(marker, injected+marker, 1)
          ns={"__file__":"sec178_build.py","__name__":"__main__"}
          exec(compile(code,"sec178_build.py","exec"),ns,ns)
          PY
      - name: Commit final non-workflow SEC-178 tree
        shell: bash
        run: |
          git config user.name "AxvenLabs"
          git config user.email "dogacan432@gmail.com"
          git add -A
          git commit -m "SEC-178: Pin complete Python dependency closure"
          git push origin HEAD:${GITHUB_REF_NAME}
