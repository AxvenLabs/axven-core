name: SEC185 Builder

on:
  push:

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/security-sec185-posix-security-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Generate SEC-185 clean tree
        shell: bash
        run: |
          set -euo pipefail
          python sec185_build.py
          git config user.name "AxvenLabs"
          git config user.email "dogacan432@gmail.com"
          BASE=38ad16c82a02f2abf6aede70c745d376c4c3b6d5
          rm -f sec185_build.py
          git add -A
          TREE=$(git write-tree)
          COMMIT=$(printf '%s\n\n%s\n' 'SEC-185: Add POSIX security CI lane' 'Run SEC-076+ hardening on real Ubuntu POSIX semantics while preserving the canonical Windows validation lane.' | git commit-tree "$TREE" -p "$BASE")
          git push --force origin "$COMMIT:refs/heads/security-sec185-posix-security-ci"
