name: Axven Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - name: Enable UTF-8
        shell: pwsh
        run: |
          chcp 65001

      - name: Install hash-locked packaging toolchain
        shell: pwsh
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-toolchain.lock
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-windows.lock
          python -m pip install --no-build-isolation --no-deps -e ".[legacy-mldsa-recovery]"
          python -m pip check

      - name: Full validation
        shell: pwsh
        run: |
          python run_full_validation.py

      - name: SEC-076+ security tail
        shell: pwsh
        run: |
          python security_tail_runner.py

  posix-validation:
    runs-on: ubuntu-latest

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - name: Run hash-locked POSIX validator
        shell: bash
        run: |
          bash validate_linux_macos.sh
