name: SEC-178 Dependency Closure Builder

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
      - name: Build SEC-178 and exact manifest pins
        run: python sec178_build.py
      - name: Commit final SEC-178 tree
        shell: bash
        run: |
          git config user.name "AxvenLabs"
          git config user.email "dogacan432@gmail.com"
          git add -A
          git commit -m "SEC-178: Pin complete Python dependency closure"
          git push origin HEAD:${GITHUB_REF_NAME}
