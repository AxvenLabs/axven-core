name: Axven Validation

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable UTF-8
        shell: pwsh
        run: |
          chcp 65001

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Prepare SEC-088
        shell: pwsh
        run: |
          if (-not (Select-String -Path p2p.py -Pattern "INBOUND_HANDSHAKE_TIMEOUT" -Quiet)) {
            python sec088_prepare.py
          }

      - name: Persist SEC-088 generated files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p2p.py release_manifest.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "TEMP SEC-088 generated patch"
            git push
          }

      - name: Full validation
        shell: pwsh
        run: |
          python run_full_validation.py

      - name: SEC-076+ security tail
        shell: pwsh
        run: |
          python security_tail_runner.py
