name: Axven Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.15"

      - name: Enable UTF-8
        shell: pwsh
        run: |
          chcp 65001

      - name: Install pinned packaging toolchain
        shell: pwsh
        run: |
          python -m pip install "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0" "packaging==26.3"
          python -m pip install -e .
          python -m pip check

      - name: Full validation
        shell: pwsh
        run: |
          python run_full_validation.py

      - name: SEC-076+ security tail
        shell: pwsh
        run: |
          python security_tail_runner.py
