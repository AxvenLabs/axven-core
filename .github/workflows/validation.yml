name: Axven Validation

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build-sec150:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Build SEC-150 source, regression, and manifest
        shell: bash
        run: |
          if grep -q 'def _preflight_chain_state_json(' axven.py; then
            echo 'SEC-150 already built; no builder commit needed'
            exit 0
          fi
          python sec150_build.py
          git config user.name "AxvenLabs"
          git config user.email "actions@users.noreply.github.com"
          git add axven.py release_manifest.json security_sec150_chain_state_json_preparse_spec.py
          git commit -m "SEC-150: Harden chain-state JSON preparse [SEC150-BUILT]"
          git push origin HEAD:security-sec150-chain-state-json-preparse
