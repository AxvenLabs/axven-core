name: Axven Validation

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.15"
      - name: Install pinned environment
        shell: pwsh
        run: |
          python -m pip install "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0" "packaging==26.3"
          python -m pip install -e .
      - name: SEC-188 OpenSSL binding capability probe
        shell: pwsh
        run: |
          @'
          from cryptography.hazmat.bindings.openssl.binding import Binding
          from cryptography.hazmat.bindings._rust import openssl as rust_openssl
          from cryptography.hazmat.backends.openssl.backend import backend
          b=Binding(); lib=b.lib; ffi=b.ffi
          print("OPENSSL:", backend.openssl_version_text())
          print("OPENSSL_NUMBER:", hex(backend.openssl_version_number()))
          print("MLDSA_SUPPORTED:", backend.mldsa_supported())
          symbols=[
              "EVP_PKEY_CTX_new_from_name","EVP_PKEY_fromdata_init","EVP_PKEY_fromdata",
              "EVP_PKEY_CTX_free","EVP_PKEY_free","OSSL_PARAM_construct_octet_string",
              "OSSL_PARAM_construct_end","EVP_MD_CTX_new","EVP_MD_CTX_free",
              "EVP_DigestSignInit_ex","EVP_DigestSign","EVP_PKEY_get_octet_string_param",
          ]
          for name in symbols:
              print("SYMBOL",name,hasattr(lib,name))
          for cdecl in ("OSSL_PARAM *","EVP_PKEY **","EVP_PKEY_CTX *","EVP_MD_CTX *"):
              try:
                  print("TYPE",cdecl,ffi.typeof(cdecl))
              except Exception as exc:
                  print("TYPE_MISSING",cdecl,type(exc).__name__,str(exc))
          print("RUST_OPENSSL_MODULE:", type(rust_openssl).__name__)
          print("SEC-188 CAPABILITY PROBE COMPLETE")
          '@ | python -
