name: SEC-142 Apply

on:
  push:
    branches:
      - security-sec142-peer-retry-publication-atomicity

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install
        shell: pwsh
        run: python -m pip install -e .
      - name: Apply SEC-142
        shell: pwsh
        run: python .github/sec142_apply.py
      - name: Focused regression
        shell: pwsh
        run: |
          python checkpoint47_peer_retry_daemon_spec.py
          python security_sec103_peer_retry_snapshot_atomicity_spec.py
          python security_sec104_peer_retry_delay_domain_spec.py
          python security_sec142_peer_retry_publication_atomicity_spec.py
      - name: Remove one-shot automation
        shell: pwsh
        run: |
          git rm .github/sec142_apply.py
          git rm .github/workflows/sec142-apply.yml
      - name: Validate clean candidate
        shell: pwsh
        run: |
          git diff --check
          python release_packaging_test.py
          python security_tail_runner.py
      - name: Commit clean SEC-142 candidate
        shell: pwsh
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git add -A
          git commit -m "SEC-142: Publish peer retry state atomically"
          git push origin HEAD:security-sec142-peer-retry-publication-atomicity
