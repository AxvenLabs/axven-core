name: SEC140 Apply

on:
  push:
    branches:
      - security-sec140-scheme-type-domain
    paths:
      - .github/workflows/sec140-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply and verify SEC-140
        shell: pwsh
        run: |
          python .github/sec140_apply.py
          python security_sec055_scheme_bounds_spec.py
          python security_sec140_scheme_type_domain_spec.py
      - name: Commit clean SEC-140 tree
        shell: pwsh
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git add core.py release_manifest.json security_sec140_scheme_type_domain_spec.py
          git rm .github/sec140_apply.py .github/workflows/sec140-apply.yml
          git commit -m "SEC-140: Enforce exact scheme selector types"
          git push origin HEAD:security-sec140-scheme-type-domain
