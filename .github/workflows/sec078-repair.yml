name: SEC-078 Manifest Repair
on:
  push:
    branches:
      - security-sec078-wallet-backup-envelope-bounds
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[manifest repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild manifest from canonical main
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:release_manifest.json > release_manifest.json
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('release_manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['files']['wallet.py'] = {
              'bytes': 11365,
              'sha256': '3a76921744cd691e94a4cbd01d7b52f0b5754f676ab3fbded17b68be091888db',
          }
          p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name AxvenLabs
          git config user.email dogacan432@gmail.com
          git add release_manifest.json
          git commit -m "SEC-078: Repair release manifest [manifest repaired] [skip ci]"
          git push origin HEAD:security-sec078-wallet-backup-envelope-bounds
