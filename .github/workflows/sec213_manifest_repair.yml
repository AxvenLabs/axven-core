name: SEC-213 one-shot manifest repair

on:
  push:
    branches:
      - security-sec213-windows-launcher-runtime-provenance

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Refresh SEC-213 manifest entries and remove helper
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          names = (
              'runtime_provenance.py',
              'ensure_runtime.ps1',
              'validate_windows.ps1',
              'start-node1.cmd',
              'start-node2.cmd',
              'start-public-p2p-node.cmd',
              'canonical_node1_start.ps1',
              'canonical_node2_start.ps1',
              'security_sec213_windows_launcher_runtime_provenance_spec.py',
          )
          manifest_path = Path('release_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for name in names:
              data = Path(name).read_bytes()
              manifest['files'][name] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          manifest['files'] = dict(sorted(manifest['files'].items()))
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sec213_manifest_repair.yml
          git add release_manifest.json
          git diff --cached --check
          git commit -m 'SEC-213: refresh release manifest'
          git push
