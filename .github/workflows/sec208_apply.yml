name: SEC-208 one-shot provenance apply

on:
  push:
    branches:
      - security-sec208-legacy-release-provenance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Refresh SEC-208 manifest entries
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("release_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          next_tag = "v0.9.0-devnet.1"
          manifest["tag"] = next_tag
          manifest["version"] = next_tag
          manifest["release"] = "axven-core-v0.9.0-devnet.1-github-ready-checkpoint26"

          for name in (
              "GITHUB_RELEASE.md",
              "RELEASE_CHECKLIST.md",
              "RELEASE_METADATA.json",
              "VERSION",
              "security_sec208_legacy_release_provenance_spec.py",
          ):
              data = Path(name).read_bytes()
              manifest["files"][name] = {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }

          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Quarantine legacy GitHub prerelease metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/368887129" > /tmp/sec208-release.json
          python3 - <<'PY'
          import json

          source = json.load(open("/tmp/sec208-release.json", "r", encoding="utf-8"))
          body = source.get("body") or ""
          notice = """> [!WARNING]\n> **LEGACY / SUPERSEDED PRE-SEC-205/SEC-207 RELEASE RECORD**\n> This historical prerelease is pinned to commit `2c144be2a1139cc3253ef98bac05d7acef2485b6` and predates Axven's external manifest trust anchor and exact-inventory staged release verification. It has no hardened Axven release asset. Do not treat GitHub-generated source archives for this tag as the current verified package. The historical tag will not be retargeted; use a later AxvenLabs release that publishes an external `release_manifest.json` SHA-256 and an exact-inventory staged asset.\n\n"""
          if "LEGACY / SUPERSEDED PRE-SEC-205/SEC-207 RELEASE RECORD" not in body:
              body = notice + body
          patch = {
              "name": "Axven Core v0.9.0 — LEGACY / SUPERSEDED Canonical Devnet Preview",
              "prerelease": True,
              "body": body,
          }
          with open("/tmp/sec208-release-patch.json", "w", encoding="utf-8") as fh:
              json.dump(patch, fh, ensure_ascii=False)
          PY
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/368887129" --input /tmp/sec208-release-patch.json > /tmp/sec208-release-updated.json

      - name: Commit canonical manifest and remove one-shot gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sec208_apply.yml
          git add release_manifest.json
          git diff --cached --check
          git commit -m "SEC-208: refresh release provenance manifest"
          git push
