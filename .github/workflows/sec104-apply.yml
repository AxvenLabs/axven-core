name: SEC-104 Apply

on:
  push:
    branches:
      - security-sec104-peer-retry-delay-domain-clean

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'AxvenLabs/axven-core' && github.ref == 'refs/heads/security-sec104-peer-retry-delay-domain-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-sec104-peer-retry-delay-domain-clean
          fetch-depth: 1

      - name: Apply SEC-104 hardening and regression contract
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          core_path = Path('core.py')
          source = core_path.read_text(encoding='utf-8')
          old = '''    @_peer_locked
    def set_peer_retry_schedule(self, peer, delay_seconds, base_interval=5.0):
        """Record operator-visible retry scheduling state for one peer."""
        addr=self._parse_peer(peer)
        raw_delay=float(delay_seconds)
        raw_base=float(base_interval)
        if (
            not math.isfinite(raw_delay)
            or not math.isfinite(raw_base)
            or raw_delay > 3600.0
            or raw_base > 3600.0
        ):
            raise ValueError("invalid peer retry timing")
        delay=max(0.0,raw_delay)
        base=max(0.5,raw_base)
        self.peer_retry_delay_seconds[addr]=delay
        self.peer_retry_base_interval[addr]=base
        self.peer_next_retry_at[addr]=(
            datetime.now(timezone.utc)
            .timestamp() + delay
        )
        self.peer_next_retry_at[addr]=(
            datetime.fromtimestamp(
                self.peer_next_retry_at[addr],timezone.utc
            ).isoformat().replace("+00:00","Z")
        )

    @_peer_locked
    def clear_peer_retry_schedule(self, peer):
        """Clear operator-visible retry scheduling state for one peer."""
        addr=self._parse_peer(peer)
        self.peer_retry_delay_seconds.pop(addr,None)
        self.peer_next_retry_at.pop(addr,None)
        self.peer_retry_base_interval.pop(addr,None)

    @_peer_locked
    def peer_retry_delay(self, peer, base_interval=5.0, cap=60.0):
        """Return bounded exponential retry delay for one outbound peer."""
        addr=self._parse_peer(peer)
        raw_base=float(base_interval)
        raw_cap=float(cap)
        if (
            not math.isfinite(raw_base)
            or not math.isfinite(raw_cap)
            or raw_base > 3600.0
            or raw_cap > 3600.0
        ):
            raise ValueError("invalid peer retry timing")
        base=max(0.5,raw_base)
        ceiling=max(base,raw_cap)
        failures=max(0,int(self.peer_consecutive_failures.get(addr,0)))

        # Failure #1 still uses the normal interval. Each subsequent
        # consecutive failure doubles the delay until the cap is reached.
        exponent=max(0,failures-1)
        return min(ceiling,base*(2 ** exponent))
'''
          new = '''    @staticmethod
    def _validate_peer_retry_seconds(value):
        if isinstance(value,bool) or not isinstance(value,(int,float)):
            raise ValueError("invalid peer retry timing")
        raw=float(value)
        if (
            not math.isfinite(raw)
            or raw < 0.0
            or raw > 3600.0
        ):
            raise ValueError("invalid peer retry timing")
        return raw

    @staticmethod
    def _validate_peer_failure_count(value):
        if (
            isinstance(value,bool)
            or not isinstance(value,int)
            or value < 0
            or value > 2147483647
        ):
            raise ValueError("invalid peer failure count")
        return value

    @_peer_locked
    def set_peer_retry_schedule(self, peer, delay_seconds, base_interval=5.0):
        """Record operator-visible retry scheduling state for one peer."""
        addr=self._parse_peer(peer)
        raw_delay=self._validate_peer_retry_seconds(delay_seconds)
        raw_base=self._validate_peer_retry_seconds(base_interval)
        delay=raw_delay
        base=max(0.5,raw_base)
        self.peer_retry_delay_seconds[addr]=delay
        self.peer_retry_base_interval[addr]=base
        self.peer_next_retry_at[addr]=(
            datetime.now(timezone.utc)
            .timestamp() + delay
        )
        self.peer_next_retry_at[addr]=(
            datetime.fromtimestamp(
                self.peer_next_retry_at[addr],timezone.utc
            ).isoformat().replace("+00:00","Z")
        )

    @_peer_locked
    def clear_peer_retry_schedule(self, peer):
        """Clear operator-visible retry scheduling state for one peer."""
        addr=self._parse_peer(peer)
        self.peer_retry_delay_seconds.pop(addr,None)
        self.peer_next_retry_at.pop(addr,None)
        self.peer_retry_base_interval.pop(addr,None)

    @_peer_locked
    def peer_retry_delay(self, peer, base_interval=5.0, cap=60.0):
        """Return bounded exponential retry delay for one outbound peer."""
        addr=self._parse_peer(peer)
        raw_base=self._validate_peer_retry_seconds(base_interval)
        raw_cap=self._validate_peer_retry_seconds(cap)
        base=max(0.5,raw_base)
        ceiling=max(base,raw_cap)
        failures=self._validate_peer_failure_count(
            self.peer_consecutive_failures.get(addr,0)
        )

        # Failure #1 still uses the normal interval. Each subsequent
        # consecutive failure doubles the delay until the cap is reached.
        # Bound the exponent before arithmetic so corrupted counters cannot
        # trigger giant integer construction or overflow work.
        exponent=max(0,failures-1)
        if exponent == 0 or ceiling == base:
            return base
        saturation_exponent=max(
            0,
            int(math.ceil(math.log2(ceiling/base))),
        )
        safe_exponent=min(exponent,saturation_exponent)
        return min(ceiling,math.ldexp(base,safe_exponent))
'''
          if source.count(old) != 1:
              raise SystemExit('SEC-104 core target mismatch')
          core_path.write_text(source.replace(old, new), encoding='utf-8', newline='\n')

          spec = '''#!/usr/bin/env python3
"""SEC-104 peer retry-delay domain and bounded arithmetic contract."""

from pathlib import Path

from core import AxvenCore


def expect_value_error(fn, label):
    try:
        fn()
    except ValueError:
        print(f"[GREEN] {label}")
        return
    except Exception as exc:
        raise AssertionError(
            f"{label}: wrong exception {type(exc).__name__}: {exc}"
        ) from exc
    raise AssertionError(label)


def main():
    checks = 0
    peer = ("127.0.0.1", 19107)
    core = AxvenCore()
    core.add_outbound_peer(peer)

    for failures, expected in ((0, 5.0), (1, 5.0), (2, 10.0), (5, 60.0), (20, 60.0)):
        core.peer_consecutive_failures[peer] = failures
        assert core.peer_retry_delay(peer, 5.0, 60.0) == expected
    checks += 1
    print("[GREEN] canonical bounded retry curve preserved")

    core.peer_consecutive_failures[peer] = 100_000
    assert core.peer_retry_delay(peer, 5.0, 60.0) == 60.0
    checks += 1
    print("[GREEN] large valid failure count saturates before exponentiation")

    for bad in (True, 2.5, "2", None, -1, 2_147_483_648):
        core.peer_consecutive_failures[peer] = bad
        expect_value_error(
            lambda: core.peer_retry_delay(peer, 5.0, 60.0),
            f"invalid failure counter rejected: {bad!r}",
        )
        checks += 1

    core.peer_consecutive_failures[peer] = 0
    for fn, label in (
        (lambda: core.set_peer_retry_schedule(peer, -0.1, 5.0), "negative retry delay rejected"),
        (lambda: core.peer_retry_delay(peer, -0.1, 60.0), "negative retry base rejected"),
        (lambda: core.peer_retry_delay(peer, 5.0, -1.0), "negative retry cap rejected"),
        (lambda: core.peer_retry_delay(peer, True, 60.0), "boolean retry timing rejected"),
        (lambda: core.peer_retry_delay(peer, "5", 60.0), "string retry timing rejected"),
    ):
        expect_value_error(fn, label)
        checks += 1

    source = Path(__import__('core').__file__).read_text(encoding='utf-8')
    assert "base*(2 ** exponent)" not in source
    assert "math.ldexp(base,safe_exponent)" in source
    checks += 1
    print("[GREEN] retry arithmetic is explicitly saturation-bounded")

    print(f"SEC-104 peer retry-delay domain: {checks}/{checks} GREEN")


if __name__ == "__main__":
    main()
'''
          spec_path = Path('security_sec104_peer_retry_delay_domain_spec.py')
          spec_path.write_text(spec, encoding='utf-8', newline='\n')

          manifest_path = Path('release_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for name in ('core.py', spec_path.name):
              data = Path(name).read_bytes()
              manifest['files'][name] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          manifest['files'] = dict(sorted(manifest['files'].items()))
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY

      - name: Commit clean SEC-104 tree and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/sec104-apply.yml
          git add core.py security_sec104_peer_retry_delay_domain_spec.py release_manifest.json
          git diff --cached --check
          python security_sec104_peer_retry_delay_domain_spec.py
          git commit -m "SEC-104: Harden peer retry-delay domains"
          git push origin HEAD:security-sec104-peer-retry-delay-domain-clean
