name: SEC-104 Apply

on:
  push:
    branches:
      - security-sec104-peer-retry-delay-domain-clean

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-sec104-peer-retry-delay-domain-clean
          fetch-depth: 1
      - name: Apply SEC-104 patch
        run: python .github/sec104_apply.py
      - name: Validate and commit clean tree
        shell: bash
        run: |
          python security_sec104_peer_retry_delay_domain_spec.py
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/sec104-apply.yml .github/sec104_apply.py
          git add core.py security_sec104_peer_retry_delay_domain_spec.py release_manifest.json
          git diff --cached --check
          git commit -m "SEC-104: Harden peer retry-delay domains"
          git push origin HEAD:security-sec104-peer-retry-delay-domain-clean
