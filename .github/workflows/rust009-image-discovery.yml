name: RUST-009 manylinux image discovery

on:
  push:
    paths:
      - ".github/workflows/rust009-image-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pull official PyPA manylinux image without executing it
        shell: bash
        run: |
          set -euo pipefail
          image="quay.io/pypa/manylinux_2_28_x86_64:2026.05.07-2"
          docker pull "$image"
          repo_digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          image_id="$(docker image inspect "$image" --format '{{.Id}}')"
          printf 'RUST009_IMAGE=%s\n' "$image"
          printf 'RUST009_REPO_DIGEST=%s\n' "$repo_digest"
          printf 'RUST009_IMAGE_ID=%s\n' "$image_id"
          case "$repo_digest" in
            quay.io/pypa/manylinux_2_28_x86_64@sha256:*) ;;
            *) echo "unexpected repository digest: $repo_digest" >&2; exit 1 ;;
          esac
