name: Axven Native Fuzz

on:
  push:
    paths:
      - "native/**"
      - "RUST_003.md"
      - "rust_003_native_fuzz_contract_spec.py"
      - ".github/workflows/native-fuzz.yml"
  pull_request:
    paths:
      - "native/**"
      - "RUST_003.md"
      - "rust_003_native_fuzz_contract_spec.py"
      - ".github/workflows/native-fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYO3_PYTHON: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: RUST-003 static boundary contract
        run: python rust_003_native_fuzz_contract_spec.py

      - name: Install exact fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-08-20 --profile minimal
          python --version
          rustc +nightly-2026-08-20 --version
          cargo +nightly-2026-08-20 --version

      - name: Install exact cargo-fuzz
        run: |
          cargo +nightly-2026-08-20 install cargo-fuzz --version 0.13.2 --locked
          cargo +nightly-2026-08-20 fuzz --version

      - name: Verify locked fuzz dependency graph
        run: |
          test -f native/axven_native/fuzz/Cargo.lock
          cargo +nightly-2026-08-20 metadata --locked --manifest-path native/axven_native/fuzz/Cargo.toml --no-deps > /dev/null

      - name: Coverage-guided native SMT fuzz
        run: |
          cargo +nightly-2026-08-20 fuzz run --fuzz-dir native/axven_native/fuzz smt_mirror -- \
            -runs=20000 \
            -max_len=4096 \
            -timeout=5 \
            -rss_limit_mb=1024 \
            -print_final_stats=1

      - name: Fuzz lockfile remains stable
        run: git diff --exit-code -- native/axven_native/fuzz/Cargo.lock
