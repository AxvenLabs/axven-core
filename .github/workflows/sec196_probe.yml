name: SEC-196 time-warp probe

on:
  push:
    branches:
      - security-sec196-timewarp-guard-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
      - name: Install pinned runtime
        shell: pwsh
        run: |
          python -m pip install "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0" "packaging==26.3"
          python -m pip install -e .
          python -m pip check
      - name: Reproduce current consensus time-warp
        shell: pwsh
        run: python security_sec196_timewarp_probe.py
