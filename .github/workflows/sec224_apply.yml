name: SEC-224 Apply

on:
  push:
    branches:
      - security-sec224-bounded-bulk-sync-fanout

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Apply SEC-224 bounded bulk sync fanout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          core_path = Path('core.py')
          text = core_path.read_text(encoding='utf-8')

          old_const = '''    MAX_PROPAGATION_WORKERS = 16\n    # SEC-197: one routable IP network group or canonical DNS host must not\n'''
          new_const = '''    MAX_PROPAGATION_WORKERS = 16\n    # SEC-224: bulk operator sync must retain full peer coverage without\n    # serially multiplying per-peer network latency across the configured set.\n    MAX_SYNC_WORKERS = 16\n    # SEC-197: one routable IP network group or canonical DNS host must not\n'''
          if old_const not in text:
              raise SystemExit('SEC-224 constant anchor not found')
          text = text.replace(old_const, new_const, 1)

          old_method = '''    def sync_outbound_peers(self):\n        return [\n            self.sync_outbound_peer(addr)\n            for addr in self.outbound_peer_addresses()\n        ]\n'''
          new_method = '''    def sync_outbound_peers(self):\n        peers=self.outbound_peer_addresses()\n        if not peers:\n            return []\n        worker_count=min(self.MAX_SYNC_WORKERS,len(peers))\n        # ThreadPoolExecutor.map preserves the configured-peer result order,\n        # while sync_outbound_peer remains the sole owner of provenance gates,\n        # work budgets, timeouts and peer-health publication semantics.\n        with ThreadPoolExecutor(max_workers=worker_count) as executor:\n            return list(executor.map(self.sync_outbound_peer,peers))\n'''
          if old_method not in text:
              raise SystemExit('SEC-224 method anchor not found')
          text = text.replace(old_method, new_method, 1)
          core_path.write_text(text, encoding='utf-8')

          manifest_path = Path('release_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest['files']
          for name in ('core.py', 'security_sec224_bounded_bulk_sync_fanout_spec.py'):
              raw = Path(name).read_bytes()
              files[name] = {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
          manifest['files'] = dict(sorted(files.items()))
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          git diff --check
          git diff -- core.py release_manifest.json

      - name: Commit SEC-224 production fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core.py release_manifest.json
          git commit -m 'SEC-224: bound bulk outbound sync fanout'
          git push origin HEAD:${GITHUB_REF_NAME}
