name: Axven Native Portable Attestation

on:
  push:
    paths:
      - "native/**"
      - "RUST_009.md"
      - "RUST_010.md"
      - "RUST_011.md"
      - "rust_009_portable_linux_wheel_spec.py"
      - "rust_011_portable_attestation.py"
      - "rust_011_portable_attestation_policy_spec.py"
      - "requirements-native-build.lock"
      - "requirements-ci-runtime-posix.lock"
      - ".github/workflows/native-portable-attestation.yml"
  pull_request:
    paths:
      - "native/**"
      - "RUST_009.md"
      - "RUST_010.md"
      - "RUST_011.md"
      - "rust_009_portable_linux_wheel_spec.py"
      - "rust_011_portable_attestation.py"
      - "rust_011_portable_attestation_policy_spec.py"
      - "requirements-native-build.lock"
      - "requirements-ci-runtime-posix.lock"
      - ".github/workflows/native-portable-attestation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:443eabd378e140996780a772e12c1a1ef10551da933fe76d74a1bab61f68a7b7

jobs:
  portable-attested-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AXVEN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install hash-locked Axven runtime dependencies
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock

      - name: Install exact host Rust toolchain for controlled mount
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          python --version
          rustc --version
          cargo --version

      - name: RUST-011 static portable attestation policy
        run: python rust_011_portable_attestation_policy_spec.py

      - name: Pull and verify immutable manylinux image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$MANYLINUX_IMAGE"
          resolved="$(docker image inspect "$MANYLINUX_IMAGE" --format '{{index .RepoDigests 0}}')"
          test "$resolved" = "$MANYLINUX_IMAGE"
          printf 'RUST-011 pinned image: %s\n' "$resolved"

      - name: Build locked manylinux_2_28 wheel inside pinned image
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wheelhouse-portable .rust011-tools portable-provenance.json portable-attestation.json
          mkdir -p wheelhouse-portable .rust011-tools
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_HOME=/cargo \
            -e RUSTUP_HOME=/rustup \
            -e RUSTUP_TOOLCHAIN=1.98.0 \
            -e PYO3_PYTHON=/opt/python/cp313-cp313/bin/python \
            -e PATH=/cargo/bin:/opt/python/cp313-cp313/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cargo:/cargo" \
            -v "$HOME/.rustup:/rustup:ro" \
            -w /work \
            "$MANYLINUX_IMAGE" \
            /bin/bash -lc '
              set -euo pipefail
              python -c "import platform; assert platform.python_version() == \"3.13.15\", platform.python_version()"
              rustc --version | grep -F "rustc 1.98.0 "
              cargo --version | grep -F "cargo 1.98.0 "
              python -m pip install --no-deps --only-binary=:all: --require-hashes --target /work/.rust011-tools -r /work/requirements-native-build.lock
              export PYTHONPATH=/work/.rust011-tools
              export PATH=/work/.rust011-tools/bin:$PATH
              test -x /work/.rust011-tools/bin/maturin
              test "$(maturin --version)" = "maturin 1.15.0"
              maturin build --release --locked --compatibility manylinux_2_28 --manifest-path /work/native/axven_native/Cargo.toml --interpreter /opt/python/cp313-cp313/bin/python --out /work/wheelhouse-portable
              auditwheel show /work/wheelhouse-portable/*.whl
            '

      - name: Recheck RUST-009 portable wheel contract
        run: python rust_009_portable_linux_wheel_spec.py

      - name: Generate canonical portable provenance
        run: python rust_011_portable_attestation.py generate portable-provenance.json

      - name: Seal TEST-ONLY portable attestation envelope
        run: python rust_011_portable_attestation.py seal portable-provenance.json portable-attestation.json

      - name: Verify portable evidence pair
        run: python rust_011_portable_attestation.py verify portable-provenance.json portable-attestation.json

      - name: Exercise fail-closed portable mutation contract
        run: python rust_011_portable_attestation.py selftest portable-provenance.json portable-attestation.json

      - name: Reverify evidence after mutation tests
        run: python rust_011_portable_attestation.py verify portable-provenance.json portable-attestation.json
