name: SEC-193 Helper Anchor Fix

on:
  push:
    branches:
      - security-sec193-remote-identity-provenance
    paths:
      - .github/workflows/sec193-helper-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security-sec193-remote-identity-provenance
      - name: Repair apply helper anchor policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/sec193-apply.yml')
          text=p.read_text(encoding='utf-8')
          old='''              if count != 1:\n                  raise AssertionError(f"{path}: expected one patch anchor, found {count}")\n'''
          new='''              if count < 1:\n                  raise AssertionError(f"{path}: patch anchor not found")\n'''
          if text.count(old) != 1:
              raise AssertionError('SEC-193 helper anchor-policy patch point mismatch')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit helper repair
        shell: bash
        run: |
          git config user.name "Axven Security Bot"
          git config user.email "security-bot@users.noreply.github.com"
          git add .github/workflows/sec193-apply.yml
          git diff --cached --check
          git commit -m "SEC-193: repair apply helper anchor handling"
          git push origin HEAD:security-sec193-remote-identity-provenance
