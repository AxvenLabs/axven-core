name: RUST-001 lock bootstrap

on:
  push:
    branches:
      - rust-rust001-axven-native-skeleton

permissions:
  contents: write

jobs:
  lock-native-deps:
    if: ${{ !contains(github.event.head_commit.message, '[rust001-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.98.0
          rustc --version
          cargo --version

      - name: Generate and verify Cargo.lock
        run: |
          cargo generate-lockfile --manifest-path native/axven_native/Cargo.toml
          cargo check --locked --manifest-path native/axven_native/Cargo.toml
          cargo check --locked --manifest-path native/axven_native/Cargo.toml --features extension-module

      - name: Commit immutable native dependency graph
        run: |
          git config user.name "AxvenLabs"
          git config user.email "dogacan432@gmail.com"
          git add native/axven_native/Cargo.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git commit -m "RUST-001: lock PyO3 dependency graph [rust001-lock]"
          git push origin HEAD:rust-rust001-axven-native-skeleton
