name: SEC-191 Apply KDF Hardening

on:
  push:
    branches:
      - security-sec191-wallet-kdf-hardening
    paths:
      - .github/workflows/sec191-apply-kdf-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security-sec191-wallet-kdf-hardening
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Apply KDF hardening and refresh manifest
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          from pathlib import Path

          p = Path('wallet.py')
          text = p.read_text(encoding='utf-8')
          old = '''_SCRYPT_N = 1 << 14
          _SCRYPT_R = 8
          _SCRYPT_P = 1
          _SCRYPT_DKLEN = 32
          _SCRYPT_PARAMS = {"n": _SCRYPT_N, "r": _SCRYPT_R, "p": _SCRYPT_P, "dklen": _SCRYPT_DKLEN}
          '''
          new = '''_SCRYPT_LEGACY_PARAMS = {"n": 1 << 14, "r": 8, "p": 1, "dklen": 32}
          _SCRYPT_N = 1 << 17
          _SCRYPT_R = 8
          _SCRYPT_P = 1
          _SCRYPT_DKLEN = 32
          _SCRYPT_PARAMS = {"n": _SCRYPT_N, "r": _SCRYPT_R, "p": _SCRYPT_P, "dklen": _SCRYPT_DKLEN}
          _SCRYPT_ACCEPTED_PARAMS = (_SCRYPT_LEGACY_PARAMS, _SCRYPT_PARAMS)
          _SCRYPT_MAXMEM = 256 * 1024 * 1024
          '''
          if old not in text:
              raise SystemExit('SEC-191 constants anchor not found')
          text = text.replace(old, new, 1)

          old_validator = '''def _validated_scrypt_params(value):
              if type(value) is not dict or set(value) != set(_SCRYPT_PARAMS):
                  raise BackupError("unsupported scrypt parameters")
              for name, expected in _SCRYPT_PARAMS.items():
                  if type(value[name]) is not int or value[name] != expected:
                      raise BackupError("unsupported scrypt parameters")
              return _SCRYPT_PARAMS
          '''
          new_validator = '''def _validated_scrypt_params(value):
              if type(value) is not dict or set(value) != set(_SCRYPT_PARAMS):
                  raise BackupError("unsupported scrypt parameters")
              for name in _SCRYPT_PARAMS:
                  if type(value[name]) is not int:
                      raise BackupError("unsupported scrypt parameters")
              for approved in _SCRYPT_ACCEPTED_PARAMS:
                  if value == approved:
                      return approved
              raise BackupError("unsupported scrypt parameters")
          '''
          if old_validator not in text:
              raise SystemExit('SEC-191 validator anchor not found')
          text = text.replace(old_validator, new_validator, 1)

          old_export = '''key = hashlib.scrypt(passphrase.encode(), salt=salt, n=_SCRYPT_N,
                               r=_SCRYPT_R, p=_SCRYPT_P, dklen=_SCRYPT_DKLEN)'''
          new_export = '''key = hashlib.scrypt(passphrase.encode(), salt=salt, n=_SCRYPT_N,
                               r=_SCRYPT_R, p=_SCRYPT_P, dklen=_SCRYPT_DKLEN,
                               maxmem=_SCRYPT_MAXMEM)'''
          if old_export not in text:
              raise SystemExit('SEC-191 export scrypt anchor not found')
          text = text.replace(old_export, new_export, 1)

          old_restore = '''key = hashlib.scrypt(passphrase.encode(), salt=salt, n=kp["n"],
                                   r=kp["r"], p=kp["p"], dklen=kp["dklen"])'''
          new_restore = '''key = hashlib.scrypt(passphrase.encode(), salt=salt, n=kp["n"],
                                   r=kp["r"], p=kp["p"], dklen=kp["dklen"],
                                   maxmem=_SCRYPT_MAXMEM)'''
          if old_restore not in text:
              raise SystemExit('SEC-191 restore scrypt anchor not found')
          text = text.replace(old_restore, new_restore, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          sec77 = Path('security_sec077_wallet_kdf_resource_bounds_spec.py')
          sec77.write_text('''#!/usr/bin/env python3
          """SEC-077 wallet backup KDF resource bounds contract."""
          from __future__ import annotations

          from copy import deepcopy

          import wallet


          def expect_rejected_before_scrypt(backup, label):
              original = wallet.hashlib.scrypt
              calls = []

              def forbidden(*args, **kwargs):
                  calls.append((args, kwargs))
                  raise AssertionError("scrypt must not run for rejected backup parameters")

              wallet.hashlib.scrypt = forbidden
              try:
                  try:
                      wallet.restore_backup(backup, "sec077-passphrase")
                  except wallet.BackupError:
                      pass
                  else:
                      raise AssertionError(label + " accepted")
              finally:
                  wallet.hashlib.scrypt = original
              assert not calls, label + " reached scrypt"
              print("[GREEN]", label, "rejected before scrypt")


          def main():
              checks = 0
              canonical = {"n": 1 << 17, "r": 8, "p": 1, "dklen": 32}
              legacy = {"n": 1 << 14, "r": 8, "p": 1, "dklen": 32}
              assert wallet._SCRYPT_PARAMS == canonical
              checks += 1
              print("[GREEN] strengthened canonical scrypt parameters pinned")

              assert wallet._validated_scrypt_params(dict(legacy)) == legacy
              checks += 1
              print("[GREEN] legacy scrypt parameters retained only as approved restore tuple")

              identity = wallet.WalletIdentity()
              backup = wallet.export_backup(identity, "sec077-passphrase")
              assert backup["kdf_params"] == canonical
              restored = wallet.restore_backup(deepcopy(backup), "sec077-passphrase")
              assert restored.address_n == identity.address_n
              assert restored.address_m == identity.address_m
              assert restored.address_h == identity.address_h
              checks += 1
              print("[GREEN] strengthened canonical backup round-trip preserved")

              bad_cases = []

              b = deepcopy(backup)
              b["kdf_params"] = None
              bad_cases.append(("non-object kdf_params", b))

              b = deepcopy(backup)
              del b["kdf_params"]["n"]
              bad_cases.append(("missing kdf parameter", b))

              b = deepcopy(backup)
              b["kdf_params"]["extra"] = 1
              bad_cases.append(("unknown kdf parameter", b))

              b = deepcopy(backup)
              b["kdf_params"]["n"] = str(1 << 17)
              bad_cases.append(("string scrypt n", b))

              b = deepcopy(backup)
              b["kdf_params"]["n"] = True
              bad_cases.append(("boolean scrypt n", b))

              b = deepcopy(backup)
              b["kdf_params"]["r"] = 8.0
              bad_cases.append(("float scrypt r", b))

              b = deepcopy(backup)
              b["kdf_params"]["n"] = 1 << 20
              bad_cases.append(("oversized scrypt n", b))

              b = deepcopy(backup)
              b["kdf_params"]["n"] = 1 << 15
              bad_cases.append(("unapproved intermediate scrypt n", b))

              b = deepcopy(backup)
              b["kdf_params"]["r"] = 9
              bad_cases.append(("noncanonical scrypt r", b))

              b = deepcopy(backup)
              b["kdf_params"]["p"] = 2
              bad_cases.append(("noncanonical scrypt p", b))

              b = deepcopy(backup)
              b["kdf_params"]["dklen"] = 64
              bad_cases.append(("noncanonical scrypt dklen", b))

              for label, candidate in bad_cases:
                  expect_rejected_before_scrypt(candidate, label)
                  checks += 1

              assert checks == 14
              print(f"SEC-077 wallet backup KDF resource bounds: {checks}/14 GREEN")


          if __name__ == "__main__":
              main()
          '''.replace('          ', ''), encoding='utf-8', newline='\n')

          manifest_path = Path('release_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for name in ('wallet.py', 'security_sec077_wallet_kdf_resource_bounds_spec.py'):
              if name in manifest.get('files', {}):
                  data = Path(name).read_bytes()
                  manifest['files'][name]['bytes'] = len(data)
                  manifest['files'][name]['sha256'] = hashlib.sha256(data).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=False) + '\n', encoding='utf-8', newline='\n')
          '@ | python -
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add wallet.py security_sec077_wallet_kdf_resource_bounds_spec.py release_manifest.json
          git diff --cached --check
          git commit -m "SEC-191: strengthen wallet backup KDF"
          git push origin HEAD:security-sec191-wallet-kdf-hardening
