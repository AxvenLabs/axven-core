name: ARCH-001 Research Evidence

on:
  pull_request:
    paths:
      - 'research/programmable_l1/**'
      - '.github/workflows/arch001-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Install hash-locked runtime
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-toolchain.lock
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock
          python -m pip install --no-build-isolation --no-deps -e '.[legacy-mldsa-recovery]'
          python -m pip check
      - name: Research integration and diagnostic fail-closed regressions
        run: |
          python research/programmable_l1/arch001_evidence_integration_test.py
          python research/programmable_l1/arch001_auth_timing_protocol_test.py
          python -O research/programmable_l1/arch001_auth_timing_protocol_test.py
      - name: Canonical deterministic comparison evidence
        run: python research/programmable_l1/arch001_decision_bundle.py
      - name: Separate verification timing diagnostic (no performance threshold)
        run: python research/programmable_l1/arch001_auth_timing_protocol_evidence.py
