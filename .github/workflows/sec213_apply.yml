name: SEC-213 one-shot apply

on:
  push:
    branches:
      - security-sec213-wallet-utxo-response-bounds

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Apply SEC-213 service/RPC bounds, refresh manifest, remove helper
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          def replace_once(path, old, new):
              text = Path(path).read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one replacement, got {text.count(old)}')
              Path(path).write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace_once(
              'core.py',
              '''    PEER_HEALTH_INCIDENT_HISTORY_LIMIT = 64\n    PEER_HEALTH_HISTORY_LIMIT = 64\n''',
              '''    PEER_HEALTH_INCIDENT_HISTORY_LIMIT = 64\n    PEER_HEALTH_HISTORY_LIMIT = 64\n    # SEC-213: a public wallet address can be dusted with an arbitrary number\n    # of UTXOs over time. Never materialize or serialize an unbounded wallet\n    # UTXO response from local operator RPC.\n    MAX_LIST_UNSPENT_RESULTS = 1000\n    MAX_LIST_UNSPENT_OFFSET = (1 << 31) - 1\n''',
          )

          replace_once(
              'core.py',
              '''    def wallet_status(self, scheme=None):\n        self._validate_scheme_bound(scheme)\n        with self.chain._state_lock:\n            return self._wallet_status_locked(scheme)\n''',
              '''    def _iter_wallet_spendable_for_address_locked(self, address):\n        tip_height = self.chain.tip.height\n        for op, utxo in self.chain.utxo.items():\n            if utxo["recipient"] != address:\n                continue\n            if (\n                utxo["coinbase"]\n                and tip_height - utxo["height"] < axven.COINBASE_MATURITY\n            ):\n                continue\n            txid, idx = op.rsplit(":", 1)\n            yield txid, int(idx), int(utxo["amount"])\n\n    def wallet_status(self, scheme=None):\n        self._validate_scheme_bound(scheme)\n        with self.chain._state_lock:\n            return self._wallet_status_locked(scheme)\n''',
          )

          replace_once(
              'core.py',
              '''            total = int(self.chain.balance(address))\n            mature = list(self.chain.spendable(address))\n\n            reserved = sum(\n                int(amount)\n                for txid, idx, amount in mature\n                if self.pending.is_reserved((txid, idx))\n            )\n            spendable = sum(\n                int(amount)\n                for txid, idx, amount in mature\n                if not self.pending.is_reserved((txid, idx))\n            )\n            immature = total - spendable - reserved\n''',
              '''            total = int(self.chain.balance(address))\n            reserved = 0\n            spendable = 0\n            for txid, idx, amount in self._iter_wallet_spendable_for_address_locked(address):\n                if self.pending.is_reserved((txid, idx)):\n                    reserved += amount\n                else:\n                    spendable += amount\n            immature = total - spendable - reserved\n''',
          )

          replace_once(
              'core.py',
              '''    def list_unspent(self, scheme):\n        self._validate_scheme_bound(scheme)\n        with self.chain._state_lock:\n            w = self.require_wallet()\n            return [\n                {"txid": txid, "index": idx, "amount": amount}\n                for txid, idx, amount in self.chain.spendable(w.address_of(scheme))\n                if not self.pending.is_reserved((txid, idx))\n            ]\n''',
              '''    def _list_unspent_page_locked(self, scheme, offset, limit):\n        w = self.require_wallet()\n        address = w.address_of(scheme)\n        items = []\n        matched = 0\n        next_offset = None\n        for txid, idx, amount in self._iter_wallet_spendable_for_address_locked(address):\n            if self.pending.is_reserved((txid, idx)):\n                continue\n            if matched < offset:\n                matched += 1\n                continue\n            if len(items) >= limit:\n                next_offset = offset + len(items)\n                break\n            items.append({"txid": txid, "index": idx, "amount": amount})\n            matched += 1\n        return {\n            "offset": offset,\n            "limit": limit,\n            "utxos": items,\n            "next_offset": next_offset,\n        }\n\n    def list_unspent(self, scheme):\n        self._validate_scheme_bound(scheme)\n        with self.chain._state_lock:\n            page = self._list_unspent_page_locked(\n                scheme, 0, self.MAX_LIST_UNSPENT_RESULTS\n            )\n            if page["next_offset"] is not None:\n                raise ValueError(\n                    "too many unspent outputs; use list_unspent_page"\n                )\n            return page["utxos"]\n\n    def list_unspent_page(self, scheme, offset=0, limit=100):\n        self._validate_scheme_bound(scheme)\n        offset = self._validate_service_int(\n            offset, "unspent offset", 0, self.MAX_LIST_UNSPENT_OFFSET\n        )\n        limit = self._validate_service_int(\n            limit, "unspent limit", 1, self.MAX_LIST_UNSPENT_RESULTS\n        )\n        with self.chain._state_lock:\n            return self._list_unspent_page_locked(scheme, offset, limit)\n''',
          )

          replace_once(
              'rpc.py',
              '''    "list_unspent": (frozenset({"scheme"}), frozenset({"scheme"})),\n    "get_peers": (frozenset(), frozenset()),\n''',
              '''    "list_unspent": (frozenset({"scheme"}), frozenset({"scheme"})),\n    "list_unspent_page": (\n        frozenset({"scheme", "offset", "limit"}),\n        frozenset({"scheme"}),\n    ),\n    "get_peers": (frozenset(), frozenset()),\n''',
          )

          replace_once(
              'rpc.py',
              '''        if method == "list_unspent": return self.core.list_unspent(p["scheme"])\n        if method == "get_peers": return self.core.outbound_peer_status()\n''',
              '''        if method == "list_unspent": return self.core.list_unspent(p["scheme"])\n        if method == "list_unspent_page":\n            offset = _require_rpc_int(p.get("offset", 0), "unspent offset")\n            limit = _require_rpc_int(p.get("limit", 100), "unspent limit")\n            if offset < 0 or offset > self.core.MAX_LIST_UNSPENT_OFFSET:\n                raise RPCError("invalid unspent offset")\n            if limit < 1 or limit > self.core.MAX_LIST_UNSPENT_RESULTS:\n                raise RPCError("invalid unspent limit")\n            return self.core.list_unspent_page(p["scheme"], offset, limit)\n        if method == "get_peers": return self.core.outbound_peer_status()\n''',
          )

          manifest_path = Path('release_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for name in (
              'core.py',
              'rpc.py',
              'security_sec213_wallet_utxo_response_bounds_spec.py',
          ):
              data = Path(name).read_bytes()
              manifest['files'][name] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          manifest['files'] = dict(sorted(manifest['files'].items()))
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sec213_apply.yml
          git add core.py rpc.py release_manifest.json security_sec213_wallet_utxo_response_bounds_spec.py
          git diff --cached --check
          git commit -m 'SEC-213: bound wallet UTXO responses'
          git push
