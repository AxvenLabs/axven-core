name: Axven Native RUST-141 Checkpoint Monitor Rotation Journal

on:
  push:
    paths:
      - "requirements-ci-runtime-posix.lock"
      - "rust_*.py"
      - "RUST_*.md"
      - ".github/workflows/native-rust140-multistep-rust138-checkpoint-monitor-rotation.yml"
      - ".github/workflows/native-rust141-checkpoint-monitor-rotation-journal.yml"
  pull_request:
    paths:
      - "requirements-ci-runtime-posix.lock"
      - "rust_*.py"
      - "RUST_*.md"
      - ".github/workflows/native-rust140-multistep-rust138-checkpoint-monitor-rotation.yml"
      - ".github/workflows/native-rust141-checkpoint-monitor-rotation-journal.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  rust141:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AXVEN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Install hash-locked producer dependency
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock
      - name: RUST-141 static monitor rotation journal policy
        run: |
          python rust_140_multistep_rust138_checkpoint_monitor_rotation_policy_spec.py
          python rust_141_rust138_checkpoint_monitor_rotation_journal_policy_spec.py
      - name: Generate reviewed continuity and monitor rotation journal evidence
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 36 141); do
            printf -v n3 "%03d" "$n"
            files=(rust_${n3}_*_fixture.py)
            test "${#files[@]}" -eq 1
            test -e "${files[0]}"
            python "${files[0]}" "$AXVEN_SOURCE_SHA"
          done
      - name: Make continuity evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 36 141); do
            printf -v n3 "%03d" "$n"
            files=(/tmp/axven-rust${n3}-*.json)
            test -e "${files[0]}"
            chmod 0444 "${files[@]}"
          done
          for f in /tmp/axven-rust141-*.json; do test "$(stat -c '%a' "$f")" = "444"; done
      - name: Stage detached RUST-141 consumer
        shell: bash
        run: |
          set -euo pipefail
          c=/tmp/axven-rust141-consumer
          rm -rf "$c"
          mkdir -p "$c"
          for n in $(seq 30 141); do
            printf -v n3 "%03d" "$n"
            files=(rust_${n3}_*_verify.py)
            test "${#files[@]}" -eq 1
            test -e "${files[0]}"
            cp "${files[0]}" "$c/"
          done
          cp rust_141_rust138_checkpoint_monitor_rotation_journal_selftest.py "$c/"
          cp /tmp/axven-rust036-final-state.json "$c/final-state.json"
          test "$(find "$c" -maxdepth 1 -type f | wc -l)" -eq 114
          test "$(find "$c" -type l | wc -l)" -eq 0
          test ! -e "$c/.git"
          test ! -e "$c/rust_141_rust138_checkpoint_monitor_rotation_journal_fixture.py"
      - name: Inherit fixed predecessor manifest and append RUST-141 paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          rust082 = Path(
              ".github/workflows/native-monitor-rotation-journal-observer-rotation-journal-"
              "monitor-rotation-journal-observer-rotation-journal-monitor.yml"
          ).read_text(encoding="utf-8")
          start = "          cat > /tmp/axven-rust082-paths <<'EOF'\n"
          if rust082.count(start) != 1:
              raise SystemExit("unexpected RUST-082 manifest marker count")
          tail = rust082.split(start, 1)[1]
          end = "          EOF\n"
          if end not in tail:
              raise SystemExit("missing RUST-082 manifest terminator")
          block = tail.split(end, 1)[0]
          rows = []
          for line in block.splitlines():
              if not line.startswith("          "):
                  raise SystemExit("unexpected RUST-082 manifest indentation")
              rows.append(line[10:])
          if len(rows) != 134:
              raise SystemExit(f"expected 134 RUST-082 paths, got {len(rows)}")

          predecessor = Path(
              ".github/workflows/native-rust099-rust098-checkpoint-monitor-rotation.yml"
          ).read_text(encoding="utf-8")
          marker = "      - name: Inherit fixed predecessor manifest and append RUST-099 paths\n"
          next_marker = "      - name: Verify detached RUST-099 rotation and fail-closed contract\n"
          if predecessor.count(marker) != 1 or next_marker not in predecessor:
              raise SystemExit("unexpected RUST-099 manifest markers")
          segment = predecessor.split(marker, 1)[1].split(next_marker, 1)[0]
          found = re.findall(r'"(/tmp/axven-rust\d{3}-[^"\n]+\.json)"', segment)
