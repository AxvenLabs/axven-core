name: SEC-197 one-shot regression count repair

on:
  push:
    branches:
      - security-sec197-peer-diversity

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Repair regression count and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('security_sec197_peer_diversity_spec.py')
          text=p.read_text(encoding='utf-8')
          old='    assert len(checks) == 14, len(checks)\n    print("SEC-197 peer diversity: 14/14 GREEN")\n'
          new='    assert len(checks) == 15, len(checks)\n    print("SEC-197 peer diversity: 15/15 GREEN")\n'
          if text.count(old) != 1:
              raise SystemExit('SEC-197 count repair anchor mismatch')
          p.write_text(text.replace(old,new),encoding='utf-8',newline='\n')
          manifest_path=Path('release_manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          data=p.read_bytes()
          manifest['files'][p.as_posix()]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          Path('.github/workflows/sec197_fix.yml').unlink()
          manifest_path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          PY
          python3 -m py_compile security_sec197_peer_diversity_spec.py
          git diff --check

      - name: Commit repaired final tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SEC-197: fix regression count pin"
          git push origin HEAD:security-sec197-peer-diversity
