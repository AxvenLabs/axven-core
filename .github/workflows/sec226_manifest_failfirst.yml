name: SEC-226 Fail-First Manifest Refresh

on:
  push:
    branches:
      - security-sec226-interpreter-runtime-attestation

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Bind SEC-226 regression into release manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          name='security_sec226_interpreter_runtime_attestation_spec.py'
          p=Path('release_manifest.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          raw=Path(name).read_bytes()
          m['files'][name]={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          m['files']=dict(sorted(m['files'].items()))
          p.write_text(json.dumps(m,indent=2)+'\n',encoding='utf-8')
          PY
          git diff --check
      - name: Commit manifest update when needed
        shell: bash
        run: |
          if git diff --quiet -- release_manifest.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release_manifest.json
          git commit -m 'SEC-226: bind fail-first regression manifest'
          git push origin HEAD:${GITHUB_REF_NAME}
