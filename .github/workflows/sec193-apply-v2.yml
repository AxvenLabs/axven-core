name: SEC-193 Remote Identity Provenance Apply V2

on:
  push:
    branches:
      - security-sec193-remote-identity-provenance
    paths:
      - .github/workflows/sec193-apply-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security-sec193-remote-identity-provenance
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
      - name: Apply SEC-193 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import textwrap

          def replace_anchor(path, old, new, *, allow_multiple=False):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count < 1 or (not allow_multiple and count != 1):
                  raise AssertionError(
                      f"{path}: invalid patch anchor count {count} for {old!r}"
                  )
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_anchor(
              "p2p.py",
              '''def connect(address,timeout=3.0):
              s=socket.create_connection(address,timeout=timeout)
              s.settimeout(timeout)
              deadline=(None if timeout is None else time.monotonic()+timeout)
              try:
                  handshake(s,deadline=deadline)
              except Exception:
                  try:s.close()
                  except OSError:pass
                  raise
              s.settimeout(timeout)
              return s
          ''',
              '''def connect_with_identity(address,timeout=3.0):
              s=socket.create_connection(address,timeout=timeout)
              s.settimeout(timeout)
              deadline=(None if timeout is None else time.monotonic()+timeout)
              try:
                  peer=handshake(s,deadline=deadline)
                  identity={
                      key:peer[key]
                      for key in (
                          "protocol_version","chain_id","config_fingerprint","genesis_hash"
                      )
                  }
              except Exception:
                  try:s.close()
                  except OSError:pass
                  raise
              s.settimeout(timeout)
              return s,identity

          def connect(address,timeout=3.0):
              s,_identity=connect_with_identity(address,timeout=timeout)
              return s
          ''',
          )

          replace_anchor(
              "tools/peer_probe.py",
              '    sock=p2p.connect((a.host,a.port),timeout=a.timeout)\n',
              '    sock,remote_identity=p2p.connect_with_identity((a.host,a.port),timeout=a.timeout)\n',
          )
          replace_anchor(
              "tools/peer_probe.py",
              '        "identity": p2p.local_identity(),\n',
              '        "identity": remote_identity,\n',
          )

          replace_anchor(
              "tools/public_peer_acceptance.py",
              '    s=p2p.connect((a.host,a.port),timeout=8)\n',
              '    s,remote_identity=p2p.connect_with_identity((a.host,a.port),timeout=8)\n',
              allow_multiple=True,
          )
          replace_anchor(
              "tools/public_peer_acceptance.py",
              '        "canonical_identity":p2p.local_identity()\n',
              '        "canonical_identity":remote_identity\n',
          )

          replace_anchor(
              "tools/seed_health.py",
              '''    sock=p2p.connect((a.host,a.port),timeout=a.timeout)
              try:
                  status=p2p.request(sock,{"type":"get_status"})
              finally:
                  sock.close()
              ident=p2p.local_identity()
          ''',
              '''    sock,ident=p2p.connect_with_identity((a.host,a.port),timeout=a.timeout)
              try:
                  status=p2p.request(sock,{"type":"get_status"})
              finally:
                  sock.close()
          ''',
          )
          replace_anchor(
              "tools/seed_health.py",
              '        "protocol_version": ident.get("protocol_version")==1,\n',
              '        "protocol_version": ident.get("protocol_version")==p2p.PROTOCOL_VERSION,\n',
          )

          spec = '''#!/usr/bin/env python3
          """SEC-193: preserve verified remote P2P identity provenance in operator tools."""
          from __future__ import annotations

          import inspect
          from pathlib import Path

          import axven
          import p2p

          ROOT = Path(__file__).resolve().parent


          class DummySocket:
              def __init__(self):
                  self.timeouts = []
                  self.closed = False

              def settimeout(self, value):
                  self.timeouts.append(value)

              def close(self):
                  self.closed = True


          def main():
              checks = []

              def green(name, condition=True):
                  assert condition, name
                  checks.append(name)
                  print(f"[GREEN] {name}")

              remote_hello = {
                  "type": "hello",
                  "protocol_version": 777,
                  "chain_id": "sentinel-remote-chain",
                  "config_fingerprint": "remote-fingerprint",
                  "genesis_hash": "remote-genesis",
              }
              expected_identity = {
                  key: remote_hello[key]
                  for key in (
                      "protocol_version",
                      "chain_id",
                      "config_fingerprint",
                      "genesis_hash",
                  )
              }
              dummy = DummySocket()
              calls = {}
              original_create = p2p.socket.create_connection
              original_handshake = p2p.handshake

              def fake_create(address, timeout=None):
                  calls["address"] = address
                  calls["timeout"] = timeout
                  return dummy

              def fake_handshake(sock, deadline=None):
                  calls["handshake_sock"] = sock
                  calls["deadline"] = deadline
                  return dict(remote_hello)

              p2p.socket.create_connection = fake_create
              p2p.handshake = fake_handshake
              try:
                  returned_sock, remote_identity = p2p.connect_with_identity(
                      ("203.0.113.7", 18444), timeout=7.0
                  )
              finally:
                  p2p.socket.create_connection = original_create
                  p2p.handshake = original_handshake

              green(
                  "connect_with_identity returns identity from verified peer hello",
                  returned_sock is dummy
                  and remote_identity == expected_identity
                  and "type" not in remote_identity,
              )
              green(
                  "connect_with_identity preserves outbound timeout and deadline semantics",
                  calls.get("address") == ("203.0.113.7", 18444)
                  and calls.get("timeout") == 7.0
                  and calls.get("handshake_sock") is dummy
                  and calls.get("deadline") is not None
                  and dummy.timeouts == [7.0, 7.0],
              )

              original_connect_with_identity = p2p.connect_with_identity
              legacy_dummy = DummySocket()
              legacy_calls = {}

              def fake_connect_with_identity(address, timeout=3.0):
                  legacy_calls["address"] = address
                  legacy_calls["timeout"] = timeout
                  return legacy_dummy, {"chain_id": "remote"}

              p2p.connect_with_identity = fake_connect_with_identity
              try:
                  legacy_result = p2p.connect(("198.51.100.9", 18444), timeout=2.5)
              finally:
                  p2p.connect_with_identity = original_connect_with_identity

              green(
                  "legacy connect API remains socket-only and delegates once",
                  legacy_result is legacy_dummy
                  and legacy_calls == {
                      "address": ("198.51.100.9", 18444),
                      "timeout": 2.5,
                  },
              )

              server = p2p.NodeServer().start()
              live_sock = None
              try:
                  live_sock, live_identity = p2p.connect_with_identity(
                      server.address, timeout=3.0
                  )
                  live_status = p2p.request(live_sock, {"type": "get_status"})
              finally:
                  if live_sock is not None:
                      live_sock.close()
                  server.stop()
              green(
                  "live canonical handshake exposes verified remote identity and usable socket",
                  live_identity == p2p.local_identity()
                  and live_status.get("type") == "status",
              )

              helper_src = "".join(inspect.getsource(p2p.connect_with_identity).split())
              legacy_src = "".join(inspect.getsource(p2p.connect).split())
              green(
                  "core returns handshake-derived identity without rebuilding local identity",
                  "peer=handshake(s,deadline=deadline)" in helper_src
                  and "forkeyin(\"protocol_version\",\"chain_id\",\"config_fingerprint\",\"genesis_hash\")"
                  in helper_src
                  and "local_identity" not in helper_src
                  and "connect_with_identity(address,timeout=timeout)" in legacy_src
                  and "handshake(" not in legacy_src,
              )

              peer_probe_src = (ROOT / "tools" / "peer_probe.py").read_text(encoding="utf-8")
              green(
                  "peer probe reports handshake-derived remote identity",
                  "p2p.connect_with_identity" in peer_probe_src
                  and "p2p.local_identity()" not in peer_probe_src,
              )

              acceptance_src = (ROOT / "tools" / "public_peer_acceptance.py").read_text(
                  encoding="utf-8"
              )
              green(
                  "public peer acceptance reports handshake-derived remote identity",
                  "p2p.connect_with_identity" in acceptance_src
                  and "p2p.local_identity()" not in acceptance_src,
              )

              seed_src = (ROOT / "tools" / "seed_health.py").read_text(encoding="utf-8")
              green(
                  "seed health uses remote identity and current protocol version",
                  "p2p.connect_with_identity" in seed_src
                  and "p2p.local_identity()" not in seed_src
                  and "p2p.PROTOCOL_VERSION" in seed_src,
              )

              green(
                  "SEC-193 leaves chain identity, protocol, and PQ activation semantics unchanged",
                  p2p.PROTOCOL_VERSION == 2
                  and axven.CHAIN_ID == "axven-devnet-2"
                  and axven.CONFIG_FINGERPRINT
                  == "ac56ced3ca38dd449dabc3fc0091a3cc4dce6e05c692dcf836f1e493e7efabae"
                  and axven.CHAIN_CONFIG["pq_hybrid_activation_height"] == 2000
                  and axven.CHAIN_CONFIG["pq_pure_activation_height"] == 5000
                  and axven.Blockchain().tip.hash()
                  == "a49413203b4a00f3c5b3a5901e8cd198b09f41f58295f22c927883f7fe4e1ab3",
              )

              assert len(checks) == 9
              print("SEC-193 remote identity provenance: 9/9 GREEN")


          if __name__ == "__main__":
              main()
          '''
          Path("security_sec193_remote_identity_provenance_spec.py").write_text(
              textwrap.dedent(spec), encoding="utf-8"
          )

          tracked = [
              "p2p.py",
              "tools/peer_probe.py",
              "tools/public_peer_acceptance.py",
              "tools/seed_health.py",
              "security_sec193_remote_identity_provenance_spec.py",
          ]
          manifest_path = Path("release_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for rel in tracked:
              raw = Path(rel).read_bytes()
              manifest["files"][rel] = {
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Install pinned project dependencies
        shell: bash
        run: |
          python -m pip install "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0" "packaging==26.3"
          python -m pip install -e ".[legacy-mldsa-recovery]"
          python -m pip check
      - name: Verify targeted SEC-193 contract
        shell: bash
        run: |
          python -m py_compile p2p.py tools/peer_probe.py tools/public_peer_acceptance.py tools/seed_health.py security_sec193_remote_identity_provenance_spec.py
          python security_sec193_remote_identity_provenance_spec.py
      - name: Commit SEC-193 patch
        shell: bash
        run: |
          git config user.name "Axven Security Bot"
          git config user.email "security-bot@users.noreply.github.com"
          git add p2p.py tools/peer_probe.py tools/public_peer_acceptance.py tools/seed_health.py security_sec193_remote_identity_provenance_spec.py release_manifest.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No SEC-193 changes to commit"
            exit 0
          fi
          git commit -m "SEC-193: preserve verified remote identity provenance"
          git push origin HEAD:security-sec193-remote-identity-provenance
