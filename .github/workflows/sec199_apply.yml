name: SEC-199 Apply

on:
  push:
    branches:
      - security-sec199-resolved-peer-provenance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.15"

      - name: Install Axven validation closure
        shell: pwsh
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-toolchain.lock
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-windows.lock
          python -m pip install --no-build-isolation --no-deps -e ".[legacy-mldsa-recovery]"
          python -m pip check

      - name: Apply and validate SEC-199
        shell: pwsh
        run: |
          python sec199_apply.py
          python security_sec199_resolved_peer_provenance_spec.py
          python security_sec121_outbound_sync_work_budget_spec.py
          python security_sec193_remote_identity_provenance_spec.py

      - name: Refresh release manifest and commit
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          from pathlib import Path

          targets = [
              "core.py",
              "p2p.py",
              "security_sec199_resolved_peer_provenance_spec.py",
          ]
          path=Path("release_manifest.json")
          manifest=json.loads(path.read_text(encoding="utf-8"))
          for name in targets:
              data=Path(name).read_bytes()
              manifest["files"][name]={
                  "bytes":len(data),
                  "sha256":hashlib.sha256(data).hexdigest(),
              }
          path.write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          '@ | Set-Content -Path sec199_manifest.py -Encoding utf8
          python sec199_manifest.py
          Remove-Item sec199_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core.py p2p.py security_sec199_resolved_peer_provenance_spec.py release_manifest.json
          git diff --cached --check
          git commit -m "SEC-199: bind outbound sync to resolved peer IP"
          git push
