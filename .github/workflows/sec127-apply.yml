name: SEC-127 Apply

on:
  push:
    branches:
      - security-sec127-rpc-json-preparse-depth

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install -e .

      - name: Apply SEC-127 patch and manifest pins
        run: python .github/sec127_apply.py

      - name: Remove one-shot automation before validation
        run: git rm .github/sec127_apply.py .github/workflows/sec127-apply.yml

      - name: Focused validation
        run: |
          python security_sec127_rpc_json_preparse_depth_spec.py
          python core_rpc_test.py
          python release_packaging_test.py

      - name: Commit clean SEC-127 tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add rpc.py release_manifest.json security_sec127_rpc_json_preparse_depth_spec.py
          git diff --cached --check
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git commit -m "SEC-127: Bound RPC JSON pre-parse nesting"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
