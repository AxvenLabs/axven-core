name: Axven Native Reproducible Build

on:
  push:
    paths:
      - "native/**"
      - "RUST_013.md"
      - "rust_013_reproducible_wheel_spec.py"
      - "rust_013_reproducible_build_policy_spec.py"
      - "RUST_014.md"
      - "rust_014_reproducible_attestation.py"
      - "rust_014_reproducible_attestation_policy_spec.py"
      - "RUST_015.md"
      - "rust_015_offline_repro_consumer_verify.py"
      - "rust_015_offline_repro_consumer_policy_spec.py"
      - "RUST_016.md"
      - "rust_016_source_closure_spec.py"
      - "rust_016_hermetic_source_closure_policy_spec.py"
      - "rust_009_portable_linux_wheel_spec.py"
      - "requirements-native-build.lock"
      - "requirements-ci-runtime-posix.lock"
      - ".github/workflows/native-reproducible-build.yml"
  pull_request:
    paths:
      - "native/**"
      - "RUST_013.md"
      - "rust_013_reproducible_wheel_spec.py"
      - "rust_013_reproducible_build_policy_spec.py"
      - "RUST_014.md"
      - "rust_014_reproducible_attestation.py"
      - "rust_014_reproducible_attestation_policy_spec.py"
      - "RUST_015.md"
      - "rust_015_offline_repro_consumer_verify.py"
      - "rust_015_offline_repro_consumer_policy_spec.py"
      - "RUST_016.md"
      - "rust_016_source_closure_spec.py"
      - "rust_016_hermetic_source_closure_policy_spec.py"
      - "rust_009_portable_linux_wheel_spec.py"
      - "requirements-native-build.lock"
      - "requirements-ci-runtime-posix.lock"
      - ".github/workflows/native-reproducible-build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:443eabd378e140996780a772e12c1a1ef10551da933fe76d74a1bab61f68a7b7

jobs:
  reproducible-portable-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AXVEN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install hash-locked Axven runtime dependencies
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock

      - name: Install exact host Rust toolchain for controlled mounts
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          python -c "import platform; assert platform.python_version() == '3.13.15', platform.python_version()"
          rustc --version | grep -F "rustc 1.98.0 "
          cargo --version | grep -F "cargo 1.98.0 "

      - name: RUST-013 static reproducible build policy
        run: python rust_013_reproducible_build_policy_spec.py

      - name: RUST-014 static reproducibility attestation policy
        run: python rust_014_reproducible_attestation_policy_spec.py

      - name: RUST-015 static detached reproducibility consumer policy
        run: python rust_015_offline_repro_consumer_policy_spec.py

      - name: RUST-016 static hermetic source-closure policy
        run: python rust_016_hermetic_source_closure_policy_spec.py

      - name: Derive source-bound reproducibility epoch
        id: epoch
        shell: bash
        run: |
          set -euo pipefail
          checkout="$(git rev-parse HEAD)"
          test "$checkout" = "$AXVEN_SOURCE_SHA"
          source_epoch="$(git show -s --format=%ct "$AXVEN_SOURCE_SHA")"
          case "$source_epoch" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          test "$source_epoch" -ge 315532800
          printf 'epoch=%s\n' "$source_epoch" >> "$GITHUB_OUTPUT"
          printf 'RUST-013 SOURCE_DATE_EPOCH=%s source=%s\n' "$source_epoch" "$AXVEN_SOURCE_SHA"

      - name: Stage exact RUST-016 native source closure
        shell: bash
        run: |
          set -euo pipefail
          closure=/tmp/axven-rust016-source
          rm -rf "$closure"
          mkdir -p "$closure/src"
          install -m 0444 native/axven_native/Cargo.toml "$closure/Cargo.toml"
          install -m 0444 native/axven_native/Cargo.lock "$closure/Cargo.lock"
          install -m 0444 native/axven_native/src/lib.rs "$closure/src/lib.rs"
          test ! -e "$closure/.git"
          test "$(find "$closure" -type f | wc -l)" -eq 3
          test "$(find "$closure" -type l | wc -l)" -eq 0
          python rust_016_source_closure_spec.py "$closure"

      - name: Pull and verify immutable manylinux image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$MANYLINUX_IMAGE"
          resolved="$(docker image inspect "$MANYLINUX_IMAGE" --format '{{index .RepoDigests 0}}')"
          test "$resolved" = "$MANYLINUX_IMAGE"
          printf 'RUST-013 pinned image: %s\n' "$resolved"

      - name: Build reproducibility candidate A in isolated target
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          set -euo pipefail
          rm -rf wheelhouse-repro-a .rust013-target-a .rust013-tools-a
          mkdir -p wheelhouse-repro-a .rust013-tools-a
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_HOME=/cargo \
            -e RUSTUP_HOME=/rustup \
            -e RUSTUP_TOOLCHAIN=1.98.0 \
            -e PYO3_PYTHON=/opt/python/cp313-cp313/bin/python \
            -e SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            -e CARGO_INCREMENTAL=0 \
            -e PYTHONHASHSEED=0 \
            -e TZ=UTC \
            -e LC_ALL=C.UTF-8 \
            -e CARGO_TARGET_DIR=/work/.rust013-target-a \
            -e PATH=/cargo/bin:/opt/python/cp313-cp313/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cargo:/cargo" \
            -v "$HOME/.rustup:/rustup:ro" \
            -w /work \
            "$MANYLINUX_IMAGE" \
            /bin/bash -lc '
              set -euo pipefail
              python -c "import platform; assert platform.python_version() == \"3.13.13\", platform.python_version()"
              rustc --version | grep -F "rustc 1.98.0 "
              cargo --version | grep -F "cargo 1.98.0 "
              test "$SOURCE_DATE_EPOCH" -ge 315532800
              test "$CARGO_INCREMENTAL" = "0"
              test "$PYTHONHASHSEED" = "0"
              test "$TZ" = "UTC"
              python -m pip install --no-deps --only-binary=:all: --require-hashes --target /work/.rust013-tools-a -r /work/requirements-native-build.lock
              export PYTHONPATH=/work/.rust013-tools-a
              export PATH=/work/.rust013-tools-a/bin:$PATH
              test "$(maturin --version)" = "maturin 1.15.0"
              maturin build --release --locked --compatibility manylinux_2_28 --manifest-path /work/native/axven_native/Cargo.toml --interpreter /opt/python/cp313-cp313/bin/python --out /work/wheelhouse-repro-a
              auditwheel show /work/wheelhouse-repro-a/*.whl
            '

      - name: Separate build wall clocks
        run: sleep 2

      - name: Build reproducibility candidate B in isolated target
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          set -euo pipefail
          rm -rf wheelhouse-repro-b .rust013-target-b .rust013-tools-b
          mkdir -p wheelhouse-repro-b .rust013-tools-b
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_HOME=/cargo \
            -e RUSTUP_HOME=/rustup \
            -e RUSTUP_TOOLCHAIN=1.98.0 \
            -e PYO3_PYTHON=/opt/python/cp313-cp313/bin/python \
            -e SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            -e CARGO_INCREMENTAL=0 \
            -e PYTHONHASHSEED=0 \
            -e TZ=UTC \
            -e LC_ALL=C.UTF-8 \
            -e CARGO_TARGET_DIR=/work/.rust013-target-b \
            -e PATH=/cargo/bin:/opt/python/cp313-cp313/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cargo:/cargo" \
            -v "$HOME/.rustup:/rustup:ro" \
            -w /work \
            "$MANYLINUX_IMAGE" \
            /bin/bash -lc '
              set -euo pipefail
              python -c "import platform; assert platform.python_version() == \"3.13.13\", platform.python_version()"
              rustc --version | grep -F "rustc 1.98.0 "
              cargo --version | grep -F "cargo 1.98.0 "
              test "$SOURCE_DATE_EPOCH" -ge 315532800
              test "$CARGO_INCREMENTAL" = "0"
              test "$PYTHONHASHSEED" = "0"
              test "$TZ" = "UTC"
              python -m pip install --no-deps --only-binary=:all: --require-hashes --target /work/.rust013-tools-b -r /work/requirements-native-build.lock
              export PYTHONPATH=/work/.rust013-tools-b
              export PATH=/work/.rust013-tools-b/bin:$PATH
              test "$(maturin --version)" = "maturin 1.15.0"
              maturin build --release --locked --compatibility manylinux_2_28 --manifest-path /work/native/axven_native/Cargo.toml --interpreter /opt/python/cp313-cp313/bin/python --out /work/wheelhouse-repro-b
              auditwheel show /work/wheelhouse-repro-b/*.whl
            '

      - name: Prove wheel byte reproducibility
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          set -euo pipefail
          sha256sum wheelhouse-repro-a/*.whl wheelhouse-repro-b/*.whl
          python rust_013_reproducible_wheel_spec.py wheelhouse-repro-a wheelhouse-repro-b "$SOURCE_DATE_EPOCH"

      - name: Recheck RUST-009 contract for build A
        run: |
          set -euo pipefail
          rm -rf wheelhouse-portable
          mkdir wheelhouse-portable
          cp -- wheelhouse-repro-a/*.whl wheelhouse-portable/
          python rust_009_portable_linux_wheel_spec.py

      - name: Recheck RUST-009 contract for build B
        run: |
          set -euo pipefail
          rm -rf wheelhouse-portable
          mkdir wheelhouse-portable
          cp -- wheelhouse-repro-b/*.whl wheelhouse-portable/
          python rust_009_portable_linux_wheel_spec.py

      - name: Generate RUST-014 reproducibility-bound provenance
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          set -euo pipefail
          rm -f reproducible-provenance.json reproducible-attestation.json
          python rust_014_reproducible_attestation.py generate reproducible-provenance.json

      - name: Seal RUST-014 TEST-ONLY reproducibility attestation
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          set -euo pipefail
          python rust_014_reproducible_attestation.py seal reproducible-provenance.json reproducible-attestation.json

      - name: Verify RUST-014 reproducibility attestation
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          set -euo pipefail
          python rust_014_reproducible_attestation.py verify reproducible-provenance.json reproducible-attestation.json

      - name: RUST-014 fail-closed mutation contract
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          set -euo pipefail
          python rust_014_reproducible_attestation.py selftest reproducible-provenance.json reproducible-attestation.json

      - name: Reverify original RUST-014 evidence
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          set -euo pipefail
          python rust_014_reproducible_attestation.py verify reproducible-provenance.json reproducible-attestation.json

      - name: Prepare detached RUST-015 reproducibility bundle
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust015-consumer
          rm -rf "$consumer"
          mkdir -p "$consumer/build-a" "$consumer/build-b"
          cp rust_015_offline_repro_consumer_verify.py "$consumer/"
          cp wheelhouse-repro-a/*.whl "$consumer/build-a/"
          cp wheelhouse-repro-b/*.whl "$consumer/build-b/"
          cp reproducible-provenance.json "$consumer/"
          cp reproducible-attestation.json "$consumer/"
          test ! -e "$consumer/.git"
          test "$(find "$consumer" -type f | wc -l)" -eq 5
          test "$(find "$consumer" -type l | wc -l)" -eq 0
          test "$(find "$consumer/build-a" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find "$consumer/build-b" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1

      - name: Verify detached RUST-015 reproducibility bundle
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust015-consumer
          cd "$consumer"
          wheel_a="$(find build-a -maxdepth 1 -type f -name '*.whl' -print)"
          wheel_b="$(find build-b -maxdepth 1 -type f -name '*.whl' -print)"
          test -n "$wheel_a"
          test -n "$wheel_b"
          env -i \
            HOME=/tmp \
            PATH="$PATH" \
            PYTHONUTF8=1 \
            PYTHONIOENCODING=utf-8 \
            python rust_015_offline_repro_consumer_verify.py verify \
              "$wheel_a" "$wheel_b" reproducible-provenance.json reproducible-attestation.json

      - name: RUST-015 detached fail-closed mutation contract
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust015-consumer
          cd "$consumer"
          wheel_a="$(find build-a -maxdepth 1 -type f -name '*.whl' -print)"
          wheel_b="$(find build-b -maxdepth 1 -type f -name '*.whl' -print)"
          env -i \
            HOME=/tmp \
            PATH="$PATH" \
            PYTHONUTF8=1 \
            PYTHONIOENCODING=utf-8 \
            python rust_015_offline_repro_consumer_verify.py selftest \
              "$wheel_a" "$wheel_b" reproducible-provenance.json reproducible-attestation.json

      - name: Reverify detached RUST-015 evidence
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust015-consumer
          cd "$consumer"
          wheel_a="$(find build-a -maxdepth 1 -type f -name '*.whl' -print)"
          wheel_b="$(find build-b -maxdepth 1 -type f -name '*.whl' -print)"
          env -i \
            HOME=/tmp \
            PATH="$PATH" \
            PYTHONUTF8=1 \
            PYTHONIOENCODING=utf-8 \
            python rust_015_offline_repro_consumer_verify.py verify \
              "$wheel_a" "$wheel_b" reproducible-provenance.json reproducible-attestation.json

      - name: Build RUST-016 repository-blind source closure
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          set -euo pipefail
          closure=/tmp/axven-rust016-source
          python rust_016_source_closure_spec.py "$closure"
          rm -rf wheelhouse-closure .rust016-target .rust016-tools
          mkdir -p wheelhouse-closure .rust016-target .rust016-tools
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_HOME=/cargo \
            -e RUSTUP_HOME=/rustup \
            -e RUSTUP_TOOLCHAIN=1.98.0 \
            -e PYO3_PYTHON=/opt/python/cp313-cp313/bin/python \
            -e SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            -e CARGO_INCREMENTAL=0 \
            -e PYTHONHASHSEED=0 \
            -e TZ=UTC \
            -e LC_ALL=C.UTF-8 \
            -e CARGO_TARGET_DIR=/target \
            -e PATH=/cargo/bin:/opt/python/cp313-cp313/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "$closure:/src:ro" \
            -v "$GITHUB_WORKSPACE/requirements-native-build.lock:/requirements-native-build.lock:ro" \
            -v "$GITHUB_WORKSPACE/wheelhouse-closure:/out" \
            -v "$GITHUB_WORKSPACE/.rust016-target:/target" \
            -v "$GITHUB_WORKSPACE/.rust016-tools:/tools" \
            -v "$HOME/.cargo:/cargo" \
            -v "$HOME/.rustup:/rustup:ro" \
            "$MANYLINUX_IMAGE" \
            /bin/bash -lc '
              set -euo pipefail
              python -c "import platform; assert platform.python_version() == \"3.13.13\", platform.python_version()"
              rustc --version | grep -F "rustc 1.98.0 "
              cargo --version | grep -F "cargo 1.98.0 "
              test "$SOURCE_DATE_EPOCH" -ge 315532800
              test "$CARGO_INCREMENTAL" = "0"
              test "$PYTHONHASHSEED" = "0"
              test "$TZ" = "UTC"
              test "$LC_ALL" = "C.UTF-8"
              test -r /src/Cargo.toml
              test -r /src/Cargo.lock
              test -r /src/src/lib.rs
              test ! -w /src/Cargo.toml
              test ! -w /src/Cargo.lock
              test ! -w /src/src/lib.rs
              python -m pip install --no-deps --only-binary=:all: --require-hashes --target /tools -r /requirements-native-build.lock
              export PYTHONPATH=/tools
              export PATH=/tools/bin:$PATH
              test "$(maturin --version)" = "maturin 1.15.0"
              maturin build --release --locked --compatibility manylinux_2_28 --manifest-path /src/Cargo.toml --interpreter /opt/python/cp313-cp313/bin/python --out /out
              auditwheel show /out/*.whl
            '

      - name: Prove RUST-016 closure wheel equals ordinary reproducible build
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          set -euo pipefail
          closure=/tmp/axven-rust016-source
          python rust_016_source_closure_spec.py "$closure"
          sha256sum wheelhouse-repro-a/*.whl wheelhouse-closure/*.whl
          python rust_013_reproducible_wheel_spec.py wheelhouse-repro-a wheelhouse-closure "$SOURCE_DATE_EPOCH"
          rm -rf wheelhouse-portable
          mkdir wheelhouse-portable
          cp -- wheelhouse-closure/*.whl wheelhouse-portable/
          python rust_009_portable_linux_wheel_spec.py
