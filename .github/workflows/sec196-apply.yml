name: SEC-196 Apply

on:
  push:
    branches:
      - security-sec196-timewarp-difficulty-bound
    paths:
      - .github/workflows/sec196-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Install pinned Axven toolchain
        shell: bash
        run: |
          python -m pip install "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0" "packaging==26.3"
          python -m pip install -e ".[legacy-mldsa-recovery]"
          python -m pip check
      - name: Apply SEC-196 timestamp bound and protocol gate
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "axven.py",
              "MEDIAN_TIME_SPAN = 11\nGENESIS_TIME = 0\n",
              "MEDIAN_TIME_SPAN = 11\nGENESIS_TIME = 0\n"
              "# Axven targets two-second blocks and retargets every ~67 minutes, so\n"
              "# Bitcoin's multi-hour future-time tolerance would itself permit a\n"
              "# material epoch-end difficulty skew.  Allow two minutes for ordinary\n"
              "# clock drift, but never admit farther-future timestamps into retarget\n"
              "# history.  SEC-196 is network-gated by P2P protocol v3.\n"
              "MAX_FUTURE_BLOCK_TIME = 120\n",
          )

          replace_once(
              "axven.py",
              "    if block.timestamp <= median_time_past(path, height): return f\"Timestamp <= MTP at {height}\"\n"
              "    if not block.transactions: return f\"No coinbase at {height}\"\n",
              "    if block.timestamp <= median_time_past(path, height): return f\"Timestamp <= MTP at {height}\"\n"
              "    if block.timestamp > int(time.time()) + MAX_FUTURE_BLOCK_TIME:\n"
              "        return f\"Timestamp too far in future at {height}\"\n"
              "    if not block.transactions: return f\"No coinbase at {height}\"\n",
          )

          replace_once(
              "p2p.py",
              "PROTOCOL_VERSION = 2\n",
              "# v3 gates the SEC-196 future-timestamp consensus admission rule.\n"
              "# Refuse v2 peers so mixed validity rules cannot silently fork devnet.\n"
              "PROTOCOL_VERSION = 3\n",
          )

          sec62 = Path("security_sec062_protocol_v2_compat_spec.py")
          text = sec62.read_text(encoding="utf-8")
          replacements = (
              ('"""SEC-062 protocol-v2 compatibility boundary contract."""',
               '"""SEC-062 network compatibility boundary; advanced to v3 by SEC-196."""'),
              ("EXPECTED_PROTOCOL_VERSION = 2", "EXPECTED_PROTOCOL_VERSION = 3"),
              ('print("[GREEN] protocol version pinned to v2")',
               'print("[GREEN] protocol version pinned to v3")'),
              ('print("[GREEN] local identity advertises protocol v2")',
               'print("[GREEN] local identity advertises protocol v3")'),
              ('print("[GREEN] v2 peer accepted")',
               'print("[GREEN] v3 peer accepted")'),
              ('old["protocol_version"] = 1', 'old["protocol_version"] = 2'),
              ('"legacy protocol v1 peer rejected",',
               '"legacy protocol v2 peer rejected",'),
              ('future["protocol_version"] = 3', 'future["protocol_version"] = 4'),
              ('"unknown protocol v3 peer rejected",',
               '"unknown protocol v4 peer rejected",'),
              ('f"SEC-062 protocol-v2 compatibility boundary: "',
               'f"SEC-062 protocol-v3 compatibility boundary: "'),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"SEC-062 anchor {old!r}: found {count}")
              text = text.replace(old, new, 1)
          sec62.write_text(text, encoding="utf-8", newline="\n")

          subprocess.run([
              "python", "-m", "py_compile",
              "axven.py", "p2p.py",
              "security_sec062_protocol_v2_compat_spec.py",
              "security_sec196_timewarp_difficulty_spec.py",
          ], check=True)
          subprocess.run(["python", "security_sec062_protocol_v2_compat_spec.py"], check=True)
          subprocess.run(["python", "security_sec196_timewarp_difficulty_spec.py"], check=True)

          manifest_path = Path("release_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for name in (
              "axven.py",
              "p2p.py",
              "security_sec062_protocol_v2_compat_spec.py",
              "security_sec196_timewarp_difficulty_spec.py",
          ):
              raw = Path(name).read_bytes()
              manifest["files"][name] = {
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8", newline="\n",
          )

          subprocess.run(["git", "config", "user.name", "AxvenLabs"], check=True)
          subprocess.run(["git", "config", "user.email", "dogacan432@gmail.com"], check=True)
          subprocess.run([
              "git", "add", "axven.py", "p2p.py",
              "security_sec062_protocol_v2_compat_spec.py",
              "security_sec196_timewarp_difficulty_spec.py",
              "release_manifest.json",
          ], check=True)
          subprocess.run([
              "git", "commit", "-m",
              "SEC-196: bound future timestamps and gate protocol v3",
          ], check=True)
          subprocess.run([
              "git", "push", "origin",
              "HEAD:security-sec196-timewarp-difficulty-bound",
          ], check=True)
