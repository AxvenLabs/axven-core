name: SEC-191 Wallet KDF Apply V2

on:
  push:
    branches:
      - security-sec191-wallet-kdf-strength
    paths:
      - .github/workflows/sec191-apply-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Apply SEC-191 robustly and refresh manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new)

          wallet_path = Path("wallet.py")
          text = wallet_path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "_SCRYPT_N = 1 << 14\n",
              "_SCRYPT_LEGACY_N = 1 << 14\n_SCRYPT_N = 1 << 17\n",
              "scrypt N",
          )
          text = replace_once(
              text,
              '_SCRYPT_DKLEN = 32\n_SCRYPT_PARAMS = {"n": _SCRYPT_N, "r": _SCRYPT_R, "p": _SCRYPT_P, "dklen": _SCRYPT_DKLEN}\n',
              '_SCRYPT_DKLEN = 32\n_SCRYPT_MAXMEM = 256 * 1024 * 1024\n_SCRYPT_PARAMS = {"n": _SCRYPT_N, "r": _SCRYPT_R, "p": _SCRYPT_P, "dklen": _SCRYPT_DKLEN}\n_SCRYPT_LEGACY_PARAMS = {"n": _SCRYPT_LEGACY_N, "r": _SCRYPT_R, "p": _SCRYPT_P, "dklen": _SCRYPT_DKLEN}\n',
              "scrypt profile constants",
          )

          start = "def _validated_scrypt_params(value):\n"
          end = "def _validated_backup_envelope(backup, passphrase):\n"
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit("scrypt validator boundary is not unique")
          i = text.index(start)
          j = text.index(end, i)
          validator = '''def _validated_scrypt_params(value):
              if type(value) is not dict or set(value) != set(_SCRYPT_PARAMS):
                  raise BackupError("unsupported scrypt parameters")
              for name in _SCRYPT_PARAMS:
                  if type(value[name]) is not int:
                      raise BackupError("unsupported scrypt parameters")
              if value == _SCRYPT_PARAMS:
                  return dict(_SCRYPT_PARAMS)
              if value == _SCRYPT_LEGACY_PARAMS:
                  return dict(_SCRYPT_LEGACY_PARAMS)
              raise BackupError("unsupported scrypt parameters")

          '''
          text = text[:i] + validator + text[j:]
          text = replace_once(
              text,
              "dklen=_SCRYPT_DKLEN)\n",
              "dklen=_SCRYPT_DKLEN,\n                         maxmem=_SCRYPT_MAXMEM)\n",
              "export scrypt maxmem",
          )
          text = replace_once(
              text,
              'dklen=kp["dklen"])\n',
              'dklen=kp["dklen"],\n                             maxmem=_SCRYPT_MAXMEM)\n',
              "restore scrypt maxmem",
          )
          wallet_path.write_text(text, encoding="utf-8", newline="\n")

          old_helper = Path(".github/workflows/sec191-apply.yml").read_text(encoding="utf-8")

          def extract(marker, end_marker):
              start_at = old_helper.index(marker) + len(marker)
              end_at = old_helper.index(end_marker, start_at)
              raw = old_helper[start_at:end_at]
              lines = raw.splitlines()
              if not lines:
                  raise SystemExit(f"empty embedded source: {marker}")
              cleaned = [lines[0]]
              for line in lines[1:]:
                  cleaned.append(line[10:] if line.startswith("          ") else line)
              return "\n".join(cleaned).rstrip() + "\n"

          sec077 = extract(
              "          sec077 = r'''",
              "\n          '''\n          # Remove YAML indentation from the embedded source.",
          )
          sec191 = extract(
              "          sec191 = r'''",
              "\n          '''\n          Path(\"security_sec191_wallet_kdf_strength_spec.py\")",
          )
          Path("security_sec077_wallet_kdf_resource_bounds_spec.py").write_text(
              sec077, encoding="utf-8", newline="\n")
          Path("security_sec191_wallet_kdf_strength_spec.py").write_text(
              sec191, encoding="utf-8", newline="\n")

          manifest_path = Path("release_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          names = [
              "wallet.py",
              "security_sec077_wallet_kdf_resource_bounds_spec.py",
              "security_sec191_wallet_kdf_strength_spec.py",
          ]
          for name in names:
              data = Path(name).read_bytes()
              manifest["files"][name] = {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          git diff --check
          python -m py_compile wallet.py security_sec077_wallet_kdf_resource_bounds_spec.py security_sec191_wallet_kdf_strength_spec.py
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add wallet.py security_sec077_wallet_kdf_resource_bounds_spec.py security_sec191_wallet_kdf_strength_spec.py release_manifest.json
          git diff --cached --quiet && { echo "SEC-191 patch produced no changes"; exit 1; }
          git commit -m "SEC-191: strengthen wallet backup scrypt profile"
          git push origin HEAD:security-sec191-wallet-kdf-strength
