name: Axven Native Upstream-Authenticated Detached Rebuild

on:
  push:
    paths:
      - "native/axven_native/**"
      - "requirements-native-build.lock"
      - "requirements-ci-runtime-posix.lock"
      - "rust_009_portable_linux_wheel_spec.py"
      - "rust_013_reproducible_wheel_spec.py"
      - "rust_013_reproducible_build_policy_spec.py"
      - "rust_014_reproducible_attestation.py"
      - "rust_014_reproducible_attestation_policy_spec.py"
      - "rust_015_offline_repro_consumer_verify.py"
      - "rust_016_offline_build_input_verify.py"
      - "rust_017_offline_git_tree_verify.py"
      - "rust_017_offline_git_tree_policy_spec.py"
      - "rust_018_detached_rebuild_verify.py"
      - "rust_018_detached_rebuild_policy_spec.py"
      - "rust_019_offline_dependency_closure.py"
      - "rust_020_verified_vendor.py"
      - "rust_021_verified_dependency_rebuild_spec.py"
      - "rust_023_rust_toolchain_closure.py"
      - "rust_024_upstream_rust_distribution.py"
      - "RUST_025.md"
      - "rust_025_upstream_authenticated_detached_build.sh"
      - "rust_025_upstream_authenticated_detached_build_policy_spec.py"
      - ".github/workflows/native-reproducible-build.yml"
      - ".github/workflows/native-upstream-authenticated-detached-rebuild.yml"
  pull_request:
    paths:
      - "native/axven_native/**"
      - "requirements-native-build.lock"
      - "requirements-ci-runtime-posix.lock"
      - "rust_009_portable_linux_wheel_spec.py"
      - "rust_013_reproducible_wheel_spec.py"
      - "rust_013_reproducible_build_policy_spec.py"
      - "rust_014_reproducible_attestation.py"
      - "rust_014_reproducible_attestation_policy_spec.py"
      - "rust_015_offline_repro_consumer_verify.py"
      - "rust_016_offline_build_input_verify.py"
      - "rust_017_offline_git_tree_verify.py"
      - "rust_017_offline_git_tree_policy_spec.py"
      - "rust_018_detached_rebuild_verify.py"
      - "rust_018_detached_rebuild_policy_spec.py"
      - "rust_019_offline_dependency_closure.py"
      - "rust_020_verified_vendor.py"
      - "rust_021_verified_dependency_rebuild_spec.py"
      - "rust_023_rust_toolchain_closure.py"
      - "rust_024_upstream_rust_distribution.py"
      - "RUST_025.md"
      - "rust_025_upstream_authenticated_detached_build.sh"
      - "rust_025_upstream_authenticated_detached_build_policy_spec.py"
      - ".github/workflows/native-reproducible-build.yml"
      - ".github/workflows/native-upstream-authenticated-detached-rebuild.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:443eabd378e140996780a772e12c1a1ef10551da933fe76d74a1bab61f68a7b7
  RUST_URL: https://static.rust-lang.org/dist/2026-08-20/rust-1.98.0-x86_64-unknown-linux-gnu.tar.xz
  RUST_SHA256: ed8ee2df70909c88cbaf87a6cfa3920dac00b537de12a6abe6906641e0f5952f
  RUST_ARCHIVE_NAME: rust-1.98.0-x86_64-unknown-linux-gnu.tar.xz
  RUST_ARCHIVE_ROOT: rust-1.98.0-x86_64-unknown-linux-gnu
  TOOLCHAIN_NAME: 1.98.0-x86_64-unknown-linux-gnu
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  upstream-authenticated-detached-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      AXVEN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install hash-locked Axven runtime dependencies
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock

      - name: Install exact host Rust toolchain for dependency collection only
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          rustc --version | grep -F "rustc 1.98.0 "
          cargo --version | grep -F "cargo 1.98.0 "

      - name: RUST-025 static upstream-authenticated detached build policy
        run: python rust_025_upstream_authenticated_detached_build_policy_spec.py

      - name: Reapply supporting static policies
        run: |
          python rust_013_reproducible_build_policy_spec.py
          python rust_014_reproducible_attestation_policy_spec.py
          python rust_017_offline_git_tree_policy_spec.py
          python rust_018_detached_rebuild_policy_spec.py
          python rust_024_upstream_rust_distribution_policy_spec.py

      - name: RUST-024 archive verifier mutation contract
        run: python rust_024_upstream_rust_distribution.py selftest

      - name: Derive source-bound reproducibility epoch
        id: epoch
        shell: bash
        run: |
          set -euo pipefail
          checkout="$(git rev-parse HEAD)"
          test "$checkout" = "$AXVEN_SOURCE_SHA"
          source_epoch="$(git show -s --format=%ct "$AXVEN_SOURCE_SHA")"
          case "$source_epoch" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          test "$source_epoch" -ge 315532800
          printf 'epoch=%s\n' "$source_epoch" >> "$GITHUB_OUTPUT"
          printf 'RUST-025 SOURCE_DATE_EPOCH=%s source=%s\n' "$source_epoch" "$AXVEN_SOURCE_SHA"

      - name: Execute RUST-025 integration proof
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: bash rust_025_upstream_authenticated_detached_build.sh
