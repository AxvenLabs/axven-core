name: Axven Native Smoke

on:
  push:
    paths:
      - "native/**"
      - "RUST_001.md"
      - "RUST_002.md"
      - "rust_001_native_boundary_spec.py"
      - "rust_002_smt_differential_spec.py"
      - ".github/workflows/native-smoke.yml"
  pull_request:
    paths:
      - "native/**"
      - "RUST_001.md"
      - "RUST_002.md"
      - "rust_001_native_boundary_spec.py"
      - "rust_002_smt_differential_spec.py"
      - ".github/workflows/native-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYO3_PYTHON: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install hash-locked Axven runtime dependencies
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.98.0
          python --version
          rustc --version
          cargo --version

      - name: Rust formatting
        run: cargo fmt --manifest-path native/axven_native/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path native/axven_native/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --locked --manifest-path native/axven_native/Cargo.toml

      - name: PyO3 extension compile check
        run: cargo check --locked --manifest-path native/axven_native/Cargo.toml --features extension-module

      - name: RUST-001 boundary contract
        run: python rust_001_native_boundary_spec.py

      - name: Build test-only PyO3 extension
        run: |
          cargo build --locked --manifest-path native/axven_native/Cargo.toml --features extension-module
          cp native/axven_native/target/debug/libaxven_native.so ./axven_native.so
          python -c "import axven_native; print(axven_native.boundary_version())"

      - name: RUST-002 SMT differential contract
        run: python rust_002_smt_differential_spec.py
