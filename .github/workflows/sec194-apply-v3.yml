name: SEC-194 Apply V3

on:
  push:
    branches:
      - security-sec194-outbound-status-validation
    paths:
      - .github/workflows/sec194-apply-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Apply SEC-194 and refresh manifest
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, subprocess, textwrap

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding="utf-8")
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old,new,1),encoding="utf-8",newline="\n")

          p2p=Path("p2p.py")
          text=p2p.read_text(encoding="utf-8")

          handshake_anchor='''def handshake(sock: socket.socket,deadline=None) -> Dict[str, Any]:
              send_message(sock,hello_message())
              peer=recv_message(
                  sock,
                  deadline=deadline,
                  max_bytes=MAX_HANDSHAKE_MESSAGE_BYTES,
              )
              validate_handshake(peer)
              return peer

          class PeerSession:'''
          validator_block='''def handshake(sock: socket.socket,deadline=None) -> Dict[str, Any]:
              send_message(sock,hello_message())
              peer=recv_message(
                  sock,
                  deadline=deadline,
                  max_bytes=MAX_HANDSHAKE_MESSAGE_BYTES,
              )
              validate_handshake(peer)
              return peer

          def validate_status_message(msg: Dict[str, Any]) -> Dict[str, Any]:
              if not isinstance(msg,dict):
                  raise ProtocolError("status must be object")
              expected_fields={"type","height","tip_hash","chainwork"}
              if set(msg) != expected_fields:
                  raise ProtocolError("invalid status message fields")
              if msg.get("type") != "status":
                  raise ProtocolError("invalid status message type")
              raw_height=msg.get("height")
              if type(raw_height) is not int or raw_height < 0:
                  raise ProtocolError("invalid status height")
              raw_tip_hash=msg.get("tip_hash")
              if (
                  not isinstance(raw_tip_hash,str)
                  or len(raw_tip_hash) != 64
                  or any(c not in "0123456789abcdef" for c in raw_tip_hash)
              ):
                  raise ProtocolError("invalid status tip hash")
              raw_chainwork=msg.get("chainwork")
              if type(raw_chainwork) is not int or raw_chainwork < 0:
                  raise ProtocolError("invalid status chainwork")
              return msg

          class PeerSession:'''
          if text.count(handshake_anchor) != 1:
              raise SystemExit(f"p2p.py handshake anchor count={text.count(handshake_anchor)}")
          text=text.replace(handshake_anchor,validator_block,1)

          start_marker='        if typ=="status":\n'
          end_marker='        if typ=="get_status":\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit(
                  f"p2p.py status boundary counts={text.count(start_marker)},{text.count(end_marker)}"
              )
          start=text.index(start_marker)
          end=text.index(end_marker,start)
          text=(
              text[:start]
              + '        if typ=="status":\n            validate_status_message(msg)\n            return None\n'
              + text[end:]
          )

          request_anchor='''def request(sock,msg,deadline=None):
              send_message(sock,msg)
              if deadline is None:
                  deadline=time.monotonic()+OUTBOUND_MESSAGE_DEADLINE
              original_timeout=sock.gettimeout()
              try:
                  return recv_message(sock,deadline=deadline)
              finally:
                  try:sock.settimeout(original_timeout)
                  except OSError:pass

          def sync_to_peer('''
          request_block='''def request(sock,msg,deadline=None):
              send_message(sock,msg)
              if deadline is None:
                  deadline=time.monotonic()+OUTBOUND_MESSAGE_DEADLINE
              original_timeout=sock.gettimeout()
              try:
                  return recv_message(sock,deadline=deadline)
              finally:
                  try:sock.settimeout(original_timeout)
                  except OSError:pass

          def request_status(sock,deadline=None):
              status=request(sock,{"type":"get_status"},deadline=deadline)
              return validate_status_message(status)

          def sync_to_peer('''
          if text.count(request_anchor) != 1:
              raise SystemExit(f"p2p.py request anchor count={text.count(request_anchor)}")
          text=text.replace(request_anchor,request_block,1)
          p2p.write_text(text,encoding="utf-8",newline="\n")

          replace_once(
              "tools/peer_probe.py",
              'status=p2p.request(sock,{"type":"get_status"})',
              'status=p2p.request_status(sock)',
          )
          replace_once(
              "tools/public_peer_acceptance.py",
              'reply=p2p.request(s,{"type":"get_status"})',
              'reply=p2p.request_status(s)',
          )
          replace_once(
              "tools/seed_health.py",
              'status=p2p.request(sock,{"type":"get_status"})',
              'status=p2p.request_status(sock)',
          )

          spec=textwrap.dedent('''\
          #!/usr/bin/env python3
          """SEC-194: canonical outbound P2P status validation."""
          from __future__ import annotations

          from pathlib import Path
          import axven
          import p2p

          def rejected(msg):
              try:
                  p2p.validate_status_message(msg)
              except p2p.ProtocolError:
                  return True
              return False

          def main():
              checks=[]
              def green(name,condition=True):
                  assert condition,name
                  checks.append(name)
                  print(f"[GREEN] {name}")

              session=p2p.PeerSession(axven.Blockchain())
              canonical=session.status()
              green(
                  "shared status validator accepts canonical status",
                  p2p.validate_status_message(canonical) is canonical
                  and session.handle(dict(canonical)) is None,
              )

              malformed=[]
              extra=dict(canonical); extra["extra"]=0; malformed.append(extra)
              for missing in ("height","tip_hash","chainwork"):
                  bad=dict(canonical); bad.pop(missing); malformed.append(bad)
              wrong_type=dict(canonical); wrong_type["type"]="accepted"; malformed.append(wrong_type)
              green(
                  "status envelope and type fail closed",
                  rejected(None) and all(rejected(item) for item in malformed),
              )
              green(
                  "status height uses exact non-negative integer domain",
                  all(rejected({**canonical,"height":v}) for v in (True,-1,"0",0.0,None)),
              )
              green(
                  "status chainwork uses exact non-negative integer domain",
                  all(rejected({**canonical,"chainwork":v}) for v in (True,-1,"1",1.0,None)),
              )
              green(
                  "status tip hash remains canonical lowercase hex",
                  all(
                      rejected({**canonical,"tip_hash":v})
                      for v in (None,0,"0"*63,"0"*65,"g"*64,"A"*64)
                  ),
              )

              original_request=p2p.request
              calls=[]
              marker=object()
              def fake_request(sock,msg,deadline=None):
                  calls.append((sock,msg,deadline))
                  return dict(canonical)
              p2p.request=fake_request
              try:
                  result=p2p.request_status(marker,deadline=123.0)
              finally:
                  p2p.request=original_request
              green(
                  "outbound status helper sends exact get_status and validates reply",
                  result==canonical and calls==[(marker,{"type":"get_status"},123.0)],
              )

              p2p.request=lambda *args,**kwargs:{**canonical,"height":True}
              try:
                  outbound_bad=False
                  try:p2p.request_status(marker)
                  except p2p.ProtocolError:outbound_bad=True
              finally:
                  p2p.request=original_request
              green("outbound status helper rejects malformed remote reply",outbound_bad)

              peer_probe=Path("tools/peer_probe.py").read_text(encoding="utf-8")
              acceptance=Path("tools/public_peer_acceptance.py").read_text(encoding="utf-8")
              seed_health=Path("tools/seed_health.py").read_text(encoding="utf-8")
              green(
                  "operator probes use shared outbound status validator",
                  "status=p2p.request_status(sock)" in peer_probe
                  and "reply=p2p.request_status(s)" in acceptance
                  and "status=p2p.request_status(sock)" in seed_health
                  and 'p2p.request(sock,{"type":"get_status"})' not in peer_probe
                  and 'p2p.request(s,{"type":"get_status"})' not in acceptance
                  and 'p2p.request(sock,{"type":"get_status"})' not in seed_health,
              )

              source=Path(p2p.__file__).read_text(encoding="utf-8")
              green(
                  "inbound SEC-113 and outbound status share one validator",
                  'def validate_status_message(' in source
                  and 'if typ=="status":\n            validate_status_message(msg)' in source
                  and 'def request_status(' in source,
              )
              green(
                  "SEC-194 leaves chain identity and PQ activation semantics unchanged",
                  axven.CHAIN_ID=="axven-devnet-2"
                  and axven.CONFIG_FINGERPRINT
                  =="ac56ced3ca38dd449dabc3fc0091a3cc4dce6e05c692dcf836f1e493e7efabae"
                  and axven.CHAIN_CONFIG["pq_hybrid_activation_height"]==2000
                  and axven.CHAIN_CONFIG["pq_pure_activation_height"]==5000
                  and axven.Blockchain().tip.hash()
                  =="a49413203b4a00f3c5b3a5901e8cd198b09f41f58295f22c927883f7fe4e1ab3",
              )
              assert len(checks)==10
              print("SEC-194 outbound status validation: 10/10 GREEN")

          if __name__=="__main__":main()
          ''')
          Path("security_sec194_outbound_status_validation_spec.py").write_text(
              spec,encoding="utf-8",newline="\n"
          )

          subprocess.run(
              ["python","-m","py_compile","p2p.py","security_sec194_outbound_status_validation_spec.py"],
              check=True,
          )
          subprocess.run(["python","security_sec194_outbound_status_validation_spec.py"],check=True)

          manifest_path=Path("release_manifest.json")
          manifest=json.loads(manifest_path.read_text(encoding="utf-8"))
          for name in (
              "p2p.py","tools/peer_probe.py","tools/public_peer_acceptance.py",
              "tools/seed_health.py","security_sec194_outbound_status_validation_spec.py",
          ):
              raw=Path(name).read_bytes()
              manifest["files"][name]={
                  "bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),
              }
          manifest_path.write_text(
              json.dumps(manifest,indent=2,sort_keys=True)+"\n",
              encoding="utf-8",newline="\n"
          )

          subprocess.run(["git","config","user.name","AxvenLabs"],check=True)
          subprocess.run(["git","config","user.email","dogacan432@gmail.com"],check=True)
          subprocess.run([
              "git","add","p2p.py","tools/peer_probe.py","tools/public_peer_acceptance.py",
              "tools/seed_health.py","security_sec194_outbound_status_validation_spec.py",
              "release_manifest.json",
          ],check=True)
          subprocess.run(["git","commit","-m","SEC-194: validate outbound status replies canonically"],check=True)
          subprocess.run(["git","push","origin","HEAD:security-sec194-outbound-status-validation"],check=True)
