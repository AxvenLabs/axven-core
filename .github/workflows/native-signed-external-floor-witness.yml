name: Axven Native Signed External Floor Witness

on:
  push:
    paths:
      - "requirements-ci-runtime-posix.lock"
      - "rust_030_stdlib_material_verify.py"
      - "rust_031_stdlib_trust_state_material_verify.py"
      - "rust_032_external_monotonic_floor_verify.py"
      - "rust_032_external_monotonic_floor_policy_spec.py"
      - "RUST_033.md"
      - "rust_033_external_floor_witness_verify.py"
      - "rust_033_external_floor_witness_policy_spec.py"
      - ".github/workflows/native-signed-external-floor-witness.yml"
  pull_request:
    paths:
      - "requirements-ci-runtime-posix.lock"
      - "rust_030_stdlib_material_verify.py"
      - "rust_031_stdlib_trust_state_material_verify.py"
      - "rust_032_external_monotonic_floor_verify.py"
      - "rust_032_external_monotonic_floor_policy_spec.py"
      - "RUST_033.md"
      - "rust_033_external_floor_witness_verify.py"
      - "rust_033_external_floor_witness_policy_spec.py"
      - ".github/workflows/native-signed-external-floor-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  signed-external-floor-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AXVEN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install hash-locked producer dependency
        run: python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock

      - name: RUST-033 static signed-floor policy
        run: |
          python rust_032_external_monotonic_floor_policy_spec.py
          python rust_033_external_floor_witness_policy_spec.py

      - name: Generate canonical RUST-032 floor and TEST-ONLY signed witness
        shell: bash
        run: |
          set -euo pipefail
          fixture=/tmp/axven-rust033-fixture
          floor=/tmp/axven-rust033-external-floor.json
          witness=/tmp/axven-rust033-floor-witness.json
          rm -rf "$fixture" "$floor" "$witness"
          mkdir -p "$fixture"
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path

          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          import rust_030_stdlib_material_verify as material_verify
          import rust_031_stdlib_trust_state_material_verify as trust_verify
          import rust_033_external_floor_witness_verify as witness_verify

          source_sha = os.environ["AXVEN_SOURCE_SHA"]
          if len(source_sha) != 40 or any(ch not in "0123456789abcdef" for ch in source_sha):
              raise AssertionError("invalid RUST-033 source SHA")

          genesis = {
              "schema": trust_verify.STATE_SCHEMA,
              "sequence": 0,
              "scope": trust_verify.MATERIAL_PAYLOAD_TYPE,
              "key_id": trust_verify.OLD_KEY_ID,
              "public_key": trust_verify.OLD_PUBLIC_KEY.hex(),
              "activation_source_commit": None,
              "predecessor_sha256": None,
              "transition_sha256": None,
              "production": False,
          }
          transition = {
              "schema": trust_verify.TRANSITION_SCHEMA,
              "sequence": 1,
              "scope": trust_verify.MATERIAL_PAYLOAD_TYPE,
              "from_key_id": trust_verify.OLD_KEY_ID,
              "from_public_key": trust_verify.OLD_PUBLIC_KEY.hex(),
              "to_key_id": trust_verify.NEW_KEY_ID,
              "to_public_key": trust_verify.NEW_PUBLIC_KEY.hex(),
              "activation_source_commit": source_sha,
              "production": False,
          }
          genesis_raw = material_verify.canonical(genesis)
          transition_raw = material_verify.canonical(transition)
          final_state = {
              "schema": trust_verify.STATE_SCHEMA,
              "sequence": 1,
              "scope": trust_verify.MATERIAL_PAYLOAD_TYPE,
              "key_id": trust_verify.NEW_KEY_ID,
              "public_key": trust_verify.NEW_PUBLIC_KEY.hex(),
              "activation_source_commit": source_sha,
              "predecessor_sha256": hashlib.sha256(genesis_raw).hexdigest(),
              "transition_sha256": hashlib.sha256(transition_raw).hexdigest(),
              "production": False,
          }
          final_raw = material_verify.canonical(final_state)
          trust_verify.validate_genesis(genesis_raw, genesis)
          trust_verify.validate_final_state(final_raw, final_state, genesis_raw, transition_raw, source_sha)

          floor_record = {
              "schema": "axven-native-external-monotonic-floor-v1",
              "provider": "test-only-monotonic-floor-simulator",
              "sequence": 1,
              "scope": trust_verify.MATERIAL_PAYLOAD_TYPE,
              "key_id": final_state["key_id"],
              "public_key": final_state["public_key"],
              "activation_source_commit": source_sha,
              "state_sha256": hashlib.sha256(final_raw).hexdigest(),
              "production": False,
          }
          floor_raw = material_verify.canonical(floor_record)

          TEST_ONLY_WITNESS_SEED = bytes.fromhex(
              "0bcea6c25bf2e920391237f68a9ff4d36f3e8800521f93016ed2b4a10c81a09f"
          )
          private = Ed25519PrivateKey.from_private_bytes(TEST_ONLY_WITNESS_SEED)
          derived_public = private.public_key().public_bytes(
              encoding=serialization.Encoding.Raw,
              format=serialization.PublicFormat.Raw,
          )
          if derived_public != witness_verify.WITNESS_PUBLIC_KEY:
              raise AssertionError("RUST-033 TEST-ONLY witness public-key pin mismatch")

          envelope = {
              "schema": witness_verify.WITNESS_ENVELOPE_SCHEMA,
              "algorithm": witness_verify.ALGORITHM,
              "key_id": witness_verify.WITNESS_KEY_ID,
              "payload_type": witness_verify.WITNESS_PAYLOAD_TYPE,
              "payload_sha256": hashlib.sha256(floor_raw).hexdigest(),
              "signature": base64.b64encode(
                  private.sign(witness_verify.signed_message(floor_raw))
              ).decode("ascii"),
          }

          Path("/tmp/axven-rust033-fixture/final-state.json").write_bytes(final_raw)
          Path("/tmp/axven-rust033-external-floor.json").write_bytes(floor_raw)
          Path("/tmp/axven-rust033-floor-witness.json").write_bytes(material_verify.canonical(envelope))
          PY
          test -f "$fixture/final-state.json"
          test -f "$floor"
          test -f "$witness"
          chmod 0444 "$floor" "$witness"
          test "$(stat -c '%a' "$floor")" = "444"
          test "$(stat -c '%a' "$witness")" = "444"

      - name: Stage detached RUST-033 consumer without external evidence
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust033-consumer
          rm -rf "$consumer"
          mkdir -p "$consumer"
          cp rust_030_stdlib_material_verify.py "$consumer/"
          cp rust_031_stdlib_trust_state_material_verify.py "$consumer/"
          cp rust_032_external_monotonic_floor_verify.py "$consumer/"
          cp rust_033_external_floor_witness_verify.py "$consumer/"
          cp /tmp/axven-rust033-fixture/final-state.json "$consumer/"
          test "$(find "$consumer" -maxdepth 1 -type f | wc -l)" -eq 5
          test "$(find "$consumer" -type l | wc -l)" -eq 0
          test ! -e "$consumer/.git"
          test ! -e "$consumer/external-floor.json"
          test ! -e "$consumer/floor-witness.json"

      - name: Verify detached RUST-033 consumer against signed external floor
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust033-consumer
          floor=/tmp/axven-rust033-external-floor.json
          witness=/tmp/axven-rust033-floor-witness.json
          cd "$consumer"
          env -i \
            HOME=/tmp \
            PATH=/usr/bin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONNOUSERSITE=1 \
            /usr/bin/python3 -S rust_033_external_floor_witness_verify.py verify \
              final-state.json "$floor" "$witness" "$AXVEN_SOURCE_SHA" 1

      - name: RUST-033 signed-floor fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust033-consumer
          floor=/tmp/axven-rust033-external-floor.json
          witness=/tmp/axven-rust033-floor-witness.json
          cd "$consumer"
          env -i \
            HOME=/tmp \
            PATH=/usr/bin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONNOUSERSITE=1 \
            /usr/bin/python3 -S rust_033_external_floor_witness_verify.py selftest \
              final-state.json "$floor" "$witness" "$AXVEN_SOURCE_SHA" 1

      - name: Reverify pristine signed external floor
        shell: bash
        run: |
          set -euo pipefail
          consumer=/tmp/axven-rust033-consumer
          floor=/tmp/axven-rust033-external-floor.json
          witness=/tmp/axven-rust033-floor-witness.json
          test "$(stat -c '%a' "$floor")" = "444"
          test "$(stat -c '%a' "$witness")" = "444"
          test ! -e "$consumer/external-floor.json"
          test ! -e "$consumer/floor-witness.json"
          cd "$consumer"
          env -i \
            HOME=/tmp \
            PATH=/usr/bin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONNOUSERSITE=1 \
            /usr/bin/python3 -S rust_033_external_floor_witness_verify.py verify \
              final-state.json "$floor" "$witness" "$AXVEN_SOURCE_SHA" 1
