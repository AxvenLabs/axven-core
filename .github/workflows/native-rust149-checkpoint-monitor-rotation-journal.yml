name: Axven Native RUST-149 Checkpoint Monitor Rotation Journal

on:
  push:
    paths:
      - "requirements-ci-runtime-posix.lock"
      - "rust_*.py"
      - "RUST_*.md"
      - ".github/workflows/native-rust148-multistep-rust146-checkpoint-monitor-rotation.yml"
      - ".github/workflows/native-rust149-checkpoint-monitor-rotation-journal.yml"
  pull_request:
    paths:
      - "requirements-ci-runtime-posix.lock"
      - "rust_*.py"
      - "RUST_*.md"
      - ".github/workflows/native-rust148-multistep-rust146-checkpoint-monitor-rotation.yml"
      - ".github/workflows/native-rust149-checkpoint-monitor-rotation-journal.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  rust149:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AXVEN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Install hash-locked producer dependency
        run: python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock
      - name: RUST-149 static monitor rotation journal policy
        run: |
          python rust_148_multistep_rust146_checkpoint_monitor_rotation_policy_spec.py
          python rust_149_rust146_checkpoint_monitor_rotation_journal_policy_spec.py
      - name: Generate reviewed continuity and monitor rotation journal evidence
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 36 149); do
            printf -v n3 "%03d" "$n"
            files=(rust_${n3}_*_fixture.py)
            test "${#files[@]}" -eq 1
            test -e "${files[0]}"
            python "${files[0]}" "$AXVEN_SOURCE_SHA"
          done
      - name: Make continuity evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 36 149); do
            printf -v n3 "%03d" "$n"
            files=(/tmp/axven-rust${n3}-*.json)
            test -e "${files[0]}"
            chmod 0444 "${files[@]}"
          done
          for f in /tmp/axven-rust149-*.json; do test "$(stat -c '%a' "$f")" = "444"; done
      - name: Stage detached RUST-149 consumer
        shell: bash
        run: |
          set -euo pipefail
          c=/tmp/axven-rust149-consumer
          rm -rf "$c"
          mkdir -p "$c"
          for n in $(seq 30 149); do
            printf -v n3 "%03d" "$n"
            files=(rust_${n3}_*_verify.py)
            test "${#files[@]}" -eq 1
            test -e "${files[0]}"
            cp "${files[0]}" "$c/"
          done
          cp rust_149_rust146_checkpoint_monitor_rotation_journal_selftest.py "$c/"
          cp /tmp/axven-rust036-final-state.json "$c/final-state.json"
          test "$(find "$c" -maxdepth 1 -type f | wc -l)" -eq 122
          test "$(find "$c" -type l | wc -l)" -eq 0
          test ! -e "$c/.git"
          test ! -e "$c/rust_149_rust146_checkpoint_monitor_rotation_journal_fixture.py"
      - name: Inherit fixed predecessor manifest and append RUST-149 paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          predecessor = Path('.github/workflows/native-rust148-multistep-rust146-checkpoint-monitor-rotation.yml').read_text(encoding='utf-8')
          marker = '      - name: Inherit fixed predecessor manifest and append RUST-148 paths\n'
          next_marker = '      - name: Verify detached RUST-148 rotation and fail-closed contract\n'
          if predecessor.count(marker) != 1 or next_marker not in predecessor:
              raise SystemExit('unexpected RUST-148 manifest markers')
          segment = predecessor.split(marker, 1)[1].split(next_marker, 1)[0]
          py_start = "          python - <<'PY'\n"
          py_end = "\n          PY\n"
          if segment.count(py_start) != 1 or py_end not in segment:
              raise SystemExit('unexpected RUST-148 manifest generator markers')
          script = segment.split(py_start, 1)[1].split(py_end, 1)[0]
          lines = script.splitlines()
          if not lines or any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('unexpected RUST-148 generator indentation')
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          exec(compile(script, '<rust148-manifest-generator>', 'exec'), {'__name__': '__main__'})
          inherited = Path('/tmp/axven-rust148-paths')
          if not inherited.is_file():
              raise SystemExit('RUST-148 manifest generator did not produce a manifest')
          rows = inherited.read_text(encoding='utf-8').splitlines()
          if len(rows) != 316:
              raise SystemExit(f'expected 316 RUST-148 paths, got {len(rows)}')
          if rows[-1] != '/tmp/axven-rust148-final-monitor-bundle.json':
              raise SystemExit('unexpected RUST-148 manifest boundary')
          rows.extend([
              '/tmp/axven-rust149-prefix-monitor-rotation-journal.json',
              '/tmp/axven-rust149-prefix-monitor-rotation-checkpoint.json',
              '/tmp/axven-rust149-final-monitor-rotation-journal.json',
              '/tmp/axven-rust149-final-monitor-rotation-checkpoint.json',
          ])
          if len(rows) != 320:
              raise SystemExit(f'expected 320 RUST-149 paths, got {len(rows)}')
          Path('/tmp/axven-rust149-paths').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
          test "$(wc -l < /tmp/axven-rust149-paths)" -eq 320
          chmod 0444 /tmp/axven-rust149-paths
      - name: Verify detached RUST-149 journal and fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/axven-rust149-consumer
          mapfile -t paths < /tmp/axven-rust149-paths
          test "${#paths[@]}" -eq 320
          py=(env -i HOME=/tmp PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 /usr/bin/python3 -S)
          "${py[@]}" rust_149_rust146_checkpoint_monitor_rotation_journal_verify.py verify "${paths[@]}" "$AXVEN_SOURCE_SHA" 1
          "${py[@]}" rust_149_rust146_checkpoint_monitor_rotation_journal_selftest.py "${paths[@]}" /tmp/axven-rust149-observed-fork-monitor-rotation-checkpoint.json "$AXVEN_SOURCE_SHA" 1
          test "$(stat -c '%a' /tmp/axven-rust149-paths)" = "444"
          for f in /tmp/axven-rust149-*.json; do test "$(stat -c '%a' "$f")" = "444"; done
          "${py[@]}" rust_149_rust146_checkpoint_monitor_rotation_journal_verify.py verify "${paths[@]}" "$AXVEN_SOURCE_SHA" 1
