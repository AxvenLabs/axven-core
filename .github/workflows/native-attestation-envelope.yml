name: Axven Native Attestation Envelope

on:
  push:
    paths:
      - "native/**"
      - "RUST_007.md"
      - "RUST_008.md"
      - "RUST_010.md"
      - "rust_007_native_wheel_package_spec.py"
      - "rust_008_native_provenance.py"
      - "rust_010_native_attestation.py"
      - "rust_010_native_attestation_policy_spec.py"
      - "requirements-native-build.lock"
      - "requirements-ci-runtime-posix.lock"
      - ".github/workflows/native-attestation-envelope.yml"
  pull_request:
    paths:
      - "native/**"
      - "RUST_007.md"
      - "RUST_008.md"
      - "RUST_010.md"
      - "rust_007_native_wheel_package_spec.py"
      - "rust_008_native_provenance.py"
      - "rust_010_native_attestation.py"
      - "rust_010_native_attestation_policy_spec.py"
      - "requirements-native-build.lock"
      - "requirements-ci-runtime-posix.lock"
      - ".github/workflows/native-attestation-envelope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-attestation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYO3_PYTHON: python
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      AXVEN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install hash-locked build and runtime dependencies
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-native-build.lock
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          python --version
          rustc --version
          cargo --version
          python -m maturin --version

      - name: RUST-010 static attestation policy
        run: python rust_010_native_attestation_policy_spec.py

      - name: Build unpublished locked native wheel
        run: python -m maturin build --release --locked --manifest-path native/axven_native/Cargo.toml --interpreter python --out wheelhouse

      - name: Recheck RUST-007 wheel integrity
        run: python rust_007_native_wheel_package_spec.py

      - name: Generate canonical RUST-008 provenance candidate
        run: python rust_008_native_provenance.py generate native-provenance.json

      - name: Reverify RUST-008 provenance before sealing
        run: python rust_008_native_provenance.py verify native-provenance.json

      - name: Seal test-only offline attestation envelope
        run: python rust_010_native_attestation.py seal native-provenance.json native-attestation.json

      - name: Verify test-only offline attestation envelope
        run: python rust_010_native_attestation.py verify native-provenance.json native-attestation.json

      - name: Exercise fail-closed mutation contract
        run: python rust_010_native_attestation.py selftest native-provenance.json native-attestation.json

      - name: Reverify provenance after attestation tests
        run: python rust_008_native_provenance.py verify native-provenance.json
