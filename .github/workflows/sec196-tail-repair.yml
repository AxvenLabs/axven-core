name: SEC-196 Tail Repair

on:
  push:
    branches:
      - security-sec196-timewarp-difficulty-bound
    paths:
      - .github/workflows/sec196-tail-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install pinned Axven toolchain
        shell: bash
        run: |
          python -m pip install "pip==26.2.1" "setuptools==84.0.0" "wheel==0.48.0" "packaging==26.3"
          python -m pip install -e ".[legacy-mldsa-recovery]"
          python -m pip check
      - name: Align SEC-193 with protocol v3 and refresh manifest
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          path = Path("security_sec193_remote_identity_provenance_spec.py")
          text = path.read_text(encoding="utf-8")
          old = "        p2p.PROTOCOL_VERSION == 2\n"
          new = "        p2p.PROTOCOL_VERSION == 3\n"
          if text.count(old) != 1:
              raise SystemExit(f"SEC-193 protocol anchor count: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          for script in (
              "security_sec193_remote_identity_provenance_spec.py",
              "security_sec194_outbound_status_validation_spec.py",
              "security_sec195_manual_sync_work_budget_spec.py",
              "security_sec196_timewarp_difficulty_spec.py",
          ):
              subprocess.run(["python", script], check=True)

          manifest_path = Path("release_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          raw = path.read_bytes()
          manifest["files"][path.name] = {
              "bytes": len(raw),
              "sha256": hashlib.sha256(raw).hexdigest(),
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8", newline="\n",
          )

          subprocess.run(["git", "config", "user.name", "AxvenLabs"], check=True)
          subprocess.run(["git", "config", "user.email", "dogacan432@gmail.com"], check=True)
          subprocess.run([
              "git", "add",
              "security_sec193_remote_identity_provenance_spec.py",
              "release_manifest.json",
          ], check=True)
          subprocess.run([
              "git", "commit", "-m",
              "SEC-196: align SEC-193 with protocol v3 gate",
          ], check=True)
          subprocess.run([
              "git", "push", "origin",
              "HEAD:security-sec196-timewarp-difficulty-bound",
          ], check=True)
