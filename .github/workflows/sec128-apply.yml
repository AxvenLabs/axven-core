name: SEC-128 Apply

on:
  push:
    branches:
      - security-sec128-rpc-json-preparse-complexity

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install -e .

      - name: Repair one-shot applicator anchors
        run: python .github/sec128_anchor_fix.py

      - name: Apply SEC-128 patch and manifest pins
        run: python .github/sec128_apply.py

      - name: Remove one-shot automation before validation
        run: git rm -f .github/sec128_anchor_fix.py .github/sec128_apply.py .github/workflows/sec128-apply.yml

      - name: Focused validation
        run: |
          python security_sec041_rpc_param_complexity_bounds_spec.py
          python security_sec127_rpc_json_preparse_depth_spec.py
          python security_sec128_rpc_json_preparse_complexity_spec.py
          python core_rpc_test.py
          python release_packaging_test.py

      - name: Commit clean SEC-128 tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add rpc.py release_manifest.json security_sec128_rpc_json_preparse_complexity_spec.py
          git diff --cached --check
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git commit -m "SEC-128: Bound RPC JSON pre-parse complexity"
          git push "https://x-access-token:${env:GH_TOKEN}@github.com/${env:GITHUB_REPOSITORY}.git" "HEAD:${env:GITHUB_REF_NAME}"
