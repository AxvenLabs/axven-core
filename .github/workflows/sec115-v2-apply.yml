name: SEC-115 V2 Apply

on:
  push:
    branches:
      - security-sec115-p2p-handshake-frame-budget

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security-sec115-p2p-handshake-frame-budget
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply and validate corrected SEC-115
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/sec115_apply.py
          python .github/sec115_v2_fix.py
          python security_sec015_p2p_inbound_timeout_spec.py
          python security_sec088_p2p_absolute_recv_deadline_spec.py
          python security_sec089_p2p_outbound_recv_deadline_spec.py
          python security_sec098_p2p_hello_fields_spec.py
          python security_sec115_p2p_handshake_frame_budget_spec.py
          python p2p_tcp_lifecycle_test.py
          python release_packaging_test.py
      - name: Commit clean SEC-115 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item .github/sec115_apply.py
          Remove-Item .github/sec115_v2_fix.py
          Remove-Item .github/workflows/sec115-apply.yml
          Remove-Item .github/workflows/sec115-v2-apply.yml
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SEC-115: Bound pre-handshake P2P frames"
          git push origin HEAD:security-sec115-p2p-handshake-frame-budget
