name: SEC-213 paged CLI apply

on:
  push:
    branches:
      - security-sec213-wallet-utxo-response-bounds

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Add bounded paged CLI, refresh manifest, remove helper
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          def replace_once(path, old, new):
              text = Path(path).read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one replacement, got {text.count(old)}')
              Path(path).write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace_once(
              'axven_cli.py',
              '''    u=sp.add_parser("list-unspent"); u.add_argument("scheme")\n    m=sp.add_parser("mine"); m.add_argument("count",type=int,nargs="?",default=1); m.add_argument("--scheme")\n''',
              '''    u=sp.add_parser("list-unspent"); u.add_argument("scheme")\n    up=sp.add_parser("list-unspent-page"); up.add_argument("scheme"); up.add_argument("--offset",type=int,default=0); up.add_argument("--limit",type=int,default=100)\n    m=sp.add_parser("mine"); m.add_argument("count",type=int,nargs="?",default=1); m.add_argument("--scheme")\n''',
          )
          replace_once(
              'axven_cli.py',
              '''      "list-unspent":("list_unspent",{"scheme":getattr(a,"scheme",None)}),\n      "mine":("mine",{"count":getattr(a,"count",1),"scheme":getattr(a,"scheme",None)}),\n''',
              '''      "list-unspent":("list_unspent",{"scheme":getattr(a,"scheme",None)}),\n      "list-unspent-page":("list_unspent_page",{"scheme":getattr(a,"scheme",None),"offset":getattr(a,"offset",0),"limit":getattr(a,"limit",100)}),\n      "mine":("mine",{"count":getattr(a,"count",1),"scheme":getattr(a,"scheme",None)}),\n''',
          )
          replace_once(
              'security_sec213_wallet_utxo_response_bounds_spec.py',
              '''    rpc_source = Path("rpc.py").read_text(encoding="utf-8")\n    assert "MAX_LIST_UNSPENT_RESULTS = 1000" in source\n    assert "list_unspent_page" in source\n    assert '\"list_unspent_page\"' in rpc_source\n''',
              '''    rpc_source = Path("rpc.py").read_text(encoding="utf-8")\n    cli_source = Path("axven_cli.py").read_text(encoding="utf-8")\n    assert "MAX_LIST_UNSPENT_RESULTS = 1000" in source\n    assert "list_unspent_page" in source\n    assert '\"list_unspent_page\"' in rpc_source\n    assert '\"list-unspent-page\"' in cli_source\n    assert '\"list_unspent_page\"' in cli_source\n''',
          )
          replace_once(
              'security_sec213_wallet_utxo_response_bounds_spec.py',
              '''    for name in (\n        "core.py",\n        "rpc.py",\n        "security_sec213_wallet_utxo_response_bounds_spec.py",\n''',
              '''    for name in (\n        "axven_cli.py",\n        "core.py",\n        "rpc.py",\n        "security_sec213_wallet_utxo_response_bounds_spec.py",\n''',
          )

          manifest_path = Path('release_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for name in (
              'axven_cli.py',
              'core.py',
              'rpc.py',
              'security_sec213_wallet_utxo_response_bounds_spec.py',
          ):
              data = Path(name).read_bytes()
              manifest['files'][name] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          manifest['files'] = dict(sorted(manifest['files'].items()))
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sec213_cli_apply.yml
          git add axven_cli.py release_manifest.json security_sec213_wallet_utxo_response_bounds_spec.py
          git diff --cached --check
          git commit -m 'SEC-213: expose bounded UTXO paging in CLI'
          git push
