name: Axven Fuzz Smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - name: Install hash-locked runtime and fuzz engine
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-toolchain.lock
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-fuzz.lock
          python -m pip install --no-build-isolation --no-deps -e ".[legacy-mldsa-recovery]"
          python -m pip check

      - name: Deterministic hostile-input smoke
        run: |
          python fuzz_001_smoke.py

      - name: Coverage-guided parser and ML-DSA wrapper fuzz
        run: |
          python fuzz_targets/fuzz_parser_crypto.py -runs=5000 -max_len=4096 -timeout=5
