name: SEC-226 Apply Interpreter Attestation

on:
  push:
    branches:
      - security-sec226-interpreter-runtime-attestation

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Apply SEC-226 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          def patch(name, old, new):
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'patch anchor missing in {name}: {old[:80]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'patch anchor not unique in {name}: {old[:80]!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          patch('runtime_provenance.py',
              'RECEIPT_SCHEMA = 2\nRECEIPT_NAME = ".axven-runtime-provenance.json"\nMAX_RECEIPT_BYTES = 32 * 1024\n',
              'RECEIPT_SCHEMA = 3\nRECEIPT_NAME = ".axven-runtime-provenance.json"\nPYTHON_DIGEST_NAME = ".axven-python.sha256"\nMAX_RECEIPT_BYTES = 32 * 1024\nMAX_PYTHON_DIGEST_BYTES = 128\nMAX_INTERPRETER_BYTES = 64 * 1024 * 1024\n')

          old='''def build_receipt(root: Path, *, python_version: str, profile: str = "windows") -> dict:\n    if python_version != REQUIRED_PYTHON:\n        raise RuntimeError(f"Python {REQUIRED_PYTHON} is required")\n    inputs: dict[str, dict[str, int | str]] = {}\n    for name in _trust_inputs_for_profile(profile):\n        data = _read_trust_input(root / name, name)\n        inputs[name] = {"bytes": len(data), "sha256": _sha256(data)}\n    return {\n        "schema": RECEIPT_SCHEMA,\n        "python_version": python_version,\n        "inputs": inputs,\n    }\n\n\ndef receipt_path(root: Path = ROOT) -> Path:\n    return root / ".venv" / RECEIPT_NAME\n\n\ndef _assert_expected_interpreter(root: Path = ROOT) -> None:\n    venv = (root / ".venv").resolve()\n    executable = Path(sys.executable).resolve()\n    if executable.parent.parent != venv:\n        raise RuntimeError(f"runtime receipt must be managed by {venv}")\n'''
          new='''def _measure_interpreter(interpreter_path: Path | str) -> dict[str, int | str]:\n    try:\n        resolved = Path(interpreter_path).resolve(strict=True)\n    except (OSError, RuntimeError) as exc:\n        raise RuntimeError("Python interpreter is missing or unresolved") from exc\n    data = _read_regular_bounded(\n        resolved,\n        label="Python interpreter",\n        max_bytes=MAX_INTERPRETER_BYTES,\n        allow_empty=False,\n    )\n    return {"bytes": len(data), "sha256": _sha256(data)}\n\n\ndef build_receipt(\n    root: Path,\n    *,\n    python_version: str,\n    profile: str = "windows",\n    interpreter_path: Path | str | None = None,\n) -> dict:\n    if python_version != REQUIRED_PYTHON:\n        raise RuntimeError(f"Python {REQUIRED_PYTHON} is required")\n    inputs: dict[str, dict[str, int | str]] = {}\n    for name in _trust_inputs_for_profile(profile):\n        data = _read_trust_input(root / name, name)\n        inputs[name] = {"bytes": len(data), "sha256": _sha256(data)}\n    if interpreter_path is None:\n        interpreter_path = Path(sys.executable)\n    return {\n        "schema": RECEIPT_SCHEMA,\n        "python_version": python_version,\n        "python_executable": _measure_interpreter(interpreter_path),\n        "inputs": inputs,\n    }\n\n\ndef receipt_path(root: Path = ROOT) -> Path:\n    return root / ".venv" / RECEIPT_NAME\n\n\ndef python_digest_path(root: Path = ROOT) -> Path:\n    return root / ".venv" / PYTHON_DIGEST_NAME\n\n\ndef _read_python_digest(path: Path) -> str:\n    try:\n        raw = _read_regular_bounded(\n            path,\n            label="Python interpreter digest",\n            max_bytes=MAX_PYTHON_DIGEST_BYTES,\n            allow_empty=False,\n        )\n        value = raw.decode("ascii").strip()\n    except UnicodeError as exc:\n        raise RuntimeError("Python interpreter digest is invalid") from exc\n    if len(value) != 64 or any(ch not in "0123456789abcdef" for ch in value):\n        raise RuntimeError("Python interpreter digest is invalid")\n    return value\n\n\ndef _atomic_write_private(path: Path, payload: bytes) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    tmp = path.with_name(path.name + f".tmp-{os.getpid()}")\n    try:\n        with open(tmp, "xb") as handle:\n            handle.write(payload)\n            handle.flush()\n            os.fsync(handle.fileno())\n        try:\n            os.chmod(tmp, stat.S_IRUSR | stat.S_IWUSR)\n        except OSError:\n            pass\n        os.replace(tmp, path)\n    finally:\n        try:\n            tmp.unlink()\n        except FileNotFoundError:\n            pass\n\n\ndef _assert_expected_interpreter(root: Path = ROOT) -> None:\n    # Preserve the lexical venv path on POSIX: venv/bin/python is normally a\n    # symlink to the base interpreter. Binary identity is measured separately.\n    venv = Path(os.path.abspath(root / ".venv"))\n    executable = Path(os.path.abspath(sys.executable))\n    profile = _runtime_profile()\n    relative = Path("Scripts/python.exe") if profile == "windows" else Path("bin/python")\n    expected = venv / relative\n    if os.path.normcase(str(executable)) != os.path.normcase(str(expected)):\n        raise RuntimeError(f"runtime receipt must be managed by {expected}")\n'''
          patch('runtime_provenance.py',old,new)

          old='''    receipt = build_receipt(root, python_version=platform.python_version(), profile=profile)\n    path = receipt_path(root)\n    path.parent.mkdir(parents=True, exist_ok=True)\n    payload = (json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\\n").encode("utf-8")\n    if len(payload) > MAX_RECEIPT_BYTES:\n        raise RuntimeError("runtime provenance receipt exceeds size budget")\n    tmp = path.with_name(path.name + f".tmp-{os.getpid()}")\n    try:\n        with open(tmp, "xb") as handle:\n            handle.write(payload)\n            handle.flush()\n            os.fsync(handle.fileno())\n        try:\n            os.chmod(tmp, stat.S_IRUSR | stat.S_IWUSR)\n        except OSError:\n            pass\n        os.replace(tmp, path)\n    finally:\n        try:\n            tmp.unlink()\n        except FileNotFoundError:\n            pass\n    print("Axven runtime provenance receipt: STAMPED")\n'''
          new='''    receipt = build_receipt(\n        root,\n        python_version=platform.python_version(),\n        profile=profile,\n        interpreter_path=Path(sys.executable),\n    )\n    path = receipt_path(root)\n    payload = (json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\\n").encode("utf-8")\n    if len(payload) > MAX_RECEIPT_BYTES:\n        raise RuntimeError("runtime provenance receipt exceeds size budget")\n    _atomic_write_private(path, payload)\n    digest = receipt["python_executable"]["sha256"]\n    _atomic_write_private(python_digest_path(root), (digest + "\\n").encode("ascii"))\n    print("Axven runtime provenance receipt: STAMPED")\n'''
          patch('runtime_provenance.py',old,new)

          patch('runtime_provenance.py',
              '    expected = build_receipt(root, python_version=platform.python_version(), profile=profile)\n    if actual != expected:\n',
              '    expected = build_receipt(\n        root,\n        python_version=platform.python_version(),\n        profile=profile,\n        interpreter_path=Path(sys.executable),\n    )\n    published_digest = _read_python_digest(python_digest_path(root))\n    if not hmac.compare_digest(published_digest, expected["python_executable"]["sha256"]):\n        raise RuntimeError("Python interpreter digest is stale or mismatched")\n    if actual != expected:\n')

          # Windows operator preflight: reject interpreter drift before executing it.
          patch('ensure_runtime.ps1',
              '$Python = Join-Path $PSScriptRoot ".venv\\Scripts\\python.exe"\n\nfunction Test-AxvenValidatedRuntime {\n',
              '$Python = Join-Path $PSScriptRoot ".venv\\Scripts\\python.exe"\n$PythonDigest = Join-Path $PSScriptRoot ".venv\\.axven-python.sha256"\n\nfunction Test-AxvenInterpreterDigest {\n    if (-not (Test-Path $Python -PathType Leaf)) { return $false }\n    if (-not (Test-Path $PythonDigest -PathType Leaf)) { return $false }\n    $Expected = (Get-Content -LiteralPath $PythonDigest -Raw).Trim()\n    if ($Expected -notmatch "^[0-9a-f]{64}$") { return $false }\n    $Actual = (Get-FileHash -LiteralPath $Python -Algorithm SHA256).Hash.ToLowerInvariant()\n    return $Actual -eq $Expected\n}\n\nfunction Test-AxvenValidatedRuntime {\n')
          patch('ensure_runtime.ps1',
              '    if (-not (Test-Path $Python -PathType Leaf)) {\n        return $false\n    }\n\n    & $Python runtime_provenance.py check *> $null\n',
              '    if (-not (Test-Path $Python -PathType Leaf)) {\n        return $false\n    }\n    if (-not (Test-AxvenInterpreterDigest)) {\n        return $false\n    }\n\n    & $Python runtime_provenance.py check *> $null\n')
          patch('ensure_runtime.ps1',
              'if (-not (Test-AxvenValidatedRuntime)) {\n    Write-Host "Axven runtime is missing, stale, or unvalidated; running hardened validation..." -ForegroundColor Yellow\n',
              'if ((Test-Path $Python -PathType Leaf) -and -not (Test-AxvenInterpreterDigest)) {\n    throw "Axven runtime interpreter attestation is missing or mismatched; remove .venv and rerun validate_windows.ps1"\n}\n\nif (-not (Test-AxvenValidatedRuntime)) {\n    Write-Host "Axven runtime is missing, stale, or unvalidated; running hardened validation..." -ForegroundColor Yellow\n')

          # POSIX operator preflight: shell computes the hash before venv Python runs.
          patch('ensure_runtime.sh',
              'venv_python=".venv/bin/python"\nif [[ ! -x "$venv_python" ]]; then\n  echo "Axven validated POSIX runtime is missing; run: bash validate_linux_macos.sh" >&2\n  exit 2\nfi\n\n"$venv_python" runtime_provenance.py check\n',
              'venv_python=".venv/bin/python"\ndigest_path=".venv/.axven-python.sha256"\nif [[ ! -x "$venv_python" ]]; then\n  echo "Axven validated POSIX runtime is missing; run: bash validate_linux_macos.sh" >&2\n  exit 2\nfi\nif [[ ! -f "$digest_path" || -L "$digest_path" ]]; then\n  echo "Axven runtime interpreter attestation is missing; remove .venv and rerun: bash validate_linux_macos.sh" >&2\n  exit 2\nfi\nIFS= read -r expected_digest < "$digest_path" || true\nif [[ ! "$expected_digest" =~ ^[0-9a-f]{64}$ ]]; then\n  echo "Axven runtime interpreter attestation is invalid" >&2\n  exit 2\nfi\nif command -v sha256sum >/dev/null 2>&1; then\n  actual_digest="$(sha256sum -- "$venv_python" | awk \'{print $1}\')"\nelif command -v shasum >/dev/null 2>&1; then\n  actual_digest="$(shasum -a 256 -- "$venv_python" | awk \'{print $1}\')"\nelse\n  echo "Axven runtime attestation requires sha256sum or shasum" >&2\n  exit 2\nfi\nif [[ "$actual_digest" != "$expected_digest" ]]; then\n  echo "Axven runtime interpreter attestation mismatch; remove .venv and rerun: bash validate_linux_macos.sh" >&2\n  exit 2\nfi\n\n"$venv_python" runtime_provenance.py check\n')

          # Existing Windows validator may reuse a venv only when its interpreter
          # already matches the previously published shell-readable digest.
          patch('validate_windows.ps1',
              'if (-not (Test-Path ".venv")) {\n    py -3.13 -m venv .venv\n    if ($LASTEXITCODE -ne 0) { throw "virtualenv creation failed" }\n}\n\n$Python = Join-Path $PSScriptRoot ".venv\\Scripts\\python.exe"\n& $Python -c "import platform,sys; raise SystemExit(0 if platform.python_version() == \'$RequiredPython\' else 2)"\n',
              '$CreatedVenv = $false\nif (-not (Test-Path ".venv")) {\n    py -3.13 -m venv .venv\n    if ($LASTEXITCODE -ne 0) { throw "virtualenv creation failed" }\n    $CreatedVenv = $true\n}\n\n$Python = Join-Path $PSScriptRoot ".venv\\Scripts\\python.exe"\n$PythonDigest = Join-Path $PSScriptRoot ".venv\\.axven-python.sha256"\nif (-not $CreatedVenv) {\n    if (-not (Test-Path $Python -PathType Leaf) -or -not (Test-Path $PythonDigest -PathType Leaf)) {\n        throw "existing .venv lacks interpreter attestation; remove it and rerun"\n    }\n    $ExpectedDigest = (Get-Content -LiteralPath $PythonDigest -Raw).Trim()\n    if ($ExpectedDigest -notmatch "^[0-9a-f]{64}$") {\n        throw "existing .venv interpreter attestation is invalid; remove it and rerun"\n    }\n    $ActualDigest = (Get-FileHash -LiteralPath $Python -Algorithm SHA256).Hash.ToLowerInvariant()\n    if ($ActualDigest -ne $ExpectedDigest) {\n        throw "existing .venv interpreter attestation mismatch; remove it and rerun"\n    }\n}\n& $Python -c "import platform,sys; raise SystemExit(0 if platform.python_version() == \'$RequiredPython\' else 2)"\n')

          # Existing POSIX validator gets the same pre-execution rule. A freshly
          # created venv is allowed through once, then stamping publishes digest.
          patch('validate_linux_macos.sh',
              'if [[ ! -d .venv ]]; then\n  python3 -m venv .venv\nfi\n\nvenv_python=".venv/bin/python"\nif [[ ! -x "$venv_python" ]]; then\n  echo "existing .venv has no executable Python; remove it and rerun" >&2\n  exit 2\nfi\n\nvenv_version="$($venv_python -c \'import platform; print(platform.python_version())\')"\n',
              'created_venv=0\nif [[ ! -d .venv ]]; then\n  python3 -m venv .venv\n  created_venv=1\nfi\n\nvenv_python=".venv/bin/python"\ndigest_path=".venv/.axven-python.sha256"\nif [[ ! -x "$venv_python" ]]; then\n  echo "existing .venv has no executable Python; remove it and rerun" >&2\n  exit 2\nfi\nif [[ "$created_venv" -eq 0 ]]; then\n  if [[ ! -f "$digest_path" || -L "$digest_path" ]]; then\n    echo "existing .venv lacks interpreter attestation; remove it and rerun" >&2\n    exit 2\n  fi\n  IFS= read -r expected_digest < "$digest_path" || true\n  if [[ ! "$expected_digest" =~ ^[0-9a-f]{64}$ ]]; then\n    echo "existing .venv interpreter attestation is invalid; remove it and rerun" >&2\n    exit 2\n  fi\n  if command -v sha256sum >/dev/null 2>&1; then\n    actual_digest="$(sha256sum -- "$venv_python" | awk \'{print $1}\')"\n  elif command -v shasum >/dev/null 2>&1; then\n    actual_digest="$(shasum -a 256 -- "$venv_python" | awk \'{print $1}\')"\n  else\n    echo "Axven validation requires sha256sum or shasum" >&2\n    exit 2\n  fi\n  if [[ "$actual_digest" != "$expected_digest" ]]; then\n    echo "existing .venv interpreter attestation mismatch; remove it and rerun" >&2\n    exit 2\n  fi\nfi\n\nvenv_version="$($venv_python -c \'import platform; print(platform.python_version())\')"\n')

          # Update prior contracts for the intentional receipt schema extension.
          patch('security_sec213_windows_launcher_runtime_provenance_spec.py',
              'assert runtime_provenance.RECEIPT_SCHEMA == 2',
              'assert runtime_provenance.RECEIPT_SCHEMA == 3')
          patch('security_sec218_posix_runtime_provenance_spec.py',
              'assert set(win) == {"schema", "python_version", "inputs"}',
              'assert set(win) == {"schema", "python_version", "python_executable", "inputs"}')
          patch('security_sec218_posix_runtime_provenance_spec.py',
              'print("[GREEN] Windows receipt format and trust boundary remain unchanged")',
              'print("[GREEN] Windows receipt preserves trust inputs and adds interpreter measurement")')

          # Refresh every changed release payload, including the fail-first contract.
          manifest_path=Path('release_manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          changed=(
              'runtime_provenance.py',
              'ensure_runtime.ps1',
              'ensure_runtime.sh',
              'validate_windows.ps1',
              'validate_linux_macos.sh',
              'security_sec213_windows_launcher_runtime_provenance_spec.py',
              'security_sec218_posix_runtime_provenance_spec.py',
              'security_sec226_interpreter_runtime_attestation_spec.py',
          )
          for name in changed:
              raw=Path(name).read_bytes()
              manifest['files'][name]={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          manifest['files']=dict(sorted(manifest['files'].items()))
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          PY
          git diff --check
          git status --short
      - name: Commit SEC-226 implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime_provenance.py ensure_runtime.ps1 ensure_runtime.sh validate_windows.ps1 validate_linux_macos.sh security_sec213_windows_launcher_runtime_provenance_spec.py security_sec218_posix_runtime_provenance_spec.py release_manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'SEC-226: bind provenance to interpreter binary' 
          git push origin HEAD:${GITHUB_REF_NAME}
