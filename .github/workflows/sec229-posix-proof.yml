name: SEC-229 POSIX proof

on:
  push:
    branches:
      - security-sec229-posix-runtime-write-permissions

permissions:
  contents: read

jobs:
  posix:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Contain hosted toolcache interpreter permissions
        shell: bash
        run: |
          interpreter="$(python3 -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve())')"
          chmod go-w "$interpreter"
          mode="$(stat -c '%a' "$interpreter")"
          if (( (8#$mode & 8#022) != 0 )); then
            echo "hosted interpreter remains group/world-writable" >&2
            exit 2
          fi
      - name: Full POSIX validation
        shell: bash
        run: bash validate_linux_macos.sh
