name: SEC-229 POSIX proof

on:
  push:
    branches:
      - security-sec229-posix-runtime-write-permissions

permissions:
  contents: read

jobs:
  posix:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Contain hosted toolcache interpreter permissions
        shell: bash
        run: |
          interpreter="$(python3 -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve())')"
          chmod go-w "$interpreter"
          mode="$(stat -c '%a' "$interpreter")"
          if (( (8#$mode & 8#022) != 0 )); then
            echo "hosted interpreter remains group/world-writable" >&2
            exit 2
          fi
      - name: Build hash-locked POSIX runtime
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -m venv .venv
          .venv/bin/python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-toolchain.lock
          .venv/bin/python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-posix.lock
          .venv/bin/python -m pip install --no-build-isolation --no-deps -e ".[legacy-mldsa-recovery]"
          .venv/bin/python -m pip check
      - name: SEC-229 dynamic POSIX regression
        shell: bash
        run: .venv/bin/python security_sec229_posix_runtime_write_permissions_spec.py
      - name: Runtime provenance stamp and pre-exec check
        shell: bash
        run: |
          .venv/bin/python runtime_provenance.py stamp
          bash ensure_runtime.sh
