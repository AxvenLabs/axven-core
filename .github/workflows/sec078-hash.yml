name: SEC-078 Hash Probe
on: [push]
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash changed release files
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib
          wallet_data = pathlib.Path("wallet.py").read_bytes()
          spec_data = pathlib.Path("security_sec078_wallet_backup_envelope_bounds_spec.py").read_bytes()
          print(f"HASH wallet.py bytes={len(wallet_data)} sha256={hashlib.sha256(wallet_data).hexdigest()}")
          print(f"HASH security_sec078_wallet_backup_envelope_bounds_spec.py bytes={len(spec_data)} sha256={hashlib.sha256(spec_data).hexdigest()}")
          manifest = json.loads(pathlib.Path("release_manifest.json").read_text(encoding="utf-8"))
          manifest["files"]["wallet.py"] = {
              "bytes": len(wallet_data),
              "sha256": hashlib.sha256(wallet_data).hexdigest(),
          }
          final = (json.dumps(manifest, indent=2) + "\n").encode("utf-8")
          print("MANIFEST_BASE64=" + base64.b64encode(final).decode("ascii"))
          print(f"MANIFEST bytes={len(final)} sha256={hashlib.sha256(final).hexdigest()}")
          PY
