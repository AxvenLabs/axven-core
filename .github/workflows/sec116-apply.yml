name: SEC-116 Apply

on:
  push:
    branches:
      - security-sec116-sidefork-path-work-bounds

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security-sec116-sidefork-path-work-bounds
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply and validate SEC-116
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/sec116_apply.py
          python consensus_rebuild_test.py
          python security_sec106_sidechain_state_validation_spec.py
          python security_sec112_sidechain_retention_bounds_spec.py
          python security_sec116_sidefork_path_work_spec.py
          python devnet_rehearsal.py
          python release_packaging_test.py
      - name: Commit clean SEC-116 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item .github/sec116_apply.py
          Remove-Item .github/workflows/sec116-apply.yml
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SEC-116: Bound side-fork active-chain traversal"
          git push origin HEAD:security-sec116-sidefork-path-work-bounds
