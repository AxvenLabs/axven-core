name: SEC-141 Apply

on:
  push:
    branches:
      - security-sec141-recipient-type-domain

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install -e .
      - name: Apply SEC-141
        shell: pwsh
        run: python .github/sec141_apply.py
      - name: Focused regression
        shell: pwsh
        run: |
          python security_sec054_recipient_address_bounds_spec.py
          python security_sec140_scheme_type_domain_spec.py
          python security_sec141_recipient_type_domain_spec.py
      - name: Remove one-shot automation
        shell: pwsh
        run: |
          git rm .github/sec141_apply.py
          git rm .github/workflows/sec141-apply.yml
      - name: Validate clean candidate
        shell: pwsh
        run: |
          git diff --check
          python release_packaging_test.py
          python security_tail_runner.py
      - name: Commit clean SEC-141 candidate
        shell: pwsh
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git add -A
          git commit -m "SEC-141: Enforce exact recipient selector types"
          git push origin HEAD:security-sec141-recipient-type-domain
