name: SEC-223 Fail-First

on:
  push:
    branches:
      - security-sec223-bounded-propagation-fanout

permissions:
  contents: read

jobs:
  red:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.1.0
        with:
          python-version: '3.13.15'
          check-latest: false
      - name: Install hash-locked runtime
        shell: pwsh
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-toolchain.lock
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-ci-runtime-windows.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Run SEC-223 fail-first contract
        run: python security_sec223_bounded_propagation_fanout_spec.py
