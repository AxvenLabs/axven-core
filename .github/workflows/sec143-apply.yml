name: SEC-143 Apply

on:
  workflow_dispatch:
  push:
    branches:
      - security-sec143-peer-host-type-domain

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply SEC-143
        shell: pwsh
        run: |
          python .github/sec143_apply.py
      - name: Remove one-shot automation
        shell: pwsh
        run: |
          Remove-Item .github/sec143_apply.py
          Remove-Item .github/workflows/sec143-apply.yml
      - name: Focused validation
        shell: pwsh
        run: |
          python security_sec049_peer_host_bounds_spec.py
          python security_sec050_sync_peer_host_bounds_spec.py
          python security_sec051_p2p_listener_host_bounds_spec.py
          python security_sec143_peer_host_type_domain_spec.py
          python release_packaging_test.py
      - name: Commit hardened tree
        shell: pwsh
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SEC-143: Enforce exact peer host types"
          git push origin HEAD:security-sec143-peer-host-type-domain
