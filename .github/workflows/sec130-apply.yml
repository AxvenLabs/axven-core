name: SEC-130 apply clean RPC complexity hardening

on:
  push:
    branches:
      - security-sec130-rpc-json-preparse-complexity-clean
    paths:
      - .github/workflows/sec130-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Apply and verify SEC-130
        shell: pwsh
        run: |
          git fetch origin security-sec128-rpc-json-preparse-complexity
          python .github/sec130_apply.py
          git config user.name "AxvenLabs Security Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rpc.py release_manifest.json security_sec130_rpc_json_preparse_complexity_spec.py
          git rm .github/sec130_apply.py .github/workflows/sec130-apply.yml
          git commit -m "SEC-130: Bound RPC JSON fan-out before parsing"
          git push origin HEAD:security-sec130-rpc-json-preparse-complexity-clean
