name: SEC-110 Apply

on:
  push:
    branches:
      - security-sec110-peer-config-atomic-file-clean

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security-sec110-peer-config-atomic-file-clean
          fetch-depth: 1
          persist-credentials: true
      - name: Install project
        run: python -m pip install -e .
      - name: Apply SEC-110 patch
        run: python .github/sec110_apply.py
      - name: Validate and commit clean tree
        shell: bash
        run: |
          python security_sec110_peer_config_atomic_file_spec.py
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/sec110-apply.yml .github/sec110_apply.py
          git add datadir.py security_sec110_peer_config_atomic_file_spec.py release_manifest.json
          git diff --cached --check
          git commit -m "SEC-110: Harden peer config file writes"
          git push origin HEAD:security-sec110-peer-config-atomic-file-clean
