name: SEC-107 Manifest Refresh

on:
  push:
    branches:
      - security-sec107-actions-immutable-pins-clean

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security-sec107-actions-immutable-pins-clean
          fetch-depth: 1
      - name: Refresh SEC-107 manifest pins
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path('release_manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for name in (
              '.github/workflows/validation.yml',
              'security_sec107_github_actions_immutable_pins_spec.py',
          ):
              data = Path(name).read_bytes()
              manifest['files'][name] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          manifest['files'] = dict(sorted(manifest['files'].items()))
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
      - name: Commit clean SEC-107 tree
        shell: bash
        run: |
          git config user.name "AxvenLabs Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/sec107-manifest-refresh.yml
          git add release_manifest.json
          git diff --cached --check
          python security_sec107_github_actions_immutable_pins_spec.py
          git commit -m "SEC-107: Refresh immutable workflow manifest pins"
          git push origin HEAD:security-sec107-actions-immutable-pins-clean
