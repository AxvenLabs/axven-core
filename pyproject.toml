[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[project]
name = "axven-core"
version = "0.9.0.dev9"
description = "Axven Core devnet rebuild"
requires-python = ">=3.13.15,<3.14"
dependencies = [
  "cryptography==50.0.1",
  "dilithium-py==1.4.0",
  "cffi==2.1.1",
  "pycparser==3.0",
]

[project.scripts]
axven-core = "axven_core:main"
axven-cli = "axven_cli:main"
axven-doctor = "doctor:main"
axven-console = "axven_console:main"

[tool.setuptools]
py-modules = [
  "axven",
  "wallet",
  "p2p",
  "p2p_tx_bounds",
  "core",
  "rpc",
  "datadir",
  "axven_core",
  "axven_cli",
  "doctor",
  "explorer",
  "axven_console",
]
