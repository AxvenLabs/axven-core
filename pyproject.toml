[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axven-core"
version = "0.9.0.dev9"
description = "Axven Core devnet rebuild"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=46",
  "dilithium-py==1.4.0",
]

[project.scripts]
axven-core = "axven_core:main"
axven-cli = "axven_cli:main"
axven-doctor = "doctor:main"
axven-console = "axven_console:main"

[tool.setuptools]
py-modules = [
  "axven",
  "wallet",
  "p2p",
  "core",
  "rpc",
  "datadir",
  "axven_core",
  "axven_cli",
  "doctor",
  "explorer",
  "axven_console",
]
